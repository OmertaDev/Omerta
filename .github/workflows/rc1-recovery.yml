name: Dashboard all-command browser diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  LEGAL_OPERATOR_NAME: CI Test Operator
  LEGAL_POSTAL_ADDRESS: 123 Fixture Street, Test City
  PRIVACY_CONTACT_EMAIL: privacy@example.test
  DMCA_AGENT_NAME: CI Test Agent
  DMCA_AGENT_EMAIL: copyright@example.test
  DMCA_AGENT_ADDRESS: 123 Fixture Street, Test City
  DMCA_AGENT_PHONE: '+1 202 555 0100'
  DMCA_AGENT_REGISTERED: 'true'
  PAYMENT_REFUND_POLICY: Test fixture policy; not a production policy.
  CHAIN_ENABLED: 'off'
  AGENT_CHAIN_ENABLED: 'off'
  CASHOUT_ENABLED: 'off'
jobs:
  browser:
    name: All existing browser commands; diagnostic only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'f4d796e258db8713a91ce48190f9747aa0ea1ea5'
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: npm ci
      - id: chromium
        run: npx playwright-core install --with-deps chromium
      - name: 'node test/launch-invites-browser.js'
        id: probe01
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/launch-invites-browser.js
      - name: 'node test/player-intel-browser.js'
        id: probe02
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/player-intel-browser.js
      - name: 'node test/wallet-connect-browser.js'
        id: probe03
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/wallet-connect-browser.js
      - name: 'node test/city-scene-browser.js'
        id: probe04
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/city-scene-browser.js
      - name: 'node test/city-activity-browser.js'
        id: probe05
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/city-activity-browser.js
      - name: 'node test/city-dashboard-host-browser.js'
        id: probe06
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/city-dashboard-host-browser.js
      - name: 'node test/world-fieldwork-browser.js'
        id: probe07
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/world-fieldwork-browser.js
      - name: 'node test/city-presence-browser.js'
        id: probe08
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/city-presence-browser.js
      - name: 'node test/city-world-ui-browser.js'
        id: probe09
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/city-world-ui-browser.js
      - name: 'node test/city-world-host-browser.js'
        id: probe10
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/city-world-host-browser.js
      - name: 'node test/city-district-arcs-browser.js'
        id: probe11
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/city-district-arcs-browser.js
      - name: 'node test/city-gameplay-panels-browser.js'
        id: probe12
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/city-gameplay-panels-browser.js
      - name: 'node test/deed-discovery-ui.js'
        id: probe13
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/deed-discovery-ui.js
      - name: 'node test/deedbuildings-browser.js'
        id: probe14
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/deedbuildings-browser.js
      - name: 'node test/property-quest-city-browser.js'
        id: probe15
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/property-quest-city-browser.js
      - name: 'node test/consigliere-recovery-browser.js'
        id: probe16
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: node test/consigliere-recovery-browser.js
      - name: 'node tools/mobile.js'
        id: probe17
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        env:
          JWT_SECRET: ci-jwt-secret-not-a-real-one
          MOD_KEY: ci-mod-key-long-enough-to-pass-preflight
          MARKET_SEED: ciMarketSeed7Qx2mVb9PwLn4RtY6hJc
          SOCIAL_VERIFY_MODE: 'off'
          POPULATION_OFF: 'on'
        run: node tools/mobile.js
      - name: Require normal success from every diagnostic command
        if: always()
        env:
          OUTCOMES: '{"node test/launch-invites-browser.js":"${{ steps.probe01.outcome }}","node test/player-intel-browser.js":"${{ steps.probe02.outcome }}","node test/wallet-connect-browser.js":"${{ steps.probe03.outcome }}","node test/city-scene-browser.js":"${{ steps.probe04.outcome }}","node test/city-activity-browser.js":"${{ steps.probe05.outcome }}","node test/city-dashboard-host-browser.js":"${{ steps.probe06.outcome }}","node test/world-fieldwork-browser.js":"${{ steps.probe07.outcome }}","node test/city-presence-browser.js":"${{ steps.probe08.outcome }}","node test/city-world-ui-browser.js":"${{ steps.probe09.outcome }}","node test/city-world-host-browser.js":"${{ steps.probe10.outcome }}","node test/city-district-arcs-browser.js":"${{ steps.probe11.outcome }}","node test/city-gameplay-panels-browser.js":"${{ steps.probe12.outcome }}","node test/deed-discovery-ui.js":"${{ steps.probe13.outcome }}","node test/deedbuildings-browser.js":"${{ steps.probe14.outcome }}","node test/property-quest-city-browser.js":"${{ steps.probe15.outcome }}","node test/consigliere-recovery-browser.js":"${{ steps.probe16.outcome }}","node tools/mobile.js":"${{ steps.probe17.outcome }}"}'
        run: |
          node -e 'const outcomes=JSON.parse(process.env.OUTCOMES);console.log(JSON.stringify({phase:"DIAGNOSTIC_ONLY",source:"f4d796e258db8713a91ce48190f9747aa0ea1ea5",outcomes}));if(Object.values(outcomes).some(value=>value!=="success"))process.exit(1)'
