name: Dashboard browser successor proof
run-name: Dashboard browser exact candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-parity-browser-${{ github.ref }}
  cancel-in-progress: false
env:
  LEGAL_OPERATOR_NAME: CI Test Operator
  LEGAL_POSTAL_ADDRESS: 123 Fixture Street, Test City
  PRIVACY_CONTACT_EMAIL: privacy@example.test
  DMCA_AGENT_NAME: CI Test Agent
  DMCA_AGENT_EMAIL: copyright@example.test
  DMCA_AGENT_ADDRESS: 123 Fixture Street, Test City
  DMCA_AGENT_PHONE: '+1 202 555 0100'
  DMCA_AGENT_REGISTERED: 'true'
  PAYMENT_REFUND_POLICY: Test fixture policy; not a production policy.
jobs:
  browser:
    name: City + mobile browser journeys
    # Standalone exact-candidate browser proof; full CI remains a separate required gate.
    runs-on: ubuntu-latest
    # Hosted a03 completed setup/early controls in 149s and the full City chain in 770s.
    # Adding the measured local mobile run (229s) and gateway (8s) projects 19m16s,
    # leaving only 44s under 20m before hosted runtime variance. Require every client
    # check on this checkout within a finite 25m hang bound. Neither a prefix result
    # nor a partial phone run qualifies it; native and fuzz budgets are unchanged.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 19f174540b0b65870800317ed98085ef36696976
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # THE CLIENT. The suite tests the API; nothing tested the screens. On 2026-07-26 a driven pass
      # found that a new player's guided onboarding showed NONE of its own content above the fold on
      # a phone — the three-column grid stacks the ~1000px character sheet above the tab content —
      # plus a horizontal-overflow bug that had been live for months. Neither was reachable from any
      # existing check. This runs a real browser at a real phone size over every screen.
      #
      # playwright-core downloads nothing on install (a browser per `npm ci` is a heavy tax on a repo
      # where most work never touches the client), so the browser is fetched here, in the one job
      # that needs it. The harness FAILS rather than skips when there is no browser — a layout guard
      # that quietly does nothing still goes green, and everyone assumes the screens were checked.
      - name: install chromium for the client harness
        run: npx playwright-core install --with-deps chromium

      - name: Invite gate and Crew invitation controls in the browser
        run: npm run test:invites:browser

      - name: Discovery-based player intel in the browser
        run: node test/player-intel-browser.js

      - name: Wallet discovery, cancellation, and signature verification in the browser
        run: node test/wallet-connect-browser.js

      - name: City Mode and RPG desktop/mobile journeys
        run: npm run test:city:browser

      - name: Earned Street Deed investigation and claim in the browser
        run: npm run test:deed-discovery:browser

      - name: Consigliere gateway recovery in the browser
        run: npm run test:gateway:browser

      - name: mobile (every screen at phone size — overflow, the fold, nav targets, page errors)
        env:
          JWT_SECRET: ci-jwt-secret-not-a-real-one
          MOD_KEY: ci-mod-key-long-enough-to-pass-preflight
          MARKET_SEED: ciMarketSeed7Qx2mVb9PwLn4RtY6hJc
          SOCIAL_VERIFY_MODE: 'off'
          POPULATION_OFF: 'on'      # residents on the streets roster would vary the screens run to run
        run: npm run mobile
