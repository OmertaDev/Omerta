name: Exact-source next-five diagnostic
run-name: Depot acquisition diagnostic at 0b01a6a9

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RC1_EVIDENCE_PUBLIC_KEY: ${{ vars.RC1_EVIDENCE_PUBLIC_KEY }}
  RC1_REPLAY_SOURCE: '0b01a6a92672f833ce1db32c21e8de4e005f2621'
  CHAIN_ENABLED: 'off'
  RESOURCE_ECONOMY: 'off'
  SOCIAL_VERIFY_MODE: 'off'
  LEGAL_OPERATOR_NAME: CI Test Operator
  LEGAL_POSTAL_ADDRESS: 123 Fixture Street, Test City
  PRIVACY_CONTACT_EMAIL: privacy@example.test
  DMCA_AGENT_NAME: CI Test Agent
  DMCA_AGENT_EMAIL: copyright@example.test
  DMCA_AGENT_ADDRESS: 123 Fixture Street, Test City
  DMCA_AGENT_PHONE: '+1 202 555 0100'
  DMCA_AGENT_REGISTERED: 'true'
  PAYMENT_REFUND_POLICY: Test fixture policy; not a production policy.

jobs:
  depot-next-five-diagnostic:
    name: Scoped depot diagnostic (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18.4']
    services:
      postgres:
        image: ${{ matrix.postgres == '16' && 'docker.io/library/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d' || 'docker.io/library/postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pgcheck
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RC1_CI_POSTGRES: ${{ matrix.postgres }}
      RC1_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/rc1-depot-next-five-diagnostic
    steps:
      - name: Check out the exact failed source
        uses: actions/checkout@v4
        with:
          ref: '0b01a6a92672f833ce1db32c21e8de4e005f2621'
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record diagnostic source and workflow identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$RC1_EVIDENCE_PUBLIC_KEY"
          mkdir -p "$RC1_DIAGNOSTIC_OUTPUT"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const sourceRevision = git('rev-parse', 'HEAD');
          assert.equal(sourceRevision, process.env.RC1_REPLAY_SOURCE);
          assert.equal(git('status', '--porcelain', '--untracked-files=all'), '');
          assert(!Object.hasOwn(process.env, 'DATABASE_URL'));
          const files = Object.fromEntries(['test/depotacquisition-next-five.js', 'tools/next-five-native.js', 'package.json', 'package-lock.json'].map(file => [file, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          const record = { sourceRevision, workflowRevision: process.env.GITHUB_SHA, workflowDefinitionRevision: process.env.GITHUB_WORKFLOW_SHA || null, workflowRef: process.env.GITHUB_WORKFLOW_REF, runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, postgresLane: process.env.RC1_CI_POSTGRES, node: process.version, command: 'node test/depotacquisition-next-five.js --postgres', files, claim: 'Single unchanged child diagnostic only; no full fifteen-proof qualification or release clearance.' };
          fs.writeFileSync(process.env.RC1_DIAGNOSTIC_OUTPUT + '/source.json', JSON.stringify(record, null, 2) + '\n');
          console.log(JSON.stringify(record));
          NODE
      - name: Install the exact source lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$RC1_DIAGNOSTIC_OUTPUT/npm-ci.log"
      - name: Allocate one fresh owned diagnostic database
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { Client } = require('pg');
          (async () => {
            const endpoint = new URL('postgresql://postgres:pgcheck@127.0.0.1:5432/postgres');
            const database = 'depot_acquisition_runtime_test_' + crypto.randomBytes(6).toString('hex');
            assert.match(database, /^depot_acquisition_runtime_test_[a-f0-9]{12}$/);
            const admin = new Client({ connectionString: endpoint.href });
            await admin.connect();
            let backend;
            try {
              backend = (await admin.query("SELECT current_user AS role,current_database() AS database,current_setting('server_version') AS version")).rows[0];
              assert.equal(backend.role, 'postgres');
              assert.equal(backend.database, 'postgres');
              assert.match(backend.version, process.env.RC1_CI_POSTGRES === '16' ? /^16\b/ : /^18\.4\b/);
              assert.equal((await admin.query('SELECT datname FROM pg_database WHERE datname=$1', [database])).rows.length, 0);
              await admin.query('CREATE DATABASE ' + database);
              assert.equal((await admin.query('SELECT pg_get_userbyid(datdba) AS owner FROM pg_database WHERE datname=$1', [database])).rows[0].owner, 'postgres');
            } finally { await admin.end(); }
            endpoint.pathname = '/' + database;
            const fresh = new Client({ connectionString: endpoint.href });
            await fresh.connect();
            try {
              assert.equal((await fresh.query("SELECT COUNT(*)::int AS n FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','S','v','m','f')")).rows[0].n, 0);
              assert.equal((await fresh.query('SELECT current_user AS role,current_database() AS database')).rows[0].database, database);
            } finally { await fresh.end(); }
            fs.appendFileSync(process.env.GITHUB_ENV, 'DEPOT_ACQUISITION_RUNTIME_TEST_DATABASE_URL=' + endpoint.href + '\n');
            const record = { backend, host: endpoint.hostname, port: endpoint.port, role: endpoint.username, database, fresh: true, lifetime: 'This disposable GitHub job service only' };
            fs.writeFileSync(process.env.RC1_DIAGNOSTIC_OUTPUT + '/database.json', JSON.stringify(record, null, 2) + '\n');
            console.log(JSON.stringify(record));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Run the unchanged failing child and preserve its exit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC1_REPLAY_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
          set +e
          node test/depotacquisition-next-five.js --postgres 2>&1 | tee "$RC1_DIAGNOSTIC_OUTPUT/depotacquisition-next-five.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$RC1_DIAGNOSTIC_OUTPUT/child-exit-code.txt"
          printf '%s\n' "${statuses[1]}" > "$RC1_DIAGNOSTIC_OUTPUT/log-exit-code.txt"
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - name: Index diagnostic files after success or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const folder = process.env.RC1_DIAGNOSTIC_OUTPUT;
          fs.mkdirSync(folder, { recursive: true, mode: 0o700 });
          const files = fs.readdirSync(folder).sort().filter(name => name !== 'index.json').map(name => ({ name, bytes: fs.statSync(folder + '/' + name).size, sha256: crypto.createHash('sha256').update(fs.readFileSync(folder + '/' + name)).digest('hex') }));
          const sourceRevision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const index = { sourceRevision, workflowRevision: process.env.GITHUB_SHA, workflowDefinitionRevision: process.env.GITHUB_WORKFLOW_SHA || null, workflowRef: process.env.GITHUB_WORKFLOW_REF, runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, postgresLane: process.env.RC1_CI_POSTGRES, files, claim: 'Diagnostic evidence index; a missing or failed child is not a pass. No full fifteen-proof qualification.' };
          fs.writeFileSync(folder + '/index.json', JSON.stringify(index, null, 2) + '\n');
          console.log(JSON.stringify(index));
          NODE
      - name: Encrypt restricted diagnostic evidence
        if: always()
        run: node tools/rc1-ci-retain.mjs
      - name: Retain authenticated encrypted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-private-next-five-diagnostic-pg${{ matrix.postgres }}-0b01a6a9-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc1-retention/evidence.rc1enc
          if-no-files-found: error
          retention-days: 30
