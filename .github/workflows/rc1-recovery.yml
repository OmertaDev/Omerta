name: Hosted Git identity seed (capture only)
run-name: Hosted Git identity seed — no sourcePAIR or runtime approval
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-git-seed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Capture public executable and package provenance only
        id: capture
        run: node tools/hosted-git-identity-seed.mjs
      - name: Retain public capture for independent distribution review
        if: always() && steps.capture.outputs.artifactPath != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-git-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.capture.outputs.artifactPath }}
          if-no-files-found: error
          retention-days: 7