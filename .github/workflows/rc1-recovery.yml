name: RC1 Linux termination and recovery

on:
  push:
    branches: [codex/rc1-closure-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-sigterm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rc1_recovery
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COORDINATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rc1_recovery
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rc1_recovery
      RC1_SHUTDOWN_EVIDENCE: ${{ github.workspace }}/tmp/rc1-linux-recovery
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record exact candidate and runtime
        run: |
          mkdir -p "$RC1_SHUTDOWN_EVIDENCE"
          git rev-parse HEAD | tee "$RC1_SHUTDOWN_EVIDENCE/source-sha.txt"
          node --version | tee "$RC1_SHUTDOWN_EVIDENCE/node-version.txt"
          psql "$DATABASE_URL" -Atc 'SELECT version()' | tee "$RC1_SHUTDOWN_EVIDENCE/postgres-version.txt"
      - name: PostgreSQL16 partial migration failure and retry
        run: |
          set -o pipefail
          npm run test:db-migration:postgres 2>&1 | tee "$RC1_SHUTDOWN_EVIDENCE/migration-failure.log"
      - name: Native backup, private file permissions and restore on Linux
        if: '!cancelled()'
        run: |
          set -o pipefail
          npm run backup:selftest 2>&1 | tee "$RC1_SHUTDOWN_EVIDENCE/backup-selftest.log"
      - name: Nine production-process termination barriers
        if: '!cancelled()'
        run: |
          set -o pipefail
          node tools/rc1-shutdown.js 2>&1 | tee "$RC1_SHUTDOWN_EVIDENCE/shutdown.log"
      - name: Retain exact-revision process logs and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-linux-recovery-${{ github.sha }}
          path: tmp/rc1-linux-recovery/
          if-no-files-found: error
          retention-days: 30
