          RC1_WORLD_OUTPUT: ${{ runner.temp }}/rc1-continuation-observe
        run: |
          umask 077
          npm run test:rc1:alliance-continuation:postgres -- --resume="$RUNNER_TEMP/rc1-continuation-reference" --compare-uninterrupted="$RUNNER_TEMP/rc1-continuation-reference"
      - name: Replay continuation from the identical native checkpoint
        id: replay
        if: steps.continuation.outcome == 'success'
        env:
          RC1_WORLD_OUTPUT: ${{ runner.temp }}/rc1-continuation-replay
        run: |
          umask 077
          npm run test:rc1:alliance-continuation:postgres -- --resume="$RUNNER_TEMP/rc1-continuation-reference" --compare-uninterrupted="$RUNNER_TEMP/rc1-continuation-reference" --replay="$RUNNER_TEMP/rc1-continuation-observe"
      - name: Verify complete prefix lineage and all continuation artifacts
        if: steps.replay.outcome == 'success'
        run: |
          umask 077
          node test/rc1-alliance-continuation-native-audit.js --reference="$RUNNER_TEMP/rc1-continuation-reference" --continued="$RUNNER_TEMP/rc1-continuation-observe" --replay="$RUNNER_TEMP/rc1-continuation-replay" --output="$RUNNER_TEMP/rc1-continuation-audit.json"
      - name: Encrypt restricted execution evidence
        if: always()
        run: node tools/rc1-ci-retain.mjs
      - name: Retain authenticated encrypted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-private-continuation-pg18.4-${{ github.sha }}
          path: ${{ runner.temp }}/rc1-retention/evidence.rc1enc
          if-no-files-found: error
          retention-days: 30
