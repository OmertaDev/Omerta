name: Economy hardening

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  economy-hardening:
    name: economy-hardening (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18.4']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: pgcheck
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Set owned test PostgreSQL lock capacity for populated migrations
        timeout-minutes: 3
        shell: bash
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$POSTGRES_SERVICE_ID" =~ ^[0-9a-f]{64}$ ]] || { echo 'Missing owned PostgreSQL service container ID' >&2; exit 1; }
          timeout 15s docker exec "$POSTGRES_SERVICE_ID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'ALTER SYSTEM SET max_locks_per_transaction = 512;'
          timeout 45s docker restart --timeout 30 "$POSTGRES_SERVICE_ID"
          ready=0
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            if timeout 3s docker exec "$POSTGRES_SERVICE_ID" pg_isready -q -t 1 -U postgres -d postgres; then
              ready=1
              break
            fi
            sleep 1
          done
          [[ "$ready" == 1 ]] || { echo 'Owned PostgreSQL service did not become ready within 60 seconds' >&2; exit 1; }
          actual="$(timeout 10s docker exec "$POSTGRES_SERVICE_ID" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc 'SHOW max_locks_per_transaction;')"
          [[ "$actual" == 512 ]] || { echo "Unexpected test max_locks_per_transaction: $actual" >&2; exit 1; }
      - name: In-memory exploit and pacing regressions
        run: >-
          node test/economy-hardening-source-compatibility.js &&
          node test/economy-invariant-hardening.js &&
          node test/checkin-lineage.js &&
          node test/daily-lineage.js &&
          node test/mastery-partition.js &&
          node test/population-goods-liquidity.js &&
          node test/action-cooldowns.js &&
          node test/secondary-cooldowns.js &&
          node test/cooldown-surfaces.js &&
          node test/economy-balance.js &&
          node test/economy-monitor.js &&
          node test/economy-composition.js &&
          node test/cooldown-surfaces-browser.js
      - name: Create isolated native databases
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55442'
          PGUSER: postgres
          PGPASSWORD: pgcheck
        run: |
          createdb omerta_cooldown_test
          createdb checkin_lineage_test
          createdb daily_lineage_test
          createdb crew_wage_migration_test
          createdb social_receipt_test
          createdb omerta_economy_composition_test
      - name: PostgreSQL cooldown and lineage races
        env:
          COOLDOWN_TEST_DATABASE_URL: postgresql://postgres:pgcheck@127.0.0.1:55442/omerta_cooldown_test
          CHECKIN_LINEAGE_TEST_DATABASE_URL: postgresql://postgres:pgcheck@127.0.0.1:55442/checkin_lineage_test
          DAILY_LINEAGE_TEST_DATABASE_URL: postgresql://postgres:pgcheck@127.0.0.1:55442/daily_lineage_test
          CREW_WAGE_TEST_DATABASE_URL: postgresql://postgres:pgcheck@127.0.0.1:55442/crew_wage_migration_test
          SOCIAL_RECEIPT_TEST_DATABASE_URL: postgresql://postgres:pgcheck@127.0.0.1:55442/social_receipt_test
          DB_BOOT_TEST_ADMIN_URL: postgresql://postgres:pgcheck@127.0.0.1:55442/postgres
          LEGAL_OPERATOR_NAME: CI Test Operator
          LEGAL_POSTAL_ADDRESS: 123 Fixture Street, Test City
          PRIVACY_CONTACT_EMAIL: privacy@example.test
          DMCA_AGENT_NAME: CI Test Agent
          DMCA_AGENT_EMAIL: copyright@example.test
          DMCA_AGENT_ADDRESS: 123 Fixture Street, Test City
          DMCA_AGENT_PHONE: +1 202 555 0100
          DMCA_AGENT_REGISTERED: 'true'
          PAYMENT_REFUND_POLICY: Test fixture policy; no payments.
          MARKET_SEED: daily-lineage-market-seed-1-20261021
          SOCIAL_VERIFY_MODE: 'off'
          INVITE_MODE: 'off'
        run: |
          node test/action-cooldowns.js --postgres
          node test/checkin-lineage.js --postgres
          node test/daily-lineage.js --postgres
          node test/crew-wage-postgres.js
          node test/social-receipt-postgres.js
          node test/db-boot-lock-postgres.js
      - name: PostgreSQL economic monitoring and mixed workflow exploit proofs
        env:
          ECONOMY_MONITOR_TEST_DATABASE_URL: postgresql://postgres:pgcheck@127.0.0.1:55442/postgres
          ECONOMY_COMPOSITION_TEST_DATABASE_URL: postgresql://postgres:pgcheck@127.0.0.1:55442/omerta_economy_composition_test
        run: |
          node test/economy-monitor.js --postgres
          node test/economy-composition.js --postgres
