name: forge test (contracts)

# The pre-mainnet gate the sandboxed build environment can't run (Foundry's release binaries are
# egress-blocked there). GitHub's runners have open internet, so `forge test` — the OMERTÀ Solidity
# suite (unit + 512-run fuzz) — runs here on every push/PR that touches the contracts. Mirrors
# omerta-contracts/run-forge-test.sh: solc 0.8.26 (foundry.toml), OpenZeppelin v5.6.1, forge-std v1.9.6.

on:
  push:
    branches: [main]               # branch pushes run once via pull_request — not twice
    paths:
      - 'omerta-contracts/**'
      - '.github/workflows/forge.yml'
      - 'src/dexbot.js'                # the v4 encodings the fork prover below executes
      - 'tools/dexbot-e2e.js'
      - 'src/stockdeliver.js'          # the 6551 + StockVault legs the second prover executes
      - 'tools/stock-e2e.js'
  pull_request:
    paths:
      - 'omerta-contracts/**'
      - '.github/workflows/forge.yml'
      - 'src/dexbot.js'
      - 'tools/dexbot-e2e.js'
      - 'src/stockdeliver.js'
      - 'tools/stock-e2e.js'
  workflow_dispatch: {}

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omerta-contracts
    steps:
      - uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Deps aren't committed as submodules — fetch them into lib/ at the pinned versions the
      # contracts target (deterministic, avoids forge-install/submodule friction inside the parent
      # git repo). KEEP THIS IN LOCKSTEP WITH omerta-contracts/run-forge-test.sh — when v3 step 6
      # added the v4 hook it added v4-core to that script and not to this one, so `forge build`
      # failed to PARSE and every step below was skipped: not just the hook's tests but the OMR,
      # bond, oracle, VoucherClaim and GearVault suites that had been green for months. A red
      # contracts job is the pre-mainnet gate, so it must fail on a real regression, never on a
      # dependency this file forgot about.
      - name: Fetch dependencies
        run: |
          git clone --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          # Uniswap v4 core, for OmertaHook and its suite. From npm rather than git because the npm
          # package ships its own lib/ (forge-std, solmate, OZ) already populated, which is what
          # lets the hook tests deploy a REAL PoolManager and route REAL swaps instead of a mock.
          npm pack @uniswap/v4-core@1.0.2 >/dev/null
          mkdir -p lib/v4-core
          tar xzf uniswap-v4-core-1.0.2.tgz -C lib/v4-core --strip-components=1
          rm -f uniswap-v4-core-1.0.2.tgz

      # PARSE gate only — the SIZE gate is its own step at the END of this job, and the split is
      # load-bearing rather than tidy. `forge build --sizes` is all-or-nothing: on 2026-08-27 a test
      # harness went 906 bytes over EIP-170 and that one row failed this step, which SKIPPED
      # `forge test` and both e2e provers with it — 19 hours of a red pre-mainnet gate in which the
      # suite did not run at all, on a path-filtered workflow nobody was watching. Same shape as the
      # v4-core dependency gap recorded above, different cause. A size regression must fail on its
      # own step, after the suite has already proven the contracts work.
      - name: forge build
        run: forge build

      - name: forge test (unit + fuzz)
        run: forge test -vvv

      # THE v4 ENCODINGS, ON A REAL POOL. `test/dexbot.js` proves the bots' orchestration behind
      # their `__set*` seams; this proves the BYTES — it runs both bots UNSEAMED against a real
      # PoolManager / PositionManager / Universal Router / Permit2 on anvil. It belongs in this job
      # because it needs exactly what this job already has: a Foundry toolchain (anvil) and the
      # `out/` artifacts `forge build` just produced. Everything else comes from npm.
      #
      # It is a REAL gate, not decoration: the first run found bonded POL ETH being stranded in the
      # PositionManager (v4 never refunds over-sent msg.value) — 0.148 ETH of 1 ETH at a 15%
      # oracle-vs-spot gap, invisible to every other check because the journal booked the full ETH.
      - name: v4 encodings on a real pool (dexbot-e2e)
        working-directory: .
        run: |
          npm ci --omit=dev
          npm i --no-save --prefix /tmp/v4deps \
            @uniswap/v4-periphery@1.0.3 @uniswap/universal-router@2.1.0
          V4_DEPS=/tmp/v4deps/node_modules npm run dexbot-e2e

      # THE STOCK RAIL, ON A REAL CHAIN. `test/stockdeliver.js` proves the orchestration behind the
      # `__setTbaResolver` / `__setTxSender` seams; this proves the BYTES — `resolveTbaOnchain` and
      # `sendDeliverOnchain` execute against the REAL ERC-6551 registry (the reference
      # implementation, vendored unmodified under omerta-contracts/test/vendor) plus our own
      # StreetDeed and StockVault. Same job, same reason: it needs anvil and the `out/` artifacts.
      #
      # The stakes are higher here than for the DEX bots. §3.3's gateless push means the ADDRESS is
      # the only thing between the treasury and a permanent loss: get it wrong and real tokenized
      # stock lands somewhere nothing recovers it from, with every units-denominated invariant green.
      - name: the stock rail on a real chain (stock-e2e)
        working-directory: .
        run: npm run stock-e2e

      # THE SIZE GATE, LAST ON PURPOSE. Runs after the suite and both provers so an over-limit
      # contract fails on its own step and can never skip them (see the note on `forge build`).
      #
      # FuzzTester deliberately composes every stateful handler into one Medusa/Echidna target and
      # disables their code-size check; it is never deployed. Keep EIP-170 as a hard gate for every
      # production/test contract while excluding only that synthetic 27KB harness from the table —
      # never a second `--skip` for a harness that got too big. A typed factory embeds its target's
      # INITCODE in its own RUNTIME code, so a `new Vault(...)` helper is over the limit whenever the
      # vault's initcode is; deploy from calldata with raw `create` instead (O1CreateFactory /
      # A1Task4RawCreateFactory), which costs a few hundred bytes and keeps this gate's claim true.
      - name: forge build --sizes (EIP-170)
        working-directory: omerta-contracts
        run: forge build --sizes --skip FuzzTester
