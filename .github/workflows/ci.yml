name: ci

# The three gates the codebase already treats as required, run automatically instead of by hand.
# Until now they only ran when someone typed the command — which is how, on 2026-07-25, a change
# that killed the API process on every database restart reached production. That bug was reachable
# ONLY from real Postgres, so `pgcheck` below is the one that would have caught it.
#
#   npm test   — every suite under test/, on pg-mem, in-process. No database, no network.
#   pgcheck    — the same server against REAL Postgres: pooling, row locks, timeouts, the migration.
#   sim        — the economy harness; asserts the §10.4 ledger sweep is drift-0 end to end.

on:
  push:
    branches: [main]               # branch pushes run once via pull_request — not twice
    paths-ignore:
      - 'omerta-contracts/**'      # covered by forge.yml
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'omerta-contracts/**'
      - '**/*.md'
  workflow_dispatch: {}

concurrency:                        # a new push supersedes an in-flight run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: suites + sim (pg-mem)
    runs-on: ubuntu-latest
    # A HANG bound, never a performance budget. Measured on this job across four runs:
    # 14.3m / 17.8m / 18.8m / 20.3m — so at 20 it was passing on runner luck, and the
    # 20.3 was CANCELLED (a timeout-minutes expiry reports as `cancelled`, not `failure`,
    # which reads exactly like a supersede). It was not a regression: between the last
    # green run and that one the only diff was prose and knowledge JSON, `mobile` got
    # FASTER (183s -> 174s), and every step grew ~9% including ones whose code is
    # byte-identical (npm ci, checkout, the chromium install). That is a slower runner.
    # A red that fires on runner variance is worse than no red, because it teaches people
    # that red means nothing. 30 is ~1.6x the measured cost and still far below anything
    # that could be a wedged browser or a spinning suite. The sibling job below stays at
    # 20 on purpose: it measures 3.5-4.2m, so it has 5x headroom and needs nothing.
    timeout-minutes: 30
    steps:
      # The knowledge-plane gate inventories the full Git lineage (800+ commits) and
      # compares generated artifacts at their recorded source revision. A shallow
      # checkout cannot resolve that revision and makes the last test fail despite
      # every application suite passing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The knowledge artifacts are REVISION-STAMPED (graph.json records its own sourceRevision and
      # carries the git lineage as ~1,200 Commit nodes), so on `push: main` they are necessarily
      # stamped from whichever branch generated them and the byte-comparison in `npm test` cannot be
      # green. That red says nothing about anyone's code: the PR run tests the exact tree about to
      # land via the synthetic-merge hatch, so genuine staleness is already gated there. What was
      # left on main was a red that always fires and never means anything — the kind that teaches
      # people to scroll past red on main, which is how the 2026-07-30 outage survived seven commits.
      #
      # So on main, and only on main, the artifacts are brought to this revision before the suites
      # run. `knowledge-refresh.yml` commits the same regeneration back, so the checked-in files stop
      # claiming a branch they no longer belong to.
      - name: knowledge artifacts carry the merge's own revision (main only)
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          set -euo pipefail
          npm run knowledge
          # The commit is not optional and not about persistence: graph.json records
          # `worktreeDirty`, so a regenerated-but-uncommitted tree drifts from its own render at
          # line 4. Committing locally (never pushed from here — knowledge-refresh.yml owns that)
          # is what makes the snapshot clean, and a generated-only commit reports its PARENT as the
          # source revision, so the artifacts still describe the merge that triggered this run.
          if git diff --quiet -- knowledge/generated; then
            echo "already current for $(git rev-parse --short HEAD)"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "chore(knowledge): refresh for $(git rev-parse --short HEAD)" -- knowledge/generated
          fi

      - name: npm test (the full suite, on pg-mem)
        run: npm test

      - name: economy sim (§10.4 drift-0)
        run: npm run sim

      # THE OTHER SIDE OF THE TRADE. Every other economic proof here is about one player or about
      # conservation; neither can see a market that is perfectly accounted and completely dead. This
      # drives a town through the player-to-player markets and fails if one of them cannot be posted
      # into at all. Kept small in CI — it is a correctness gate (reachability + §10.4 under many
      # actors), not the liquidity measurement, which is what the full-size local run is for.
      - name: scale (population-scale market reachability + §10.4)
        env:
          SCALE_PLAYERS: '18'
          SCALE_DAYS: '2'
        run: npm run scale

      # THE CLIENT. The suite tests the API; nothing tested the screens. On 2026-07-26 a driven pass
      # found that a new player's guided onboarding showed NONE of its own content above the fold on
      # a phone — the three-column grid stacks the ~1000px character sheet above the tab content —
      # plus a horizontal-overflow bug that had been live for months. Neither was reachable from any
      # existing check. This runs a real browser at a real phone size over every screen.
      #
      # playwright-core downloads nothing on install (a browser per `npm ci` is a heavy tax on a repo
      # where most work never touches the client), so the browser is fetched here, in the one job
      # that needs it. The harness FAILS rather than skips when there is no browser — a layout guard
      # that quietly does nothing still goes green, and everyone assumes the screens were checked.
      - name: install chromium for the client harness
        run: npx playwright-core install --with-deps chromium

      - name: mobile (every screen at phone size — overflow, the fold, nav targets, page errors)
        env:
          JWT_SECRET: ci-jwt-secret-not-a-real-one
          MOD_KEY: ci-mod-key-long-enough-to-pass-preflight
          MARKET_SEED: ciMarketSeed7Qx2mVb9PwLn4RtY6hJc
          SOCIAL_VERIFY_MODE: 'off'
          POPULATION_OFF: 'on'      # residents on the streets roster would vary the screens run to run
        run: npm run mobile

  pgcheck:
    name: real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Pin the major to what production runs. The point of this job is fidelity, so tracking
        # `latest` here would quietly test something the deployment isn't.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pgcheck
          POSTGRES_DB: omerta_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # pgcheck §7b applies the OLDEST schema.sql in history and §7c the NEWEST one that still
      # declares an account column UUID, then boots the current build on top — what a deploy does.
      # A shallow checkout has ONE commit, so §7c finds nothing to migrate from (its anti-vacuity
      # throw is what turned this job red on 2026-09-05) and §7b's "oldest" schema is HEAD, i.e. it
      # compares a database to itself and passes over nothing. Both need the full lineage.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # FIRST, because it is the cheapest and the most diagnostic. `PREPARE`s every static SQL string
      # in src/ against the real engine: full parse and type resolution, no rows read, about a second.
      # It exists because on 2026-07-30 a `uuid = text` comparison made loadOwned fail to PARSE, which
      # 500'd every authed request for hours while all 61 pg-mem suites stayed green. pgcheck caught
      # that one only because it happens to call /v1/me; this catches the class wherever it lives, and
      # it found two more live 500s (GET /v1/rivals, GET /v1/commission) on its first run.
      - name: pgquery (every SQL string parses on real Postgres)
        env:
          DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_query
        run: |
          node -e "
            const { Client } = require('pg');
            (async () => {
              const c = new Client({ connectionString: 'postgres://postgres:pgcheck@localhost:5432/postgres' });
              await c.connect();
              await c.query('DROP DATABASE IF EXISTS omerta_query');
              await c.query('CREATE DATABASE omerta_query');
              await c.end();
            })().catch((e) => { console.error(e); process.exit(1); });
          "
          npm run pgquery

      - name: pgcheck (pooling, row locks, timeouts, migration, ledger)
        env:
          DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_check
          # Throwaway values for a throwaway database. preflight enforces real minimum strengths,
          # so these have to clear them even though nothing here is ever exposed.
          JWT_SECRET: ci-jwt-secret-not-a-real-one
          MOD_KEY: ci-mod-key-long-enough-to-pass-preflight
          MARKET_SEED: ciMarketSeed7Qx2mVb9PwLn4RtY6hJc
          SOCIAL_VERIFY_MODE: 'off'
          POPULATION_OFF: 'on'      # the resident worker would race the probe's own fixtures
        run: npm run pgcheck

      - name: stock catalog v2 finalized-observation consumer (real PostgreSQL)
        if: '!cancelled()'
        env:
          TEST_DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_check
        run: npm run test:stockcatalogv2:postgres

      # Its two siblings, which were written against a real database for the same reason and which
      # nothing had ever run — a suite that does not execute is not a guard, and it reads on the
      # summary line exactly like one that passes.
      # Each names its OWN env var, and neither reads TEST_DATABASE_URL — they SKIP without it, and
      # under CI=true they assert rather than skip, so a step handed the wrong variable name goes red
      # rather than passing having run nothing. Both namespace themselves into a private schema, so
      # sharing omerta_check with pgcheck is safe.
      - name: RWA health H1 sweep, 2,048 versions (real PostgreSQL)
        if: '!cancelled()'
        env:
          RWA_HEALTH_TEST_DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_check
        run: npm run test:rwahealth:postgres

      - name: RWA registry lifecycle persistence (real PostgreSQL)
        if: '!cancelled()'
        env:
          RWA_REGISTRY_LIFECYCLE_TEST_DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_check
        run: npm run test:rwaregistrylifecycle:postgres

      # The backup is the last line of defence and the only check nobody would notice failing — you
      # find out on the day you need a restore. Two of its verifications were written after real
      # defects (a missing `pg_restore -f -` that would have failed EVERY backup; a schema-only dump
      # passing every check while holding no rows), so they get a regression of their own.
      # `!cancelled()` on every harness below: these are INDEPENDENT checks, and until now the first
      # failure skipped all of them. When pgcheck went red on 2026-07-30 the backup self-test, chaos
      # and loadtest silently stopped running too — for eight commits — so a second regression could
      # have ridden in behind the first with nothing to catch it. A guard that stops running is a
      # guard that has been deleted.
      - name: backup self-test (dump, verify, refuse, restore)
        if: '!cancelled()'
        env:
          DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_check
        run: npm run backup:selftest

      # chaos and loadtest each need their OWN database. Both seed value by SQL, and pgcheck's ledger
      # leg asserts the identities ABSOLUTELY — it skips on a database that was not empty when it
      # started. Sharing one database would silently disable that leg. Created with the pg client the
      # project already depends on rather than psql, so this does not rely on what the runner image
      # happens to ship.
      - name: create throwaway databases for the interruption + concurrency harnesses
        if: '!cancelled()'
        env:
          DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_check
        run: |
          node -e "
            const { Client } = require('pg');
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              for (const db of ['omerta_chaos', 'omerta_load', 'omerta_conc']) {
                await c.query('DROP DATABASE IF EXISTS ' + db);
                await c.query('CREATE DATABASE ' + db);
              }
              await c.end();
            })().catch((e) => { console.error(e.message); process.exit(1); });
          "

      # THE CRASH TESTS. ~20 worker sweeps in this codebase claim to be idempotent; that claim only
      # becomes true when something kills them halfway and the second run is checked. Mutation-verified:
      # delete the src/db.js checked-out-client error handler and the whole process dies on any
      # mid-transaction connection loss — which is not exotic, it is what a failover or our own
      # idle-in-transaction timeout does. Nothing automatic protected that until this harness.
      # (The wage-epoch crash-resume scenario retired with the faucet — economy v3 step 1 — so there
      # is no payer left to interrupt and no emission a crash could double.)
      #
      # Scenario 3 (stop and start Postgres entirely) needs pg_ctl on the database host, which a
      # service container does not give us. The harness SKIPS it and says so rather than faking it,
      # and its summary line stops claiming the outage path was covered. Run it by hand against a
      # local Postgres before a deploy that touches the pool or a transaction boundary.
      - name: chaos (interrupted sweeps, killed backends, torn two-party transfers)
        if: '!cancelled()'
        env:
          DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_chaos
          JWT_SECRET: ci-jwt-secret-not-a-real-one
          MOD_KEY: ci-mod-key-long-enough-to-pass-preflight
          MARKET_SEED: ciMarketSeed7Qx2mVb9PwLn4RtY6hJc
          SOCIAL_VERIFY_MODE: 'off'
          POPULATION_OFF: 'on'      # resident spawning would race the harness's own fixtures
        run: npm run chaos

      # Concurrency. Every other §10.4 proof in the repo is SEQUENTIAL, and lost updates live in the
      # overlap between requests. This also reads pg_stat_database.deadlocks directly, because 40P01
      # is retried as `contention` — a lock-order bug can fire constantly while every request succeeds.
      # Deliberately a small field: this is a correctness gate, not a benchmark, and a shared runner's
      # req/s figure means nothing anyway.
      - name: loadtest (concurrent players, deadlock counter, §10.4 delta)
        if: '!cancelled()'
        env:
          DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_load
          JWT_SECRET: ci-jwt-secret-not-a-real-one
          MOD_KEY: ci-mod-key-long-enough-to-pass-preflight
          MARKET_SEED: ciMarketSeed7Qx2mVb9PwLn4RtY6hJc
          SOCIAL_VERIFY_MODE: 'off'
          POPULATION_OFF: 'on'
          LOAD_PLAYERS: '8'
        run: npm run loadtest

      # Lost-update CORRECTNESS, asserted. loadtest proves the storm doesn't deadlock and §10.4 holds
      # in aggregate; it spreads players across their OWN rows, so it never drives many writers at ONE
      # contended object or asserts an exactly-once property. This does: an idempotency key executes
      # once, one escrow has one winner, a symmetric AB-BA transfer conserves value with no 500, and a
      # two-party house take is exact — the class of bug pg-mem physically cannot exercise, which is why
      # every recent fix in it shipped as a "source-level tripwire" that no suite could actually run.
      - name: concurrency (idempotency exactly-once, single-winner escrow, AB-BA, exact take)
        if: '!cancelled()'
        env:
          DATABASE_URL: postgres://postgres:pgcheck@localhost:5432/omerta_conc
          JWT_SECRET: ci-jwt-secret-not-a-real-one
          MOD_KEY: ci-mod-key-long-enough-to-pass-preflight
          MARKET_SEED: ciMarketSeed7Qx2mVb9PwLn4RtY6hJc
          SOCIAL_VERIFY_MODE: 'off'
          POPULATION_OFF: 'on'
        run: npm run concurrency
