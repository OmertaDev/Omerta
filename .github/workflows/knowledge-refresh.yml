name: knowledge refresh

# Temporary repair runner. The released source stays pinned to the approved PR.
# The helper workflow commit is never pushed to the release branch.
on:
  workflow_dispatch: {}

concurrency:
  group: knowledge-repair-019aea1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: verify and publish generated knowledge for 019aea1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: '019aea1cf60f3d63e614855aa52a583091c4602e'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: git switch -C study/infamous-gangsters-rebuild 019aea1cf60f3d63e614855aa52a583091c4602e
      - run: npm ci
      - run: npm run knowledge
      - name: Verify exact generated blobs and complete tree
        run: |
          git add -- knowledge/generated
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const expected = [{"path":"knowledge/generated/github-history.md","bytes":23660,"sha":"254f5698f01e6563769b7ca51b32a654b420f968"},{"path":"knowledge/generated/graph-summary.md","bytes":1406,"sha":"35a6fdfb3eea17893779ba9cc6c616fd7ec79adf"},{"path":"knowledge/generated/graph.json","bytes":28221723,"sha":"90bde08919d93509a7446f8d939e4f4ad9818cf3"},{"path":"knowledge/generated/inventory.md","bytes":8857,"sha":"b3961cb3c7b019a952c1715a6c7b9f06bf5802fc"}];
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'), '019aea1cf60f3d63e614855aa52a583091c4602e');
          const graph = JSON.parse(fs.readFileSync('knowledge/generated/graph.json','utf8'));
          assert.equal(graph.sourceRevision, '019aea1cf60f3d63e614855aa52a583091c4602e');
          assert.equal(graph.worktreeDirty, false);
          for (const f of expected) assert.equal(git('hash-object',f.path), f.sha, f.path);
          assert.deepEqual(git('diff','--cached','--name-only').split('\n').sort(), expected.map(f=>f.path).sort());
          assert.equal(git('diff','--name-only'), '');
          assert.equal(git('write-tree'), '42d79a7725caa2af1bf0346d01f670d6f2bdadbb');
          assert.equal(git('ls-remote','--heads','origin','refs/heads/study/infamous-gangsters-rebuild').split(/\s/)[0], '019aea1cf60f3d63e614855aa52a583091c4602e');
          console.log('Exact generated files and complete release tree verified');
          JS
      - name: Publish generated-only commit to approved branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(knowledge): refresh generated artifacts for release source 019aea1"
          git push origin HEAD:refs/heads/study/infamous-gangsters-rebuild
