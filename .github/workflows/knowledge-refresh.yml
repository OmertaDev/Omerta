name: knowledge refresh

# WHY THIS EXISTS.
#
# `tools/knowledge-test.js` byte-compares the checked-in artifacts under knowledge/generated/
# against a fresh render, and those artifacts are REVISION-STAMPED: graph.json records the
# `sourceRevision` and carries the git lineage as ~1,200 first-class Commit nodes. So whichever
# branch last regenerated is frozen into the file, and the check cannot be simultaneously green
# on a feature branch and on main. Every merge landed red on main until somebody remembered to
# push a graph refresh directly onto main — which is exactly the "merge → red → refresh → green"
# habit visible across ~20 recent main runs.
#
# That is worse than a missing gate. Ground rule 8 of this project: "a red CI that nobody reads
# is worse than no CI, because it manufactures confidence." A structural red on main trains
# people to scroll past red on main, which is the precise failure that produced the 2026-07-30
# outage (pgcheck caught a total outage on the exact commit that introduced it; seven more
# commits were pushed on top because only the pg-mem result was read).
#
# So the refresh is automated instead of remembered.
#
# SELF-TERMINATING, by the knowledge plane's own provenance rule: this job's commit touches only
# knowledge/generated/*, and `sourceRevisionForSnapshot` reports the PARENT of a generated-only
# commit. The next render therefore produces identical bytes and commits nothing. A GITHUB_TOKEN
# push also does not trigger workflows, so the loop cannot start in the first place.
#
# WHAT LANDS ON MAIN IS WHAT CI TESTED. ci.yml performs the identical regeneration on `push: main`
# and commits it LOCALLY (it never pushes), so the bytes this job pushes are the bytes the suites
# ran against — the render is deterministic at a given revision. A GITHUB_TOKEN push does not
# trigger workflows, so the resulting commit gets no ci run of its own; it does not need one, since
# its tree is the tested one.
#
# NO paths-ignore, deliberately: a merge that touches only markdown still adds commits, and
# commits are nodes in this graph.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: knowledge-refresh-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    name: regenerate knowledge/generated on main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the graph inventories the whole lineage, and a shallow clone
      # cannot resolve the recorded source revision (same reason ci.yml does this).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run knowledge

      - name: commit if the artifacts moved
        run: |
          set -euo pipefail
          if git diff --quiet -- knowledge/generated; then
            echo "knowledge/generated is already current for $(git rev-parse --short HEAD) — nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/generated
          git commit -m "chore(knowledge): refresh generated artifacts for $(git rev-parse --short HEAD)"
          git push origin HEAD:main
