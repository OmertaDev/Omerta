name: knowledge refresh

# Temporary repair runner. The released source stays pinned to the approved PR.
# The helper workflow commit is never pushed to the release branch.
on:
  workflow_dispatch: {}

concurrency:
  group: knowledge-repair-433391e
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: verify and publish generated knowledge for 433391e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: '433391eff5389bc3f40470a32d401d1a159768e2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: git switch -C study/infamous-gangsters-rebuild 433391eff5389bc3f40470a32d401d1a159768e2
      - run: npm ci
      - run: npm run knowledge
      - name: Verify exact generated blobs and complete tree
        run: |
          git add -- knowledge/generated
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const expected = [{"path":"knowledge/generated/documents.md","bytes":114149,"sha":"e195ac4a5f76046172ae2bf8e345ae5967966f2e"},{"path":"knowledge/generated/github-history.md","bytes":23666,"sha":"633b243d398d682569b2f1fec71904bd1116110d"},{"path":"knowledge/generated/graph-summary.md","bytes":1406,"sha":"d984b174e8d78c8ab8cf7cd46c757f8800e0acac"},{"path":"knowledge/generated/graph.json","bytes":28208887,"sha":"6160c1ffeaf8045748ad65b43a40ae31282b98de"},{"path":"knowledge/generated/graph.mmd","bytes":4981,"sha":"5e20ceff5a31a8500845857ca4be01afc5dfc6fb"},{"path":"knowledge/generated/inventory.md","bytes":8857,"sha":"08af7e77327ceeb9591e8b22ffb0bda6afa73476"},{"path":"knowledge/generated/modules.md","bytes":60479,"sha":"8017daf0f4592a6fad6bbaf218efaf1669df2691"},{"path":"knowledge/generated/routes.md","bytes":159620,"sha":"6aefe932ca58ffb8e0f3e388ce745e1460fff7a3"}];
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          assert.equal(git('rev-parse','HEAD'), '433391eff5389bc3f40470a32d401d1a159768e2');
          const graph = JSON.parse(fs.readFileSync('knowledge/generated/graph.json','utf8'));
          assert.equal(graph.sourceRevision, '433391eff5389bc3f40470a32d401d1a159768e2');
          assert.equal(graph.worktreeDirty, false);
          for (const f of expected) assert.equal(git('hash-object',f.path), f.sha, f.path);
          assert.deepEqual(git('diff','--cached','--name-only').split('\n').sort(), expected.map(f=>f.path).sort());
          assert.equal(git('diff','--name-only'), '');
          assert.equal(git('write-tree'), 'fefe9397b48e746551aa12214357a9dc64f52902');
          assert.equal(git('ls-remote','--heads','origin','refs/heads/study/infamous-gangsters-rebuild').split(/\s/)[0], '433391eff5389bc3f40470a32d401d1a159768e2');
          console.log('Exact generated files and complete release tree verified');
          JS
      - name: Publish generated-only commit to approved branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(knowledge): refresh generated artifacts for release source 433391e"
          git push origin HEAD:refs/heads/study/infamous-gangsters-rebuild
