name: Candidate Linux shutdown proof

on:
  workflow_dispatch:

env:
  RC1_EVIDENCE_PUBLIC_KEY: ${{ vars.RC1_EVIDENCE_PUBLIC_KEY }}
  LEGAL_OPERATOR_NAME: CI Test Operator
  LEGAL_POSTAL_ADDRESS: 123 Fixture Street, Test City
  PRIVACY_CONTACT_EMAIL: privacy@example.test
  DMCA_AGENT_NAME: CI Test Agent
  DMCA_AGENT_EMAIL: copyright@example.test
  DMCA_AGENT_ADDRESS: 123 Fixture Street, Test City
  DMCA_AGENT_PHONE: '+1 202 555 0100'
  DMCA_AGENT_REGISTERED: 'true'
  PAYMENT_REFUND_POLICY: Test fixture policy; not a production policy.

permissions:
  contents: read

jobs:
  retention-controls:
    name: Authenticated evidence transport controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'f4d796e258db8713a91ce48190f9747aa0ea1ea5'
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/rc1-ci-envelope.js

  linux-sigterm:
    needs: retention-controls
    name: Nine Linux shutdown barriers (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18.4']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rc1_recovery
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COORDINATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rc1_recovery
      RC1_SHUTDOWN_EVIDENCE: ${{ github.workspace }}/tmp/rc1-linux-sigterm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'f4d796e258db8713a91ce48190f9747aa0ea1ea5'
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require restricted evidence recipient
        run: test -n "$RC1_EVIDENCE_PUBLIC_KEY"
      - run: npm ci
      - name: Record exact candidate and runtime
        run: |
          mkdir -p "$RC1_SHUTDOWN_EVIDENCE"
          git rev-parse HEAD | tee "$RC1_SHUTDOWN_EVIDENCE/source-sha.txt"
          node --version | tee "$RC1_SHUTDOWN_EVIDENCE/node-version.txt"
          psql "$COORDINATION_TEST_DATABASE_URL" -Atc 'SELECT version()' | tee "$RC1_SHUTDOWN_EVIDENCE/postgres-version.txt"
      - name: Nine production-process termination barriers
        run: node tools/rc1-shutdown.js
      - name: Encrypt restricted execution evidence
        if: always()
        env:
          RC1_CI_POSTGRES: ${{ matrix.postgres }}
        run: node tools/rc1-ci-retain.mjs
      - name: Retain authenticated encrypted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-private-${{ github.job }}-pg${{ matrix.postgres }}-${{ github.sha }}
          path: ${{ runner.temp }}/rc1-retention/evidence.rc1enc
          if-no-files-found: error
          retention-days: 30
