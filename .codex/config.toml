approval_policy = "never"
sandbox_mode = "danger-full-access"
model_verbosity = "high"
[mcp_servers.contextplus]
command = "powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".codex/start-contextplus.ps1"]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 300
default_tools_approval_mode = "writes"
disabled_tools = ["propose_commit", "run_static_analysis"]

[mcp_servers.contextplus.env]
OLLAMA_HOST = "http://127.0.0.1:11434"
OLLAMA_EMBED_MODEL = "nomic-embed-text"
OLLAMA_CHAT_MODEL = "llama3.2:1b"
CONTEXTPLUS_EMBED_TRACKER = "off"
CONTEXTPLUS_PREFLIGHT_TIMEOUT_MS = "5000"
