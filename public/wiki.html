      status ladder (Associate to The Undertaker); lifetime reputation survives death.</p>
      ${R(`POST /v1/streets/:id/jump|search|fire|npchit|bounty · DELETE /streets/search · GET /v1/contracts [public] · /contracts/peek · /gangs/contract/:id`)}` },

  { id: 'riskpay', group: 'Risk & Death', title: 'Make Risk Pay — Loot, Safehouse, Revive', tag: 'the payoff and the shields',
    html: `${L(`A player fire-kill loots <b>25% of pocket and in-transit cash</b>, <b>50% of loose and unbonding
      $OMR</b>, and <b>20% of staked $OMR</b>. Only <b>cleared bank cash</b> is safe — staking is cheaper cover,
      never a safe harbour. NPC and mod kills loot nothing.`)}
      <p>This is why banking is a <b>timed</b> action: a deposit is exposed for 2 hours, and unstaked $OMR for 6 hours.
      <b>Safehouse</b> — the cost increases with wealth, for each 4-hour stay; a hit cannot target you, but a jump can. It
      is <b>a shield, not a base</b> (you cannot attack or move money from inside). <b>Bodyguard</b> — absorbs one lethal
      hit (never the guard's own attack). <b>Revive insurance</b> (a real-ETH token) — absorbs a lethal hit completely.</p>
      ${R(`POST /v1/safehouse · /bodyguard/offer · /bodyguard/hire/:guardId`)}` },

  { id: 'law', group: 'The Law', title: 'The Law & RICO', tag: 'the state opponent',
    html: `<p>The state reacts to your <b>heat</b>. The <b>investigation meter</b> builds from high heat and decreases
      slowly: clean → watched → investigation → <b>indicted</b>. <code>GET /v1/law</code> is your record.</p>
      <p><b>Escapes:</b> <b>bribe</b> (scales with wealth), the <b>lawyer retainer</b> ($150k for 3 days, reduces the bust
      and forfeiture), the <b>envelope</b> (90 $OMR for 7 days — halves the meter's gain, doubles its decrease).</p>
      ${L(`<b>The RICO bust</b> takes 30% of pocket and bank — but <b>staked $OMR and minted gear are safe, and it is NOT
      death.</b> If you stay offline past the grace window, the state force-busts you.`)}
      <p><b>Courtroom:</b> plea, buy the jury ($OMR), demand trial. <b>Informants:</b> <b>flip</b> a rival (drop your case,
      add exposure to them, earn the permanent <b>rat</b> badge — a rat loses omertà); <b>witness protection</b> makes you
      untargetable for a short time. The Foundation reduces family convictions; patrol hours increase convictions.</p>
      ${R(`GET /v1/law [public] · POST /v1/law/bribe|retainer|envelope|plea|jury|trial|witpro|flip/:id`)}` },

  { id: 'pen', group: 'The Law', title: 'The Pen (Prison)', tag: 'jail is a place',
    html: `<p>Every Pen action requires that you are jailed. <b>Work the yard</b> (reduces your sentence), the
      <b>commissary</b> (shiv $5k, burner $25k, cutkit $50k), <b>protection</b> (a wealth-scaled no-shank window — a shield, so you
      cannot shank either), <b>bribe the guard</b> (a per-second exit).</p>
      <p><b>The shank</b> — both players jailed; spend a shiv and energy in a muscle contest. It respects revive tokens,
      witness protection, omertà (unless a rat), and protection or the hole. A kill is a real death (no loot, no car loss,
      no reputation); a caught attempt costs the shiv, more time, and <b>the hole</b> (solitary — you cannot act and no one
      can shank you). <b>Yard incidents</b> (Lockdown/Riot/Visit/Toss) change the daily chances. The <b>burner phone</b>
      calls an outside NPC hit. <b>Breakout</b> — solo (a win makes you a WANTED fugitive for 2 days) or co-op (a crew of
      2–4).</p>
      ${R(`GET /v1/pen · POST /v1/pen/work|protection|bribe · /buy/:item · /shank/:id · /burner/:id · /break[/plan] · /break/:id/join|go`)}` },

  { id: 'loans', group: 'The Underworld', title: 'Loan Sharking (The Shylock)', tag: 'the PvP credit market',
    html: `<p><b>Offer</b> escrows the principal ($5k–$1M, rate up to 50%, 1–72 hours; optional <b>directed</b> or
      <b>collateralized</b> by a car). A borrower <b>takes</b> it (one at a time; pledges a car if it is secured). The debt
      is <code>principal × (1+rate)</code>.</p>
      <p><b>Repay</b> (5% vig to the buyback pool). <b>Default and collect</b> — the lender takes the pocket and in-transit
      cash and the pledged car, sends the borrower to hospital, and marks them a permanent <b>welsher</b>. A default also
      marks the borrower <b>WANTED</b> for 3 days (no omertà, a pool bounty if L20 or higher, NPC hunters). <b>Square your
      name</b> ($50k) clears both. A <b>paper market</b> lets you sell an active claim.</p>
      ${R(`GET /v1/loans [public] · POST /v1/loans · /:id/take|repay|cancel|collect|sell|buy|unsell · /loans/square`)}` },

  { id: 'convoys', group: 'The Underworld', title: 'Smuggling Convoys', tag: 'bulk goods on a clock',
    html: `${L(`<b>open</b> (with a first load) → <b>load more</b> (larger than the trunk limit) → <b>depart</b> with
      <b>guards</b> (none/crew $5k/heavy $20k) and optional <b>insurance</b> → travels 30 minutes → <b>collect</b> at the
      destination.`)}
      <p>The route and a value band are announced, never the manifest. <b>Ambush</b> — energy, ammo, and heat in a contest
      of your muscle and speed against the guards and turf defense; a win takes goods up to your trunk limit. Up to 3
      hijacks for each convoy. <b>Tolls</b> — if you collect at another family's docks, you pay 5% to their treasury.
      <b>Insured</b> freight pays for a hijack (with a limit against related-account abuse).</p>
      ${R(`GET /v1/convoys [public] · POST /v1/convoy · /convoy/load · /depart · /cancel · /:id/ambush|collect`)}` },

  { id: 'heists', group: 'The Underworld', title: 'Crew Heists (The Big Score)', tag: 'co-op raids',
    html: `<p>Jobs: a 12-rung ladder from the Corner Store (crew 2, L4) up to the Federal Reserve (crew 5, L80),
      plus the Inside Job (against a player business). Each position is a <b>role</b> (brains/muscle/wheelman/gun — plus lookout and hacker on the big crews), and the calculation uses each member's
      stat for their role.</p>
      ${L(`A leader <b>plans</b> and stakes → the crew <b>join</b> by role → the leader <b>executes</b> (one calculation
      for all).`)}
      <p>Success divides the pot (1.2× for the leader); failure jails everyone. <b>The Rat</b> — any member can inform
      silently; the job fails, the rat leaves with half the stake, the rest get double jail, and the feed only says
      "somebody talked." The <b>solo Daily Score</b> shares an 8-hour cooldown.</p>
      ${R(`GET /v1/heists [public] · POST /v1/heists/plan · /:id/join|leave|rat|execute · POST /v1/heist (solo)`)}` },

  { id: 'market', group: 'The Underworld', title: 'The Black Market', tag: 'player-to-player trade',
    html: `<p><b>Cars sell by auction; goods sell at a fixed price with a district pickup; buy orders (WTB) let buyers name
      a price.</b> (Gear is not here — its market is the GearVault on the blockchain.)</p>
      <ul><li><b>Car auction</b> — one bid, an optional buy-now, a hidden reserve, and an anti-snipe close; an outbid
      bidder gets a refund immediately. A listed car locks.</li>
      <li><b>Goods</b> — a fixed price; the buyer must stand at the listing's dock with trunk space (partial buys).</li>
      <li><b>Buy orders</b> — escrow quantity × price at your dock; sellers fill from the trunk and are paid at once.</li></ul>
      ${R(`GET /v1/market [public] · POST /v1/market · /:id/bid|buy|cancel · /market/order · /:id/fill|claim`)}` },

  { id: 'vendettas', group: 'The Underworld', title: 'Vendettas & Blood Feuds', tag: 'status, no money',
    html: `<p>A player fire-kill swears the victim's family against the killer's family <b>for 7 days</b>; the heir inherits
      the feud. A <b>revenge fire-kill inside the window</b> ends it, pays 2× feared-reputation, and feeds the streets.
      Revenge also <b>removes the directed-contract minimum</b> on a kill contract against your target. NPC and mod kills do
      not swear a feud.</p>
      ${R(`GET /v1/feud/:characterId [public]`)}` },

  { id: 'skills', group: 'The Underworld', title: 'Skills & Specializations', tag: 'your build',
    html: `<p>Three branches, FOUR levels each — the 4th a capstone that unlocks an ACTIVE ability; points <b>come from your level</b> (<code>floor(level/4)</code> plus a small prestige bonus). Skills
      die with the character. Respec for 60 $OMR (shared 24-hour cooldown).</p>
      <ul><li><b>Enforcer</b> — Bruiser (jump/shakedown ×1.08) · Doctor's Friend (heal ×0.75) · Executioner (search ×0.8).</li>
      <li><b>Operator</b> — Fast Talker (lay-low ×0.8) · Fence Network (fence/melt +8%) · Broker (listing fees ×0.5).</li>
      <li><b>Wheelman</b> — Pack Mule (+3 trunk) · Getaway (crime jail ×0.8) · Road Captain (own convoys 20% faster).</li></ul>
      ${R(`GET /v1/skills · POST /v1/skills/:id · /skills/respec`)}` },

  { id: 'trades', group: 'The Underworld', title: 'The Trades (mastery)', tag: 'learn by doing',
    html: `<p>Ten <b>use-XP tracks</b> — every job, deal, race and bout schools its own craft, and nothing
      else does (XP is never bought, gifted or traded). Larceny (crimes) · Wet Work (kills, shanks, duels) ·
      The Cook (batches, deals) · Wheels (boosts, races) · Seamanship (landings, piracy) · The Gambler (the
      Den's games) · Protection (jumps, shakedowns, standovers) · Commerce (goods sales, market fills) ·
      Big Scores (the Score, crew heists) · Fisticuffs (bouts, exhibitions).</p>
      <p>Level = √(xp/15)+1, capped at 50; ranks Green → Apprentice → Made → Craftsman → Expert → <b>Master of the
      Trade</b>. Levels <b>die with the street</b> — the heir keeps <b>25% of each track's XP</b> (the
      bloodline echo) — while a lifetime account-level XP <b>legend</b> survives whole and ranks the trades
      board (Dabbler → A Legend of the Life; agents excluded).</p>
      <p><b>Milestone perks</b> deepen at L10/25/40 — one axis per trade (shorter stints, faster clocks,
      discounted tunes/refits/listings, a higher table limit, harder jumps). Den plays under $1,000 school
      nothing. At <b>level 50</b> choose a permanent trait: <b>Virtuoso</b> (the perk deepens further) or
      <b>Dynast</b> (your heir keeps HALF this trade instead of a quarter). It dies with the street.</p>
      <p><b>Paths v2:</b> six careers — The Gun, The Ledger, The Kitchen, <b>The Wheel, The Shadow, The
      Ring</b> — each with a signature edge, a REAL handicap, and trades that come easy (×1.5 XP) or
      fight you (×0.6). Switching takes the $OMR switch fee and a week between moves.</p>
      <p><b>Stats by use:</b> working a trade also builds its core stat (larceny→cunning, wet work→muscle,
      wheels→speed…) — a small chance per action on the gym's own diminishing curve, hard-capped at
      <b>3 points per rolling day</b>. The gym is still the fast lane.</p>
      ${R(`GET /v1/mastery · GET /v1/leaderboard/trades`)}` },

  { id: 'underworld', group: 'The Underworld', title: 'The Underworld (Fixers)', tag: 'the people you know',
    html: `<p>Six named fixers you build standing with (0–100, for each character): <b>Doc Moretti</b> (survival),
      <b>Vinnie the Match</b> (contracts), <b>Bella Bang-Bang</b> (gear), <b>Big Tuna</b> (trade), <b>The Madame</b> (the
      Den), <b>Mickey the Corner</b> (boxing &amp; the stable).</p>
      <p>You <b>earn standing when you work with a fixer</b> (limit 25 each day). Levels at 25/60/90 unlock discounts and
      favors. <b>Gifts</b> ($5k, +5) only work below 50 — you must earn the top levels. A <b>daily lead</b>, a <b>weekly
      favor</b>, and an <b>errand chain</b> reward loyalty. A <b>grudge</b> (killing a fixer's friend) limits your level
      until you pay <b>penance</b> ($25k). Your heir inherits 25% of your standings.</p>
      ${R(`GET /v1/underworld · POST /v1/underworld/:npc/gift|penance|favor|errand · /discharge · /gun/:id/sell`)}` },

  { id: 'wire', group: 'The Underworld', title: 'The Wire', tag: 'information you buy',
    html: `<p><b>Wiretap</b> (48 $OMR, 12 hours, up to 5) — shows a rival's Law stage and heat, wealth band, operations,
      WANTED status, and <b>if they are hunting you</b>. <b>Sweep</b> (30 $OMR) removes taps on you (free when clean). The
      <b>Street Wire subscription</b> is a <b>tiered ladder</b> — Street Wire (72 $OMR/7 days: Law
      forecasts, threat data — a count of hunters on you, never a name), The Wire Room (180: plus the war room and 2
      standing watches), The Switchboard (360: plus 5 standing watches). A <b>standing watch</b> (tier 2 or higher) renews a
      tap from your $OMR, so the surveillance runs while you are offline. There are also <b>tradecraft</b> ranks (more
      slots and a read discount), the <b>watchdog</b> (a live alert when a tapped target becomes hot), the <b>bug
      trace</b>, the <b>dossier</b>, <b>disinformation</b>, and the <b>informant</b> (a human source that passes
      disinformation).</p>
      ${R(`GET /v1/wire · POST /v1/wire/tap/:targetId · /wire/sweep · /wire/subscribe {tier} · /wire/watch/:targetId`)}` },

  { id: 'store', group: 'Endgame & Going Legit', title: 'The Store &amp; the Ledger', tag: 'real-money packages',
    html: `<p><b>The Store</b> sells ETH packages that grant <b>only non-currency items</b> (this prevents pay-to-win:
      entitlements, access, cosmetics, status — never cash, $OMR, gear, or power): revive
      bundles, Street Wire, the Season Pass, the Patron badge, and decor. Revenue divides 40% founder / 40% buyback / 20%
      treasury (the Vault's ETH).</p>
      <p><b>Two rails — except for getting Made.</b> PLEX lets you pay in earned $OMR instead of ETH, and every
      package takes it, because none of them gates anything. Becoming Made is the exception: a price payable two ways
      is always the cheaper of the two, and being Made is what unlocks extraction, so it costs ETH at the published
      wave and nothing else sells it. The free road is unchanged: the mission ladder hands you a mint credit outright.
      And where the $OMR for that rail comes from, plainly: nothing mints it. Every $OMR mission pays 1,320 across a
      career and the daily bonus adds 3 a day, against 4,118 for the cheapest thing PLEX sells — so you fund it by
      taking it off somebody, buying it at the desk, or being handed it by your family, not by grinding jobs. <b>The Season Pass / Ledger</b> —
      while active, claim the next of 12 levels each day (titles, revives, energy, small funded $OMR stipends); it is
      account-level and survives death.</p>
      ${R(`GET /v1/store [public] · GET /v1/pass · /pass/claim`)}` },

  { id: 'legit', group: 'Endgame & Going Legit', title: 'Going Legit — what your $OMR does', tag: 'the endgame',
    html: `<p><b>The game does not sell Stock Tokens for cash or $OMR.</b> The Brokers are a separate,
      treasury-funded active-play distribution, described next. Going legit means what your
      <b>earned $OMR</b> actually does directly:</p>
      <p><b>Stake it</b> — the approved custody architecture requires actual on-chain OMR. The same canonical position
      climbs the ladder (trunk, energy, nerve, garage, the fence at the top), supports commitment locks and the Broker
      multiplier, and remains exposed to gameplay loss and unbonding. This custody path is designed, not live.
      <b>Redeem it</b> at the Window for
      cash. <b>Claim backed ETH</b> at the Vault — real ETH the treasury holds, never more than it holds.
      <b>Get Made</b> and take your $OMR out on-chain. <b>Landmarks</b> — a district plaque still bears your name.</p>
      ${R(`POST /v1/stake · /v1/made · GET /v1/vault · /v1/window · POST /v1/landmarks/:id`)}` },

  { id: 'grillv2', group: 'Endgame & Going Legit', title: 'Grill v2 — RWA & OMR Architecture Status', tag: 'implemented foundation · staged completion',
    html: `<p><b>Grill v2 is a dependency-ordered implementation program; code completion does not grant deployment
      authority.</b> The active branch has production-shaped implementations and tests for the native-only
      <code>SettlementGasPool</code>, immutable <code>StockTokenRegistryV2</code>, the finalized Stock Token catalog
      mirror, public nomination and reviewer state machines, a dormant version-snapshot family ballot, and the
      shared finalized-observation kernel that pins canonical block, hash, time, logs, and same-head getter evidence.
      These components are not production deployment claims.</p>
      <p>Remaining graph nodes include finalized health and acquisition controllers, the audited
      <code>OMRGameplayVault</code> with delayed upgrade governor, game-settlement integration, complete delivery and
      operations UI, deployment packages, and the launch gates. The approved model keeps actual OMR principal fully
      backed; separates idle, active, committed, and unbonding balances; gives prepared outcomes no lock authority;
      settles one short-lived EIP-712 outcome only after canonical finality; and never funds gas from player principal,
      RWA inventory, or withdrawal reserves.</p>
      <p>The Safe controls registry curation, delayed governance, reconciliation, and upgrades. The broad acquisition
      operator cannot move OMR, Stock Tokens, the gameplay vault, the settlement gas pool, or upgrade authority.
      Permissionless settlement can earn a bounded pull-based native-gas credit only for the executor whose valid
      transaction wins canonical settlement; an empty pool cannot freeze gameplay.</p>` },

  { id: 'brokers', group: 'Endgame & Going Legit', title: 'The Brokers — Active Play & Stock Tokens', tag: 'RWA rewards, family ballot, permanent allocation',
    html: `<p><b>The Commission chooses the asset; verified play chooses the recipients.</b> Each seated family
      votes for one Safe-approved Robinhood Stock Token. The initial catalog is a one-time Safe-reviewed
      snapshot of the 15 highest-underlier-volume eligible tokens, not an automatically rotating list.
      After the closed UTC-day result, a bounded buyer may buy only the exact token address committed for
      that ballot.</p>
      <p>If a candidate is removed <b>before</b> the normal cutoff, votes for it stop counting immediately
      and affected families may recast for an active candidate. The ballot does not restart or extend;
      an invalid vote left unrecast is ignored, then the normal active-default rule handles a tie or
      silence.</p>
      <p>If that exact token becomes inactive, halted, or otherwise ineligible before the purchase, the
      day is <b>skipped</b>. The machine never substitutes the default or another token the families did
      not choose. The bounded, unspent ETH carries forward under the existing purchase caps;
      it does not enlarge a later daily cap. The public history keeps the closed ballot, skipped-purchase status, and
      reason.</p>
      <p>The unspent ETH remains permanently in one general <b>Stock Token acquisition budget</b>. It is
      not reserved for the skipped token and never expires through ordinary operation. The designated
      <code>mainOperator</code> is the explicit exception and may move any or all pooled ETH to any address for
      any purpose. Future valid winners may use the remaining backlog gradually, but every day remains one exact-token
      purchase under the unchanged cap—never a stacked cap or catch-up batch. The skipped token receives
      nothing unless it becomes eligible and wins a later ballot.</p>
      <p>Catalog changes are <b>forward-only</b>. Robinhood's API never reactivates or replaces an entry.
      The Safe must explicitly re-review a restored token; a changed address or provider identity requires
      a reviewed, immutable version with a new asset key. The old version remains inactive and inspectable
      forever, and only one version of a ticker may be active. Either affects only future open ballots—never
      a closed or skipped result—and cannot redirect an existing pending allocation. Corporate-action
      reconciliation remains separate, while inactive identities and ballot outcomes stay in the public
      audit history.</p>
      <p>Each version key is deterministic and publicly recomputable from the Robinhood Chain ID,
      validated uppercase ticker, exact token address, and RHJ provider-asset-ID hash. Changing the ticker,
      address, provider identity, or chain creates a new version; correcting a display name or toggling the
      same version inactive and active does not. The Safe cannot substitute an opaque alias.</p>
      <p>Inactive history may repeat a ticker, token address, or RHJ provider ID, but the active catalog
      permits only one version for each. Activating a version atomically deactivates every active conflict;
      reactivating that exact version updates its permanent record instead of creating a duplicate. The
      on-chain registry enforces the rule even if Safe sequencing or the database mirror is stale.</p>
      <p>If every version is inactive, the catalog is visibly empty: no candidates, no default, and no
      valid cast. Rollover records a public <code>catalog_empty</code> skipped day, publishes no purchasable
      winner, and leaves all ETH in the permanent acquisition budget. Production never revives SPY or an
      old/static fallback. Explicit Safe approval resumes future ballots only; empty days are not replayed.</p>
      <p>Seated families may publicly <b>nominate</b> a potential RHJ Stock Token. A boss or underboss submits
      the ticker and a short reason; other seated families may endorse it. Robinhood identity, address,
      status, capabilities, and observation time appear as evidence, not approval. A nomination never enters
      the ballot by itself: only Safe approval on-chain followed by registry sync makes it voteable. The
      rate-limited queue cannot alter closed/skipped ballots or pending allocations.</p>
      <p>Each seated family may create one nomination per rolling seven days. It remains pending for at
      most 30 days; each seated family gets one endorsement that its boss or underboss may change or
      withdraw while pending. Safe approval, rejection, or <code>not_eligible</code> closes it early, but
      approval becomes voteable only after Safe execution and registry sync. Expiry only archives it. A
      later renomination is a new record with fresh evidence, never a rewrite of the old one.</p>
      <p>A valid nomination survives if its family loses its Commission seat or dissolves, but that family
      immediately loses write authority. Its endorsement remains in history and stops counting as current
      seated support. Reseating does not revive it; the current boss or underboss must endorse again. Newly
      seated families may endorse pending items. The board separates current support from historical events,
      and neither binds the Safe.</p>
      <p>Only one pending nomination may exist for an exact deterministic version key. A duplicate submitter
      is sent to the existing item and may explicitly endorse it with its own reason; no duplicate row is
      created and its seven-day nomination allowance is untouched. Different identities sharing a ticker
      may coexist but are marked as conflicts because only one can be active. After closure or expiry, a
      fresh linked nomination may capture new evidence without rewriting the old record.</p>
      <p>The submitting family is the sole sponsor and cannot endorse its own nomination again. A currently
      seated sponsor counts once; every other seated family may endorse once, for at most five current
      supporting families with no double count. Seat loss leaves sponsor history but removes current
      support. Reseating requires an explicit renewal by the current boss or underboss. The board separates
      sponsor identity, current supporting families, and historical support.</p>
      <p>Three current supporting families—including a current sponsor—mark a nomination
      <code>review_requested</code>, refresh its RHJ evidence, and alert operators. This never creates Safe
      calldata or guarantees approval. Falling below three before claim returns it to pending; after an
      operator marks it <code>under_review</code>, support changes stay visible without cancelling review.
      Operators may review below threshold. Pending items sort by current support, then oldest first.</p>
      <p>The automatic threshold is always three distinct currently seated families, even with vacant
      Commission seats. It never scales down to a majority of occupied seats and seat rank adds no weight.
      With fewer than three seated families, only a manual operator claim can begin review. Seat changes
      recompute support without changing the threshold or cancelling <code>under_review</code>.</p>
      <p>The original 30-day deadline stays fixed through pending, <code>review_requested</code>, and
      <code>under_review</code>. Claims, reassignment, refreshes, and progress updates cannot extend it.
      Unresolved review expires at the deadline while preserving reviewer and latest public note; further
      work needs a fresh linked nomination and evidence. Terminal Safe dispositions do not expire. An
      approved item awaiting Safe execution stays public and non-voteable under separate execution status.</p>
      <p>Approval creates a seven-day Safe execution window binding the exact version key and final evidence
      hash. The registry rejects execution after the immutable deadline; mining before it remains valid if
      sync arrives later. An unexecuted approval becomes <code>approval_stale</code>: still historically
      approved, but non-voteable and unable to regenerate calldata. Continuing requires a fresh linked
      nomination, evidence, and Safe review. Approval, deadline, Safe tx, execution, and sync stay separate.</p>
      <p>Until execution, an off-chain watcher rechecks the bound RHJ identity/status and approved venue,
      oracle, and exposure prerequisites. Material change becomes public <code>evidence_drift</code>, names
      the changed fact, alerts Safe owners, and blocks OMERTÀ's own proposal and broadcast tooling. The
      watcher and external feeds receive no on-chain catalog authority and cannot revoke signed calldata,
      so residual executability remains public until Safe cancellation or TTL expiry. If the Safe executes
      the warned transaction on time anyway, the registry accepts it and records a Safe-governance failure.</p>
      <p>Catalog activation is one atomic Safe-authorized registry transition: deactivate every active
      ticker/token/provider-ID conflict, create or select the exact immutable version, recheck uniqueness,
      and activate it. All parts revert together. Events and mirror synchronization treat the transaction
      as one unit, preventing both duplicate-active and half-installed replacement states.</p>
      <p>Only finalized canonical chain state is voteable. <code>approved</code>,
      <code>safe_submitted</code>, and <code>executed_pending_finality</code> remain non-voteable;
      <code>synced_active</code> begins only after configured chain finality and mirror synchronization.
      On-time inclusion remains valid if finality or sync arrives after the seven-day deadline. A
      pre-finality reorg returns the version to non-voteable state and alerts operators; an open ballot then
      applies the normal pre-close deactivation and recast rule. Submission, a receipt, or optimistic
      indexing is never catalog truth.</p>
      <p>One authenticated authorized RWA reviewer may set a terminal nomination status of
      <code>approved</code>, <code>rejected</code>, or <code>not_eligible</code>; no second reviewer or reviewer
      co-signature is required. The immutable disposition binds reviewer identity, status, public rationale,
      evidence references, and final evidence hash. Approval sets <code>approved_at</code> and starts the
      seven-day Safe window. That one-person review still cannot activate the catalog: Safe execution,
      finality, and synchronization remain separate voteability gates.</p>
      <p>Monitoring continues after <code>synced_active</code>. Verified material drift sets public
      <code>operational_quarantine</code>; inability to verify a critical prerequisite is separately
      <code>health_unknown</code>. Both block new ballot inclusion, new or changed votes, purchases, and
      automatic delivery. Open-ballot votes are invalidated and may be recast by the unchanged cutoff; an
      unpurchased closed winner skips without substitution and leaves ETH in the pooled Stock Token budget.
      Ownership and permanent allocations remain intact and cannot be confiscated, substituted, redirected,
      or expired. The board shows registry-active and operationally-blocked states together. The watcher may
      halt OMERTÀ's use but cannot activate, permanently deactivate, transfer, or reassign anything.</p>
      <p>If the exact version remains active on-chain, quarantine clearance needs no new family nomination,
      but requires fresh evidence resolving every reason, one authorized reviewer approval, a new
      evidence-bound seven-day Safe clearance action, canonical finality, and mirror synchronization. It
      remains blocked until all complete. A Safe-deactivated version instead needs a fresh linked public
      nomination with no carried endorsements or support, fresh RHJ evidence/review, new TTL-bound Safe
      approval, atomic execution, finality, and sync. An unchanged immutable identity is reactivated in place,
      not duplicated, while the complete prior nomination, quarantine, deactivation, and recovery history
      remains linked and public.</p>
      <p>Quarantine may begin automatically or manually. Deterministic watcher rules set
      <code>operational_quarantine</code> for verified drift and <code>health_unknown</code> when critical
      health cannot be verified. One authenticated authorized RWA reviewer may also impose either
      immediately. Each entry records a stable reason code, public explanation, exact asset key,
      evidence/source observations, actor, and timestamp. Families, nominees, endorsers, ordinary operators,
      agents, and clients have no quarantine authority. Entry needs no Safe action because it only removes
      permission; Safe-controlled recovery remains mandatory. Repeats are idempotent and cannot reset or
      hide the original quarantine timestamp.</p>
      <p>Every <code>synced_active</code> version is checked at least every five minutes, with a synchronous
      fresh check immediately before candidate-snapshot publication, purchase broadcast, delivery-batch
      start, and quarantine-clearance broadcast. Critical health older than ten minutes is unusable and
      becomes <code>health_unknown</code>; an earlier successful check cannot authorize a later sensitive
      action. Timeouts, malformed responses, signature failures, identity mismatches, and an unverifiable
      chain/token/provider tuple fail closed without being mislabeled as drift. Production may check more
      often, but loosening either ceiling requires a documented founder/Safe policy change. The board shows
      <code>last_checked_at</code>, <code>last_healthy_at</code>, status, and a safe failure reason.</p>
      <p>If quarantine is known before purchase broadcast, no transaction is sent: the day skips without
      substitution and ETH stays pooled. The worker first atomically records exact health, catalog, ballot,
      quote/oracle, spend, and transaction-intent snapshots. Quarantine after broadcast but before mining
      sets <code>purchase_at_risk</code> and prompts a best-effort same-nonce cancellation/replacement only
      where safe; it is not guaranteed, and no substitute ticker may be sent. Cancellation success or a
      reverted purchase leaves the day skipped and ETH unspent. A canonically finalized purchase wins the
      race: the real trade stands, units allocate to that day's eligible cohort, and delivery pauses without
      unwind, substitution, or reassignment. The board publishes the full chronology, and later quarantine
      grants no rebuy or catch-up authority. Unprovable ordering becomes <code>ordering_uncertain</code>:
      preserve canonical assets and ledger, pause delivery, and require operator review.</p>
      <p>After quarantine, delivery resumes only after the Safe clearance is canonically finalized and
      synchronized and another synchronous health check succeeds. Paused allocations keep their exact asset
      key, cohort, amount, creation time, and original priority. Eligible backlogs run FIFO by creation time
      then stable allocation ID; newer rows cannot jump older eligible rows, but held/ineligible rows do not
      block later work. Batches remain idempotent stage-then-confirm. Returning quarantine blocks new stages,
      releases an unbroadcast stage without changing <code>delivered</code>, and lets a broadcast transfer
      follow canonical chain outcome before pausing the rest. Delay creates no substitute, cash, yield,
      priority bonus, or enlarged allocation. The board shows backlog size, oldest pause, latest completed
      batch, and blocker. An acquisition-vault reconciliation shortfall or deficit is not itself a delivery blocker
      for already-acquired, already-allocated units when exact StockVault custody and every independent delivery wall
      are healthy.</p>
      <p>A permanently frozen, non-transferable, irrecoverable, or unsupported exact Stock Token places its
      allocations in <code>delivery_impossible_pending_resolution</code>; they never expire or change cohorts.
      OMERTÀ cannot use an unrelated token, general treasury ETH, $OMR, game cash, or synthetic credit. The
      Safe may resolve only from value actually recovered from that exact holding—verified RHJ redemption or
      liquidation, successor corporate-action consideration, or recovered original units. Distribution is
      pro rata by original cohort weights and cannot exceed actual recovery. Deterministic rounding residue
      stays with that cohort, never general treasury. With no recovery, the obligation remains visibly
      unresolved. Resolution requires fresh evidence, one authorized RWA reviewer, exact Safe calldata,
      finality, sync, and a public conservation calculation.</p>
      <p>Automatic delivery to the extracted Street Deed TBA remains default, but a user may set reversible
      <code>delivery_hold</code> globally or for one exact immutable asset version. It preserves the allocation
      and grants no forfeiture, expiry, redirection, sale, redemption, substitution, conversion, cash,
      interest, yield, priority, compensation, or vote. Clearing restores original FIFO position. The keeper
      checks before staging and before broadcast; a newly held unbroadcast stage releases without changing
      <code>delivered</code>, while a post-broadcast hold cannot cancel or reverse canonical execution. Toggles
      are idempotent and cannot reserve batches or starve others; held rows do not block later eligible rows.
      The board may show <code>user_held</code>, but controls stay authenticated. Death, inactivity, logout,
      and indefinite hold never forfeit the allocation tied to the designated deed TBA.</p>
      <p>Before deed binding, an allocation is beneficially the qualifying account's and remains
      <code>awaiting_deed</code>. A deed is eligible only after canonical extraction finality, deterministic
      ERC-6551 TBA derivation, and current account ownership. Exactly one eligible deed automatically becomes
      <code>rwa_delivery_deed</code>; with multiple deeds the server chooses neither oldest, newest, nor most
      valuable, and the authenticated user must designate one. Establishing it binds all unbound and future
      allocations to exact chain ID, deed contract, token ID, and TBA, whole and unsplit. Changing primary
      affects only unbound and future allocations; bound destinations are immutable. Selection itself creates
      no transfer, delivery, fee, tax, allocation, or ownership event.</p>
      <p>A bound pending allocation travels with its exact Street Deed/TBA. Finalized deed transfer gives the
      recipient control of TBA-held Stock Tokens, bound pending allocations, and their delivery holds, while original
      activity/cohort history remains attributed to the qualifier without re-scoring. Holds persist; after
      finality only the new owner may change them and the former owner immediately loses authority. Delivery
      still targets the unchanged TBA during staging.
      Before sale, the public deed view discloses aggregate pending allocations, exact versions,
      delivered/undelivered amounts, quarantine/health/delivery-impossible status, and holds. OMERTÀ neither
      prices, guarantees, nor intermediates the sale. Transfer causes no reallocation, duplicate allocation,
      substitution, re-scoring, or cohort entry.</p>
      <p>No user, reviewer, support operator, database administrator, keeper, or ordinary Safe action may
      redirect a bound allocation to another deed, EOA, TBA, character, or account. Lost wallet, recovery
      request, inactivity, death, sanctions, or sale dispute creates no discretion; recovery follows deed
      control/transfer and owner wallet recovery. Only a verified protocol-wide Street Deed/TBA migration for
      a contract defect or chain migration may remap it, using deterministic one-to-one mapping, preserved
      current deed owner and every allocation field/history, exact Safe calldata, public old-to-new mapping
      and conservation proof, canonical finality, and sync. It cannot rescue one individual; delivery pauses
      until the valid migration completes.</p>
      <p>Automatic Stock Token delivery gas comes by default from a dedicated, separately accounted RWA delivery-
      operations ETH budget funded by the operator/Safe or an explicitly designated protocol-operations
      source. Users pay no extra charge after the existing deed extraction requirement. Gas cannot reduce
      allocations, cohort holdings, pooled acquisition ETH, withdrawal reserves, $OMR, game cash, or user
      balances, and funding grants no allocation, priority, claim, repayment, or yield. A Safe-set fee ceiling
      applies. Empty budget or excessive fees pause as <code>delivery_gas_unfunded</code> or
      <code>delivery_gas_above_ceiling</code>, preserving allocation/FIFO and showing reason, balance, ceiling,
      and oldest delay. The keeper cannot sell or skim Stock Tokens. Accounting publishes transaction hash,
      gas used, effective price, ETH spent, funding-source category, and remaining balance. This does not
      restrict the designated <code>mainOperator</code> from moving pooled ETH into gas or anywhere else; that
      is a public pool-reducing <code>operator_outflow</code>, not an automatic fee.</p>
      <p>Stock Token quantities use integer atomic units. The real token <code>decimals()</code> is read,
      bounded, and cached by exact immutable version; no floating-point balance is ledgered. Each daily cohort
      floors exact activity-weighted pro-rata entitlements, then distributes every remaining atomic unit by
      largest fractional remainder. Equal remainders use stable immutable account ID ascending, never name,
      family rank, arrival time, or operator choice. Allocations sum exactly to purchased cohort units. When
      units are fewer than eligible accounts, a zero award is public <code>qualified_rounded_zero</code> with
      weight/result but no phantom liability. Fractions never cross day, version, or cohort. Every positive
      unit remains permanent with no dollar-value threshold. Same-deed/version rows may aggregate for delivery
      while row audit history remains enumerable.</p>
      <p>Delivery batches isolate items. All currently deliverable positive undelivered rows for one exact
      deed TBA/version aggregate into one immutable-ID item for its full staged amount. A bounded transaction
      may contain several items, but recipient-specific restriction, revert, or false return does not undo
      unrelated successes. Canonical per-item results name asset key, deed/TBA, atomic units, item ID, and
      transaction. Success increments <code>delivered</code> only after finality. Failure increments nothing,
      exposes a stable reason, safely releases or retains its stage, and links retry attempts to the same
      logical item ID. Token-wide or inventory/conservation failure halts the entire version. Delivered cannot
      exceed allocated; staged plus delivered cannot exceed held. Retry, duplicate logs, reorg, or restart
      cannot double-confirm. Batch caps cannot alter FIFO, permanently skip a recipient, or favor size.</p>
      <p>Allocatable purchase units come from actual custody, not a quote or receipt. Router success, nominal
      output, venue reporting, and events remain evidence, but after canonical finality the server serializes
      against every exact-token movement and records pre/post custody balances. It computes
      <code>receivedUnits = postPurchaseBalance - prePurchaseBalance</code> with transaction, asset key, vault,
      and blocks. Allocation freezes only after a verified positive delta. Claimed-output mismatch becomes
      public <code>acquisition_amount_mismatch</code> and blocks allocation pending reconciliation. Rebasing,
      fee-on-transfer, reflection, elastic-supply, and other non-standard balance tokens are default-ineligible;
      support needs a new immutable version, purpose-built Safe-approved adapter, fresh nomination/review,
      and explicit conservation tests.</p>
      <p>The daily cap applies to total ballot trade-input ETH, including venue/router/liquidity fees taken
      from input; network gas is separate operations expense. Every net atomic unit actually received is
      allocated with no protocol skim. Canonically unconsumed/refunded ETH returns to the pooled acquisition
      budget without enlarging the day's allocation or allowing a second ticker. In-bound slippage lowers
      actual cohort units; out-of-bound execution reverts. No treasury, operator, Safe owner, family, broker,
      or keeper compensates ordinary slippage or captures favorable execution. Public accounting shows
      intended, consumed, and refunded ETH; received units; effective and oracle prices; deviation;
      venue/adapter; and separate gas.</p>
      <p>Each closed ballot freezes <code>purchaseUntil = closed_at + 2 hours</code>, with no extension for
      worker/provider outage, gas, quarantine, failed or replaced transactions, operator delay, stale quotes,
      contention, or retries. Inclusion must satisfy <code>block.timestamp &lt;= purchaseUntil</code>; later
      finality/sync remains valid. Before the boundary, one logical intent may retry reverted, dropped,
      cancelled, or safely replaced attempts, but only one canonical success is allowed. Any positive output
      meeting <code>minOut</code> and price bounds—including a partial fill—is final with no top-up, and unused
      or refunded ETH stays pooled. No on-time success becomes <code>purchase_window_missed</code>, with no buy,
      substitute, or replay; late transactions revert on-chain. Public history links every attempt status to
      the ballot intent.</p>
      <p>The venue, router, or pool cannot be its own independent reference oracle. Each exact asset version
      has Safe-approved sources and requires at least one independently governed valid price; multiple valid
      sources are decimal/direction-normalized and use their median. A snapshot lasts at most five minutes and
      binds asset key, source, price, decimals, quote currency, observed time, round/sequence ID, and evidence
      hash. Per-version Safe deviation may be tighter, but the contract hard ceiling is 500 basis points (5%)
      and only reviewed upgrade may raise it. The buyer enforces <code>minOut</code> and effective price with
      direction/decimal guards. Missing, stale, malformed, zero, negative, inconsistent, or wrong-asset data
      fails closed, without venue-quote, prior-close/day, operator-value, or unverified-cache fallback. Public
      history names used and rejected sources.</p>
      <p>Family ballots continue every calendar day and preserve their vote, but the clock alone never proves
      tradability. During the two-hour window, purchase needs a healthy transferable exact token, executable
      approved venue, independent price no older than five minutes, and passing price, exposure, liquidity,
      and inventory checks. If not, <code>market_unavailable</code> buys/substitutes nothing and leaves ETH
      pooled. No stale prior close, weekend/holiday/halt extension, or Monday catch-up is allowed. A genuinely
      live off-hours venue may execute with a fresh independent oracle. Public reasons distinguish
      <code>underlying_market_closed</code>, <code>venue_unavailable</code>,
      <code>oracle_unavailable</code>, <code>oracle_stale</code>, <code>asset_halted</code>, and combinations.</p>
      <p>The buyer calls only an exact Safe-approved adapter address and deployed code hash on its chain; no
      arbitrary target/calldata or <code>delegatecall</code> is allowed. Each attempt binds chain, ballot/intent
      IDs, asset key/output token, custody vault, maximum input, <code>minOut</code>, oracle snapshot/evidence,
      deviation, <code>purchaseUntil</code>, and an attempt deadline at most five minutes out and no later than
      purchase expiry. The adapter cannot redirect/retain output, approve unrelated or unbounded spend, or
      send residual ETH outside approved paths. Private submission is preferred but not trusted; public
      mempool is allowed because all walls are on-chain. Retry may refresh quote/oracle and lower input within
      remaining authority, never exceed it or auto-widen slippage/deviation. Revocation is forward-only.
      Adapter/proxy code or code-hash change needs fresh Safe approval/security verification, but no new asset
      version unless immutable identity changes. Targets, hashes, parameters, route, replacements, and results
      remain public.</p>
      <p>Acquisition ETH defaults to a separate <code>RwaAcquisitionVault</code> with ledger buckets for inflow,
      reservations, purchases, refunds, available capital, and unattributed surplus. Normal release is buyer-
      only for an exact ballot, asset, input, deadline, adapter, and intent; refunds return to the vault. Safe
      may pause/tighten/revoke but cannot arbitrary-sweep. The publicly designated <code>mainOperator</code> may,
      however, transfer any amount of available, unattributed, or reserved ETH to any address for any purpose
      without Safe approval, destination allowlist, purchase/exposure caps, or timelock. Reserved transfers
      first cancel affected intents. Each <code>operator_outflow</code> publishes operator, recipient, amount,
      reason code, nonzero details hash, pre/post balances, buckets, and impacted intents. It cannot move Stock Tokens or rewrite
      allocations. Buckets reconcile to the remaining balance. This unilateral power is explicit: the vault
      is neither unsweepable nor strictly acquisition-only.</p>
      <p>The vault exposes exactly one current <code>mainOperator</code>; the zero address disables outflows. It
      also exposes any <code>pendingMainOperator</code>, proposal/acceptance times, and role generation. Deployment
      declares the initial operator publicly. Safe may immediately set the operator to zero. Zeroing atomically
      cancels any pending nomination, increments role generation, and invalidates every outstanding signed
      outflow. Re-enabling even the same address needs a fresh public Safe nomination, at least 48 hours, and
      acceptance by the nominated address itself. The nomination expires seven days after that acceptance time;
      late acceptance fails and needs a fresh nomination. Safe may cancel sooner. The old operator remains current
      until acceptance unless disabled first. Acceptance atomically installs and publishes the replacement;
      this delayed path governs Safe-driven appointment and restoration from a zero operator. An active operator
      has a separate instant-replacement path.</p>
      <p>The active <code>mainOperator</code> may directly call <code>replaceMainOperator</code> to install any
      nonzero, different successor immediately, without Safe approval, nomination, acceptance delay, or timelock. It cannot
      be relayed and requires <code>msg.sender == mainOperator</code>. The successor consents in the same transaction
      through EIP-712 binding action, chain ID, verifying vault, current operator, proposed operator, current role
      generation, <code>issuedAt</code>, and acceptance deadline. Consent requires
      <code>issuedAt &lt;= block.timestamp &lt;= deadline</code>, a later deadline, and a window no longer than one
      hour. Future-issued, expired, zero/reversed, or over-hour consent fails before mutation. An EOA must recover exactly; a smart wallet must return the exact
      ERC-1271 magic value, failing closed before mutation. Success cancels pending Safe nomination, installs the
      successor, increments generation, invalidates old-operator authorizations, preserves
      <code>nextOutflowNonce</code>, and publishes old/new/generation. Old authority ends immediately in canonical
      ordering; Safe retains immediate zero-disable. No ETH, bucket, reservation, allocation, or cap changes.</p>
      <p>Once installed, smart-wallet operator identity follows the <code>mainOperator</code> address, not a pinned
      runtime code hash, proxy implementation, owner set, module set, or signature policy. Later wallet owner,
      module, implementation, or code changes do not automatically rotate, disable, or increment generation.
      Every action still validates current direct execution or ERC-1271 behavior. Public monitoring surfaces code
      hash, detectable implementation, owner/module/configuration changes, validation failure, code appearance or
      disappearance, and last-check time as <code>operator_wallet_changed</code> or
      <code>operator_wallet_health_unknown</code> warnings without changing authority or pausing action. A direct
      call proceeds for the current operator; relay proceeds when current EOA/ERC-1271 validation succeeds
      on-chain. Safe may zero-disable immediately. Relay fails closed if validation becomes impossible; Safe restoration recovers an address that
      can no longer originate a direct call.</p>
      <p>The operator-wallet watcher checks code, detectable implementation, owners, modules, configuration, and
      validation behavior at least every five minutes. Information older than ten minutes becomes
      <code>operator_wallet_health_unknown</code>. Before the server constructs or relays an operator transaction,
      it synchronously attempts a fresh check and publishes <code>last_checked_at</code>,
      <code>last_changed_at</code>, <code>last_healthy_at</code>, observed identity/configuration, warning, and
      failure reason. Watcher or refresh failure warns but does not veto; current on-chain caller/signature
      validation is authoritative. Direct chain calls never depend on watcher, server, or API availability.</p>
      <p>Every operator-role transition carries a public reason code and nonzero <code>detailsHash</code>: instant
      replacement, direct renunciation, Safe zero-disable, Safe nomination, nomination cancellation, and nominee
      acceptance. The code uses the same closed <code>operations</code>, <code>security</code>,
      <code>purchase_recovery</code>, <code>migration_bypass</code>, <code>retirement</code>, or <code>other</code>
      taxonomy. Relevant EIP-712/ERC-1271 authorization and direct/Safe calldata bind both fields. The immutable
      event carries actor, old/new/pending operator, generation, transition type, reason, and details hash.
      Missing off-chain explanation text never blocks a valid role change, and public surfaces cannot rewrite the
      commitment.</p>
      <p>ETH that cannot be matched to an approved, identified acquisition inflow—including forced ETH,
      mistaken transfers, and unexplained positive balance surplus—is <code>unattributed</code>. It cannot fund
      the automated buyer or a purchase reservation. Plain receipts book unattributed immediately; anyone may
      call <code>syncUnattributed()</code> to book a positive <code>vault.balance - accountedBuckets</code> delta
      without making it spendable. Only Safe may publicly reclassify a specified amount into available
      acquisition ETH, publishing reason code, details hash, and old/new buckets. Every normal ballot, oracle,
      adapter, purchase, daily, and rolling cap remains, and reclassification never revives or retro-funds an
      intent. <code>mainOperator</code> may still withdraw unattributed ETH through
      <code>operator_outflow</code>. Negative accounting drift pauses as an invariant failure, never a silent
      bucket reduction.</p>
      <p>Every purchase reservation has one immutable attempt deadline inside its approved two-hour purchase
      window. Execution requires <code>block.timestamp &lt; deadline</code>; a transaction mined at or after the
      deadline fails even if broadcast earlier. At or after the deadline, anyone may permissionlessly and
      idempotently call <code>expireIntent(intentId)</code>, mark terminal <code>intent_expired</code>, and release
      its entire remaining reservation to available ETH except any uncertain portion held in
      <code>reconciliation_pending</code>. Proven unaffected value releases immediately; uncertain value stays
      quarantined until Safe reconciliation. It cannot be extended, revived, re-reserved, or executed, and gets no
      substitute or catch-up. Released ETH is usable only by later purchases with fresh
      caps and authority.</p>
      <p>Each closed ballot and exact Stock Token version may create at most one logical purchase intent:
      <code>intentId = keccak256(abi.encode(chainId, vault, ballotId, assetVersionKey))</code>. The ID remains a
      permanent lifecycle record from creation through terminal state. Transaction attempts use monotonic
      <code>attemptNonce</code> and are serialized under the same intent; at most one registered attempt may be live,
      and replacements or retries stay linked so only one transaction can settle canonically. No path may create a
      second or parallel intent, split a ballot across intents, change its asset version, or produce more than one
      success. Success, partial-fill finality, expiry, operator cancellation, and every other terminal disposition
      permanently prevent recreation or further execution. A second creation attempt fails without changing any
      reservation, bucket, clock, or history.</p>
      <p>Only the currently Safe-approved <code>RwaStockBuyer</code> may create the intent and reservation. In one
      atomic transaction it revalidates the finalized closed ballot, deterministic intent ID, exact active and healthy
      Stock Token version, zero accounting deficit, sufficient unreserved available ETH,
      per-buy/daily/rolling/concentration caps, approved adapter and current code identity, fresh independent oracle and deviation wall,
      and a still-future immutable deadline. Only after every check succeeds does it persist the intent, reserve ETH,
      initialize attempts, and consume the next <code>accountingSequence</code>. Any failed check or competing creation
      reverts completely: no intent or tombstone, reservation, bucket change, attempt nonce, or sequence consumption.
      Creation may be tried again before the same unchanged deadline, and buyer approval bypasses none of the walls.</p>
      <p>After creation, any address may call <code>executeIntent(intentId)</code> before the deadline. The call accepts
      no caller-chosen asset, recipient, input ceiling, adapter, oracle/deviation limit, output destination, or
      deadline. It uses the stored intent and current approved registry state and revalidates activity, health,
      deficit, reservation, caps, adapter/code identity, fresh oracle/deviation, and time at inclusion. A caller may
      choose execution timing only inside that bounded envelope, pays its own network gas, and receives no fee, rebate, refund,
      Stock Token, approval, or other economic benefit. All output goes to <code>StockVault</code>; unused or returned
      ETH goes to <code>RwaAcquisitionVault</code>. Permissionless callers cannot create, edit, cancel, reserve for, or
      redirect an intent. Calls are atomic and reentrancy-protected: the first valid canonical execution wins, while
      competing, stale, failing, or terminal calls revert without accounting mutation or sequence consumption.</p>
      <p>Pre-adapter validation failures revert without consuming <code>attemptNonce</code>, changing accounting, or
      creating an attempt record. Once execution actually invokes the approved adapter, the attempt consumes the next
      nonce and receives one immutable public result. A revert, false return, or zero Stock Token output is retryable
      <code>attempt_failed</code> only when canonical pre/post vault and custody balances prove zero ETH debit and zero
      Stock Token output. The intent and reservation remain active for a sequential retry before the same deadline.
      Any nonzero or unexplained ETH debit, refund, token receipt, or custody delta instead marks
      <code>attempt_reconciliation</code> and blocks another execution or final settlement until an explicit public
      reconciliation accounts for it. A consumed nonce and result can never be erased or overwritten.</p>
      <p>Only the Safe may finalize an <code>attempt_reconciliation</code>, classify its value effects, release
      quarantined ETH, or declare the attempt reconciled. The current <code>mainOperator</code> may append evidence
      and a proposed disposition, but that submission is informational: it cannot alter buckets, custody facts,
      terminal state, or <code>accountingSequence</code>, and cannot authorize the operator or a relayer to finalize.
      Safe finality binds the exact intent and consumed attempt nonce and includes the ordinary public reason code
      and nonzero details-hash commitment.</p>
      <p>Safe reconciliation publishes actual ETH debit, cumulative verified refund, Stock Token custody delta,
      canonical transaction provenance, resulting disposition, and complete pre/post balance, buckets, deficit, and
      intent state, and consumes the next <code>accountingSequence</code>. A positive valid Stock Token custody delta
      is the intent's final fill at the actual received amount. Only those units may be allocated, and there is no
      top-up, second fill, substitute purchase, or catch-up. Zero or invalid custody output cannot be represented as
      acquired stock; unexplained residual value remains quarantined.</p>
      <p>If cancellation or the immutable deadline arrives during reconciliation, the intent becomes terminal for
      execution immediately. Proven unaffected value releases normally, but the unresolved portion moves from the
      reservation into the nonspendable <code>reconciliation_pending</code> bucket and cannot fund another
      reservation. Only later Safe reconciliation may release the amount proven unspent while booking actual debit,
      refund, and output from canonical evidence. Neither transition may revive the intent, retry it, replace its
      purchase, provide a substitute, or create catch-up authority.</p>
      <p>The contract—not figures supplied by the Safe—derives or strictly caps every reconcilable ETH debit,
      verified refund, and Stock Token output from immutable pre-adapter balance snapshots, current canonical
      <code>RwaAcquisitionVault</code> and <code>StockVault</code> balances, and already-recorded canonical refund and
      provenance records. The Safe chooses the disposition and commits reason, details, and evidence, but cannot
      override those observations, over-credit output or refund, hide debit, or enter unsupported value. An
      inconsistent reconciliation reverts before bucket, intent, allocation, <code>accountingSequence</code>, or
      custody-state mutation.</p>
      <p><code>reconciliation_pending</code> has no timeout, abandonment path, presumed outcome, or automatic release.
      Passage of time, deadline age, Safe inactivity, unavailable signers, or missing off-chain evidence never turns
      uncertainty into available ETH. The amount and age remain public indefinitely until the Safe completes a valid
      contract-bounded reconciliation. Safe signer recovery and incident escalation provide liveness; accounting
      never guesses.</p>
      <p>The current <code>mainOperator</code> nevertheless retains raw <code>operator_outflow</code> authority over
      actual ETH accounted in <code>reconciliation_pending</code>, consistent with its disclosed unilateral sweep
      power. The transfer cannot finalize or classify reconciliation, release value into available ETH, erase or
      reduce the unresolved liability, or represent missing ETH as reconciled. It consumes the normal outflow nonce
      and <code>accountingSequence</code>, publicly debits backed quarantine, identifies affected reconciliation
      records, and publishes complete pre/post balance, quarantine, liability, and deficit. Any resulting unbacked
      liability remains an explicit accounting deficit under the existing automation pause and repair rules until
      canonical evidence and actual funding resolve it.</p>
      <p>Each reconciliation attempt and the vault-wide aggregate separately expose
      <code>reconciliationLiability</code>, <code>backedQuarantineEth</code>, and
      <code>reconciliationShortfall</code>, enforcing
      <code>reconciliationLiability = backedQuarantineEth + reconciliationShortfall</code> after every mutation. Any
      positive shortfall joins vault-wide <code>accountingDeficit</code> and globally pauses new intent creation and
      execution while canonical deposits, deficit repair, matched or late refunds, reconciliation, expiry,
      cancellation, and authorized outflow remain live. No caller, mirror, or authority may hide
      under-collateralization by collapsing these figures.</p>
      <p>If an operator outflow reaches reconciliation backing, record attribution is automatic: greatest
      <code>backedQuarantineEth</code> first, then oldest <code>reconciliationStartedAt</code>, then lowest intent ID,
      fully debiting records before at most one partial debit. Generic canonical repair funding uses one unified
      deficit-component queue ordered by <code>firstObservedAt</code> or <code>shortfallCreatedAt</code>, then numeric
      <code>componentTypeCode</code>, then record ID, fully repairing components before at most one partial repair. An
      exact canonical late refund overrides the generic queue and repairs its own attempt first. Contract-controlled
      bounded priority indexes, or an audited equivalent, maintain both orders; caller-supplied ordering,
      caller-supplied sort proofs, and unbounded historical scans are not authoritative. The operator or depositor
      cannot choose a bucket or record; events expose every affected record and aggregate pre/post liability, backing,
      shortfall, deficit, and sequence.</p>
      <p>The Safe may finalize factual, contract-bounded reconciliation even when the ETH proven unspent is absent.
      That amount becomes durable terminal <code>reconciled_shortfall</code>: no available ETH is fabricated, no
      liability is erased, and the intent closes permanently without revival, retry, replacement, substitute, or
      catch-up. The shortfall and original evidence remain append-only until actual funding repairs them.</p>
      <p>When real repair ETH reaches a Safe-finalized <code>reconciled_shortfall</code> whose immutable disposition
      proves the ETH was unspent, the same atomic entry reduces that record's shortfall and liability and credits
      exactly the repaired amount to available acquisition ETH. It needs no second Safe action and never reopens or
      edits the intent. Repair is capped at the exact missing principal: the protocol creates no interest, penalty,
      opportunity-cost compensation, damages, yield, or other extra credit. Repair of a still-unresolved
      reconciliation restores backing without creating available ETH.</p>
      <p>A canonical refund received after terminal or final reconciliation first repairs the exact attempt's
      <code>reconciliationShortfall</code>. Only the remainder not required for repair follows normal terminal-refund
      classification; value above proven debit is <code>unattributed</code>. This appends a receipt and never reopens,
      edits, replaces, or grants catch-up to the old intent. Stock Tokens received after terminal or final
      reconciliation enter <code>unattributed_stock</code> quarantine keyed by exact token address, immutable asset
      version, amount, sender, and canonical transaction provenance. The Safe may only continue holding the exact
      stock, transfer it to the fixed Safe-approved recovery vault, or redeem or liquidate that exact token through a
      Safe-approved recovery adapter. It cannot choose an arbitrary recipient, retroactively allocate the stock,
      substitute an asset, or reopen or change the old intent or allocation. Quarantined units are excluded from
      distributable inventory, player allocations, and fulfilled-acquisition totals but included in gross custody,
      concentration-risk reporting, and every applicable exact-version exposure cap.</p>
      <p>Canonical ETH recovered by redeeming or liquidating <code>unattributed_stock</code> first repairs the exact
      originating attempt's reconciliation shortfall. Any remaining ETH enters the <code>unattributed</code> bucket; it
      does not automatically become available, allocate to the historical cohort, reopen the old intent, or create a
      substitute or catch-up. The immutable recovery record binds late-stock provenance, input units, actual ETH
      output, exact shortfall repair, remainder classification, and complete pre/post stock and ETH accounting.</p>
      <p>There is exactly one active Stock Token recovery-vault version, bound to chain, address, runtime code hash,
      and, for a proxy, implementation address and code hash. Safe rotation is publicly proposed at least 48 hours
      before execution and atomically replaces the old version with the new one. Continued quarantine is the emergency
      fallback; there is no immediate redirection bypass.</p>
      <p>Each recovery adapter is Safe-approved by exact address and runtime code hash and binds one exact input
      token/version to a canonical ETH output path, fresh independent price, <code>minEthOut</code>, maximum slippage,
      immutable deadline, and fixed route. It exposes no arbitrary calldata, caller-selected path,
      <code>delegatecall</code>, persistent approval, or residual token authority. Recovery succeeds only when canonical
      ETH is atomically received by the acquisition vault; intermediate assets remain inside the adapter. Unexpected
      ERC-20 output receives no recovery credit and, if it nevertheless arrives, enters exact-token/provenance
      <code>unattributed_stock</code> quarantine.</p>
      <p>For custody risk, concentration reporting, and every applicable exact-version exposure wall, quarantined
      stock is valued at the greater of its latest fresh independent-oracle market value and last valid acquisition
      price. If neither value exists or is usable, new purchases of that exact version remain blocked until valuation
      becomes available.</p>
      <p>Every recovery tranche receives a unique, immutable, domain-separated <code>recoveryId</code> binding the
      action, chain, active recovery-vault address/version/runtime code hash and proxy implementation when applicable,
      incident, exact quarantine record and provenance, Stock Token version, exact input units, adapter/code identity,
      canonical acquisition-vault destination, independent-oracle observation, <code>minEthOut</code>, slippage ceiling,
      fixed route, Safe authorization generation/nonce, issue time, and deadline. Only the Safe may create, activate,
      cancel, or replace it. It expires at the earlier of one hour after Safe approval and the oracle-validity deadline;
      expiry, cancellation, any field change, or price refresh requires a new one-use ID. Execution rechecks every
      pinned identity and a fresh independent price and applies the stricter authorized/execution-time oracle floor.</p>
      <p>A quarantined balance may be recovered through multiple monotonic partial tranches, each with a separate
      authorized <code>recoveryId</code> and exact units. A tranche can only reduce <code>remainingUnits</code>, never
      exceed it, and the quarantine record resolves only at zero. Neither Safe nor operator has an arbitrary Stock
      Token sweep. Direct transfer is preferred; any technically required approval is for exact units immediately
      before use and is consumed or reset to zero atomically. After Safe authorization anyone may call
      <code>executeRecovery(recoveryId)</code>, but supplies no payload or discretion, chooses no amount, route,
      recipient, or output, and receives no reward or refund. The caller or a separately accounted operations wallet
      pays gas; recovery gas never reduces recovery credit, acquisition backing, allocations, or player value.</p>
      <p>Permissionless execution does not permit permissionless creation or enqueueing. Execution is a constant-time
      exact-ID lookup for positive units under an active, unexpired, uncancelled, unconsumed authorization. The same
      call rechecks vault, token, adapter, oracle, and proxy code identity; measures exact pre/post Stock Token and
      canonical-ETH balance deltas; uses checked arithmetic, <code>nonReentrant</code>, and
      checks-effects-interactions; and consumes/decrements before calls with atomic rollback. It has no attacker-sized
      loop or scan, dynamic route, caller callback/payment, or caller-selected external call. Malformed, reverted,
      duplicate, expired, cancelled, or losing-race calls create no canonical event, incident entry, alert, storage
      growth, or protocol gas cost; the caller alone pays. A same-ID front-run performs only the identical approved
      action. Fresh-oracle <code>minEthOut</code>, maximum slippage, short expiry, and a fixed route bound sandwich loss;
      MEV-protected submission is preferred but is not a trusted control. Nonstandard tokens require a separately code-pinned adapter
      and adversarial balance-delta tests or remain quarantined without blocking unrelated versions. Safe or current
      <code>mainOperator</code> may pause recovery immediately; only the Safe may resume, and pausing cannot redirect stock,
      consume authorization, alter deadlines, or credit recovery.</p>
      <p>Successful recovery transitions publish structured canonical IDs, versions, sequences/components, actor and
      authority, transaction hashes, units, ETH, blocker changes, code identities, and finality. Sensitive, bulky, or
      restricted evidence remains off-chain under an immutable content hash. Provisional and finalized streams are
      separate; finalized is the default accounting, UI, and export authority, and reorgs replace only provisional
      data. Canonical history is retained permanently. The recent UI may be bounded, but complete cursor-based exports
      cover every generation in checksum-addressed pages/files. Anonymous incident and recovery APIs are read-only with
      strict cursor validation, fixed maximum page and body size, cheap indexed lookup, per-origin/token quotas, caching,
      and content-addressed precomputed exports. Invalid cursors, duplicates, rejected executions, and transport abuse cannot cause
      unbounded scans, canonical writes, alerts, export regeneration, storage growth, or incident amplification;
      infrastructure metrics are sampled and retention-bounded separately.</p>
      <p>Quarantine and indefinite hold are the complete launch behavior for late or unexplained Stock Tokens. Recovery
      is optional, deferred until a real material quarantined balance makes it worth building, and is not an ordinary
      RWA-launch blocker. If later activated, recovery remains unavailable and every recovery mutation control remains
      disabled until the exact production vault/adapter/oracle/API implementation and deployment manifest exist. Activation requires contract unit tests,
      stateful fuzz/invariant tests, malicious-token/adapter/oracle/receiver and reentrancy tests, forked-route
      slippage/MEV/reorg tests, API authorization/idempotency/concurrency/body-limit/cursor/export/load/denial-of-service
      tests, and independent third-party review of the exact source and bytecode. Every critical or high finding must
      be fixed and every remaining finding publicly dispositioned. The manifest binds chain, addresses, compiler
      settings, source commit, runtime and implementation code hashes, adapter/oracle identities, test reports, and
      audit artifact hashes. Any material contract, proxy, adapter, oracle, authorization, accounting, or write-route
      change resets the applicable gate. No placeholder generic executor or recovery write endpoint may ship merely
      because the design is documented.</p>
      <p>If recovery is built, the Safe records every authorization on-chain. Proxy vaults and adapters remain
      permitted—there is no non-upgradeable requirement—but exact proxy and implementation identities stay pinned and
      rechecked. Safe-set hard caps limit each tranche, each Stock Token version over rolling 24 hours, and all recovery
      over rolling 24 hours, with no operator bypass over Stock Token recovery; the main operator's separate authority
      over ETH after canonical receipt is unchanged. Two fresh independent price sources set the more conservative
      output floor and divergence above 500 basis points fails closed. V1 accepts only conventional balance-delta
      ERC-20 behavior. A successful adapter ends with zero attributable token or ETH residue and zero allowance; forced
      unsolicited dust receives no recovery credit and is quarantined. Public APIs return unsigned calldata and never
      sponsor or relay anonymous gas. Canonical history derives only from finalized events emitted by pinned contracts.
      Failed, duplicate, or malformed spam may be rate-limited and alerted on operationally but cannot automatically
      pause recovery, open a financial incident, or write canonical history. Before activation, OMERTÀ publishes a
      vulnerability-disclosure or bounty channel, independently monitors code identity, balances, allowances, oracle
      divergence, recovery rate, and sequence gaps, and rehearses pause, cancellation, and rotation. These are
      conditional safety constraints, not a reason to build a recovery subsystem before it is needed.</p>
      <p>Ordinary RWA funding does not use an automatic percentage of prior-day protocol revenue and keeps no mandatory
      minimum acquisition-vault ETH reserve. The exact maximum ETH budget comes only from backed available acquisition
      ETH and is published and atomically frozen before the ballot opens; voting, a winner, later deposits, operator
      edits, or price movement cannot resize it. There is no policy minimum economic purchase size, although actual
      balance, venue minimums, caps, quotes, slippage, health, and other ordinary execution walls still fail normally.</p>
      <p>The MVP may acquire only the Safe-approved provider-native spot Stock Token for the voted underlying. It does
      not buy LP tokens, lending receipts, yield wrappers, synthetic equities, derivatives, or bridged wrappers. After
      allocation, OMERTÀ may not sell, rebalance, rotate, or market-time the holding. Delivery and the existing mandatory
      corporate-action, provider-retirement, legal, or worthless-removal processes are the only disposition paths.
      Leverage, borrowing, shorting, options, perpetuals, leveraged tokens, lending, rehypothecation, and collateral use
      are not permanently prohibited, but that future optionality authorizes none of them for the MVP.</p>
      <p>Verified OMR staking may multiply active-play allocation, but the boost is not live. It will read the same unified
      actual on-chain OMR gameplay position used by the Made Ladder, commitment locks, gameplay loss, unbonding, and
      inheritance—not a separate <code>account_persistent.staked</code> balance. Active-play qualification for human and agent accounts,
      NPC/resident exclusion, and recurring 30-day Broker activation remain mandatory. The selected future
      formula is <code>activationMult × activityScore × stakeMult</code>, so failed activity still produces zero.
      <code>stakeMult</code> uses fixed public tiers from finalized time-weighted-average eligible principal over the
      complete seven-day epoch. There is no separate 72-hour maturity delay: accepted principal contributes pro rata
      while staked. Each account binds one verified allocation wallet for an epoch and a wallet change begins next epoch.
      Liquid OMR, unclaimed rewards, claimed rewards not restaked, and Broker-activation spend do not count. The approved
      cap is 1.50×: below 300 OMR receives 1.00×; 300–999.999… receives 1.10×; 1,000–4,999.999… receives 1.20×;
      5,000–19,999.999… receives 1.35×; and 20,000 OMR or more receives 1.50×. Only finalized active and committed
      principal qualifies. Pending deposits, idle loot, unbonding, withdrawable, withdrawn, unattributed, quarantined,
      and unfunded legacy value do not. One verified wallet may qualify one permanent account per epoch; every conflicting
      claim receives zero stake multiplier until resolved. Each finalized transition changes the TWA prospectively from
      canonical time with no shortcut, backfill, or retroactive restoration.</p>
      <p>Only the Safe may change tiers or thresholds, after at least seven public days, effective no earlier than the first
      full epoch beginning after notice. Every epoch freezes the schedule, wallet/account bindings, eligible buckets,
      activity formula, activation requirement, and ruleset. A critical defect pauses or cancels that epoch rather than
      rewriting weights after participation is known. The replacement custody and settlement baseline is approved but not
      live: a new <code>OMRGameplayVault</code> has no
      personal APY, accepts only actual reserve-backed on-chain OMR, enforces commitment/unbonding, uses one-use typed and
      rate-bounded chain-first gameplay outcomes, and imports legacy stake only against deposited OMR. Until that vault,
      the tier schedule, and anti-flash historical snapshots are implemented and tested, the shipped formula remains
