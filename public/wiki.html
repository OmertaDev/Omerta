<style>
  /* The codex uses the same display face the city itself is set in, served from our own origin. */
  @font-face{font-family:'OmDisplay';src:url('/art/display.woff2') format('woff2');font-weight:600;font-display:swap}

  :root{
    --bg:#0a0908; --panel:#121110; --panel2:#191614; --line:#2b2622; --line2:#3a332d;
    --ink:#e4ddd0; --dim:#9a9184; --faint:#6b6357;
    --neon:#c9a24a; --neon-d:#8a6f31; --blood:#b3313a; --ok:#5f9d95; --bad:#d16a5f; --cold:#6a8fb5;
    --display:'OmDisplay','Oswald','Arial Narrow',sans-serif;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
    font-size:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.66;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 480px at 78% -8%,rgba(201,162,74,.07),transparent 62%);
    background-attachment:fixed}
  code,.mono,input{font-family:var(--mono)}
  a{color:var(--neon);text-decoration:none;text-underline-offset:3px}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--neon);outline-offset:2px}

  /* ── masthead ─────────────────────────────────────────── */
  #top{display:flex;align-items:center;gap:16px;padding:14px 22px;
    border-bottom:1px solid var(--line);background:rgba(10,9,8,.94);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:6}
  #top .sub{color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  #top .home{margin-left:auto;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;
    border:1px solid var(--line2);padding:6px 12px;border-radius:2px;color:var(--dim)}
  #top .home:hover{color:var(--neon);border-color:var(--neon-d);text-decoration:none}

  /* ── shell ────────────────────────────────────────────── */
  #wrap{display:grid;grid-template-columns:296px 1fr;min-height:calc(100vh - 56px)}
  #nav{border-right:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg));
    padding:16px 0 40px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;scrollbar-width:thin}
  #nav .search{padding:0 16px 12px}
  #nav input{width:100%;background:#0e0d0c;border:1px solid var(--line2);color:var(--ink);
    min-height:44px;padding:9px 11px;border-radius:2px;font-size:13px}
  #nav input::placeholder{color:var(--faint)}
  #search-results{padding:0 10px 10px}
  #search-results:empty{display:none}
  #search-results a{display:block;min-height:44px;padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink)}
  #search-results a:hover{background:var(--panel2);text-decoration:none}
  #search-results strong{display:block;font:600 13px/1.35 var(--display);letter-spacing:.04em}
  #search-results .search-hit__snippet{display:block;margin-top:3px;color:var(--dim);font-size:12.5px;line-height:1.45}
  #search-results mark{background:rgba(201,162,74,.2);color:var(--ink);padding:0 1px}
  #nav.searching #navlist{display:none}
  #nav .grp{color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;padding:18px 18px 6px;display:flex;align-items:center;gap:9px}
  #nav .grp:after{content:'';flex:1;height:1px;background:var(--line)}
  #nav a.item{display:block;padding:6px 18px 6px 22px;color:var(--dim);font-size:13.5px;
    border-left:2px solid transparent;line-height:1.4}
  #nav a.item:hover{background:var(--panel2);color:var(--ink);text-decoration:none}
  #nav a.item.on{color:var(--neon);border-left-color:var(--neon);background:rgba(201,162,74,.07)}
  #nav a.item.hide{display:none}
  #doc .empty{padding:8px 0 40px}

  /* ── the reading column ───────────────────────────────── */
  #doc{padding:40px 44px 120px;max-width:860px}
  #doc .codex-intro{margin-bottom:44px;padding-bottom:28px;border-bottom:1px solid var(--line)}
  #doc .codex-intro h1{font-family:var(--display);font-size:clamp(38px,6vw,64px);line-height:1;
    margin:8px 0 12px;color:var(--neon);letter-spacing:.08em;text-transform:uppercase;text-wrap:balance}
  #doc .codex-intro p{color:var(--dim);font-size:17px;max-width:66ch;margin:0 0 16px}
  #doc section{scroll-margin-top:76px;margin-bottom:56px;padding-bottom:40px;border-bottom:1px solid var(--line)}
  #doc section:last-child{border-bottom:0}
  #doc .num{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--faint);
    text-transform:uppercase;display:block;margin-bottom:9px}
  #doc h2{font-family:var(--display);font-weight:600;color:var(--ink);letter-spacing:.02em;
    font-size:clamp(25px,3.4vw,36px);line-height:1.08;margin:0 0 6px;text-transform:uppercase;text-wrap:balance}
  #doc .tag{color:var(--neon);font-size:14px;font-style:italic;margin:0 0 22px}
  #doc h3{font-family:var(--display);color:var(--neon);font-size:15px;letter-spacing:.13em;
    text-transform:uppercase;margin:30px 0 10px;padding:0;border:0;font-weight:600}
  #doc p,#doc li{font-size:16px;color:var(--ink)}
  #doc p{margin:0 0 14px;max-width:72ch}
  #doc .dim{color:var(--dim)}
  #doc ul{margin:10px 0 14px;padding-left:0;list-style:none;max-width:72ch}
  #doc ul li{position:relative;padding-left:20px;margin-bottom:8px}
  #doc ul li:before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;
    background:var(--neon-d);transform:rotate(45deg)}
  #doc b,#doc strong{color:#fff;font-weight:600}
  #doc code{background:rgba(95,157,149,.09);border-radius:2px;padding:1px 5px;font-size:13.5px;
    color:var(--ok);-webkit-box-decoration-break:clone;box-decoration-break:clone}

  /* the loop / callout — a pull-quote, not a box */
  #doc .loop{background:rgba(201,162,74,.055);border:1px solid color-mix(in srgb,var(--neon) 34%,var(--line));
    border-radius:2px;padding:14px 18px;margin:18px 0;font-size:16px;max-width:72ch}
  #doc .loop b{color:var(--neon)}
  #doc .loop:first-child{margin-top:0}

  /* the lead paragraph */
  #doc .lead{font-size:19px;line-height:1.58;color:var(--dim);border:0;background:none;padding:0;
    margin:0 0 20px;max-width:66ch}
  #doc .lead b{color:var(--ink)}

  /* tables read as data */
  #doc table{border-collapse:collapse;margin:18px 0;font-size:14.5px;width:100%;
    border:1px solid var(--line);font-variant-numeric:tabular-nums}
  #doc th,#doc td{border:0;border-bottom:1px solid var(--line);padding:9px 13px;text-align:left;vertical-align:top}
  #doc thead th{font-family:var(--display);background:var(--panel2);color:var(--dim);font-weight:600;
    text-transform:uppercase;font-size:11px;letter-spacing:.14em;border-bottom:1px solid var(--line2)}
  #doc tbody tr:last-child td{border-bottom:0}
  #doc tbody tr:hover td{background:rgba(201,162,74,.04)}
  #doc .warn{color:var(--bad)}

  /* the route line — a receipt at the foot of a section */
  #doc .routes{color:var(--faint);font-size:12px;font-family:var(--mono);line-height:1.7;
    border-top:1px solid var(--line);margin-top:20px;padding-top:11px;word-break:break-word}

  /* Editorial research sheets. The previews stay compact; each image links to the full-resolution export. */
  #doc .diagram-series{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0 28px;max-width:1040px}
  #doc .diagram-sheet{margin:0;background:var(--panel2);border:1px solid var(--line2);border-radius:2px;overflow:hidden}
  #doc .diagram-sheet:first-child{grid-column:1/-1}
  #doc .diagram-sheet--wide{grid-column:1/-1}
  #doc .diagram-sheet--portrait{grid-column:1/-1;width:min(100%,560px);justify-self:center}
  #doc .diagram-sheet a{display:block;background:var(--panel2)}
  #doc .diagram-sheet img{display:block;width:100%;height:auto}
  #doc .diagram-sheet figcaption{padding:8px 10px;background:var(--panel2);color:var(--dim);font:11px/1.45 var(--mono)}
  #doc .diagram-sheet:hover{border-color:var(--neon-d)}

  #totop{position:fixed;right:22px;bottom:22px;z-index:7;font-family:var(--mono);font-size:11px;
    letter-spacing:.1em;color:var(--dim);background:rgba(18,17,16,.94);border:1px solid var(--line2);
    min-height:44px;display:inline-flex;align-items:center;padding:9px 13px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s}
  #totop.show{opacity:1;pointer-events:auto}
  #totop:hover{color:var(--neon);border-color:var(--neon-d);text-decoration:none}
  #nav-toggle{display:none;width:calc(100% - 32px);min-height:44px;margin:0 16px 12px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);font-family:var(--mono);text-align:left;padding:9px 11px;cursor:pointer}
  #search-status{padding:0 18px;color:var(--faint);font-family:var(--mono);font-size:11px}

  @media (max-width:900px){
    #wrap{grid-template-columns:1fr}
    #nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);max-height:44vh}
    #nav-toggle{display:block}
    #nav.collapsed{max-height:none;padding-bottom:4px}
    #nav.collapsed #nav-content{display:none}
    #doc{padding:26px 18px 80px}
    #doc .codex-intro{margin-bottom:32px}
    #doc section{margin-bottom:40px;padding-bottom:30px}
    #doc .diagram-series{grid-template-columns:1fr}
    #top{padding:11px 14px;gap:10px}
    #top h1{font-size:20px}
    #top .sub{display:none}
    #nav a.item{min-height:44px;display:flex;align-items:center;padding-block:9px}
    #nav .search{padding-top:4px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// ── The codex content. Each section: { id, group, title, tag, html }. Rendered into #doc + #nav. ──
// GROUPS order the sidebar. Content authored from the verified feature inventory.
const R = (s) => `<div class="routes">${s}</div>`;          // route line
const L = (s) => `<div class="loop">${s}</div>`;            // loop / callout
const escText = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const searchExcerpt = (text, query) => {
  const clean = String(text || '').replace(/\s+/g, ' ').trim();
  const lower = clean.toLowerCase(), at = lower.indexOf(query);
  const from = Math.max(0, at - 54), to = Math.min(clean.length, at + query.length + 110);
  const before = clean.slice(from, at), match = clean.slice(at, at + query.length), after = clean.slice(at + query.length, to);
  return `${from ? '…' : ''}${escText(before)}<mark>${escText(match)}</mark>${escText(after)}${to < clean.length ? '…' : ''}`;
};
const SECTIONS = [
  { id: 'welcome', group: 'Start', title: 'Welcome to the City', tag: 'what this is',
    html: `<p class="lead">OMERTÀ is a persistent, server-authoritative multiplayer mafia RPG. You start in the Docks with $500, build a street, and share the city with human and autonomous players. Other players can kill your character; the account and its named bloodline records continue.</p>
      <p>Use the search box to find a system, risk, or route. The numbers here are the current settings and can change. "Level N" is your
      character level. The level comes from respect: <code>level = floor(sqrt(respect/10)) + 1</code> — L5 ≈ 160 respect,
      L10 ≈ 810, L20 ≈ 3,610, L30 ≈ 8,410.</p>` },

  { id: 'coreloop', group: 'Start', title: 'The Core Loop', tag: 'how you earn and grow',
    html: `${L(`Do <b>jobs</b> for cash → <b>train</b> your stats → put your cash in the <b>bank</b> → set up <b>income
      sources</b> that pay you while you are away → increase your <b>level</b>.`)}
      <p><b>Crimes</b> — 43 jobs, from Pickpocket (L1) to Empty the Federal Depository (L110). Each job has a level
      requirement, a nerve cost, a cash range, and a chance of jail if you fail. Your success rate increases with cunning
      and speed, your family level, some districts, and your rank. Jobs can give <b>crates</b> (buy guns and make gear) and
      <b>makings</b> (Kitchen ingredients).</p>
      <p><b>Every job has a mark, and the money comes off them.</b> A crime names a victim drawn from the NPC residents standing in your district. When that mark has money on them, <b>THE TAKE</b> moves it: the cash you earn is transferred off their pocket (up to 25% of it per job) and only the shortfall is created by the game. A job on a busy street is a robbery with a name on it; a job on an empty one still pays exactly the same, it just comes from nowhere. Marks are always NPC residents — a real player is never robbed by a stranger's crime roll, because they would get no warning and no way to answer. Taking from a real player is what the PvP asset crimes are for (rob a front, steal a car, mug their trunk), and those always tell the victim who did it.</p>
<p><b>Energy and nerve</b> power your actions and increase again with time. <b>Heat</b> is the police attention that
      crime causes. Too much heat starts a police case. <b>Train</b> costs 10 energy (the increase becomes smaller as a
      stat becomes higher). <b>Heal</b> returns you to full health. <b>Check in</b> one time each day for a streak bonus
      and energy.</p>
      <p><b>The Bank:</b> cleared bank cash is outside a killer's loot cut, but it does <b>not</b> survive your character's death. A new deposit stays <b>"in transit" for exactly 2 hours</b> and remains lootable until it clears. You cannot use the bank from a safehouse.</p>
      ${R(`POST /v1/crimes/:id · /train/:stat · /heal · /checkin · /bank/deposit|withdraw · /travel/:district`)}` },

  { id: 'character', group: 'The Basics', title: 'Your Character, Death & the Heir', tag: 'respect, rank, the estate',
    html: `<p>Each account has one living character. You start at L1, with 50 energy, 10 nerve, 100 health, $500, and a RANDOM
      stat spread (always 15 points across muscle/cunning/speed, each at least 3 — no two builds the same). <b>Respect</b> is your experience. It sets your <b>level</b> and your <b>rank</b> (benefits at L10
      Hustler, L35 Enforcer, L65 Soldier "made man", L95 Underboss, L125 Don). <b>Effective stats</b> = trained + gear +
      assets. <b>Firepower (fp)</b> comes from your gun — you need 50 fp or more to make a lethal hit.</p>
      ${L(`<b>Death:</b> the character dies, but the account does not die. An heir is born and inherits everything at the
      account level.`)}
      <p><b>Lost when the character dies:</b> pocket and bank cash, stats, skills, businesses, the speakeasy, the Kitchen crew, the boxing fighter, territory operation control, and this season's kills. <b>Passes to the heir:</b> the remaining $OMR after the game's loot and death rules, prestige, the Estate, deeds, Store patron/pass benefits, minted status, revive tokens, account-level legends, and 25% of your Underworld standings.</p>
      <p><b>Seasons</b> last 28 days. At the end, your level converts to prestige (<code>floor(level/2)</code>) and your
      respect returns to 0. <b>Respec</b> your stats for 90 $OMR (24-hour cooldown).</p>
      ${R(`POST /v1/character · GET /v1/me · /v1/session · POST /v1/respec`)}` },

  { id: 'paths', group: 'The Basics', title: 'Choose Your Route', tag: 'paths, skills, mastery, career',
    html: `<p class="lead"><b>No two streets have to grow the same way.</b> At level 5, $10,000 declares one of six Paths. Your Path changes concrete clocks, payouts, risks, and the rate at which specific trades learn. It does not lock you out of the rest of the city.</p>
      ${L(`<b>Five systems shape the character:</b> the three core attributes, one declared Path, a three-branch skill build, ten learn-by-doing mastery tracks, and a five-book account-level Career.`)}
      <p>The first Path pick costs cash and starts the switch clock. A later change burns <b>150 $OMR</b> and requires <b>7 days</b> since the previous choice. Home trades learn at <b>×1.5 mastery XP</b>, rival trades at <b>×0.6</b>, and every other trade remains at ×1.0. Skills award one point per four levels; mastery is earned only by doing the relevant work; Career claims are cash-only and survive the character.</p>
      <p class="loop"><b>Not sure which doctrine fits?</b> <a href="/path?source=wiki">Take the seven-decision Path quiz</a>. The result shows every signed edge, handicap, home school, and rival school before the guest-play CTA.</p>
      <div class="diagram-series diagram-series--gameplay" aria-label="Nine-sheet code-anchored gameplay route explainer">
        <figure class="diagram-sheet diagram-sheet--wide">
          <a href="/art/gameplay-01-choose-your-path.png?v=b56cedce0f70" aria-label="Open the full-size choose-your-Path field guide">
            <img src="/art/gameplay-01-choose-your-path.png?v=b56cedce0f70" width="6480" height="4080" loading="lazy" alt="Six-way OMERTA Path selector comparing The Gun, Ledger, Kitchen, Wheel, Shadow, and Ring, including every signed edge, handicap, home trade, and rival trade.">
          </a><figcaption>01 / 09 · SIX WAYS INTO THE CITY · EVERY EDGE HAS A COST</figcaption>
        </figure>
        <figure class="diagram-sheet">
          <a href="/art/gameplay-02-the-gun.png?v=23daa219f30d" aria-label="Open the full-size Gun Path dossier">
            <img src="/art/gameplay-02-the-gun.png?v=23daa219f30d" width="6480" height="4080" loading="lazy" alt="The Gun gameplay dossier showing its street-fight, hit-contract, trade-sale, mastery, skill, and counterplay mechanics.">
          </a><figcaption>02 / 09 · THE GUN · FORCE CREATES WINDOWS, NOT SAFETY</figcaption>
        </figure>
        <figure class="diagram-sheet">
          <a href="/art/gameplay-03-the-ledger.png?v=3e4259f905c2" aria-label="Open the full-size Ledger Path dossier">
            <img src="/art/gameplay-03-the-ledger.png?v=3e4259f905c2" width="6480" height="4080" loading="lazy" alt="The Ledger gameplay dossier showing its racket, front, commerce, street-power, mastery, skill, and counterplay mechanics.">
          </a><figcaption>03 / 09 · THE LEDGER · TURN MOVEMENT INTO MARGIN</figcaption>
        </figure>
        <figure class="diagram-sheet">
          <a href="/art/gameplay-04-the-kitchen.png?v=06a91cbd9a54" aria-label="Open the full-size Kitchen Path dossier">
            <img src="/art/gameplay-04-the-kitchen.png?v=06a91cbd9a54" width="6480" height="4080" loading="lazy" alt="The Kitchen gameplay dossier showing cook quality, dealing heat, jail time, mastery, skill, and counterplay mechanics.">
          </a><figcaption>04 / 09 · THE KITCHEN · QUALITY UP, HEAT DOWN</figcaption>
        </figure>
        <figure class="diagram-sheet">
          <a href="/art/gameplay-05-the-wheel.png?v=20b5b3719ab7" aria-label="Open the full-size Wheel Path dossier">
            <img src="/art/gameplay-05-the-wheel.png?v=20b5b3719ab7" width="6480" height="4080" loading="lazy" alt="The Wheel gameplay dossier showing convoy speed, cook-time handicap, Wheels and Seamanship mastery, skill synergies, and counterplay.">
          </a><figcaption>05 / 09 · THE WHEEL · OWN THE CLOCK</figcaption>
        </figure>
        <figure class="diagram-sheet">
          <a href="/art/gameplay-06-the-shadow.png?v=d98e482bd5e2" aria-label="Open the full-size Shadow Path dossier">
            <img src="/art/gameplay-06-the-shadow.png?v=d98e482bd5e2" width="6480" height="4080" loading="lazy" alt="The Shadow gameplay dossier showing search-clock, duel and bout, Larceny and Wet Work mastery, skill synergies, and counterplay.">
          </a><figcaption>06 / 09 · THE SHADOW · WIN BEFORE THE FIGHT STARTS</figcaption>
        </figure>
        <figure class="diagram-sheet">
          <a href="/art/gameplay-07-the-ring.png?v=f3662833ee7f" aria-label="Open the full-size Ring Path dossier">
            <img src="/art/gameplay-07-the-ring.png?v=f3662833ee7f" width="6480" height="4080" loading="lazy" alt="The Ring gameplay dossier showing duel and bout power, Doctor-cost handicap, Fisticuffs and Gambler mastery, skill synergies, and counterplay.">
          </a><figcaption>07 / 09 · THE RING · MAKE PRESSURE PAY</figcaption>
        </figure>
        <figure class="diagram-sheet diagram-sheet--wide">
          <a href="/art/gameplay-08-character-blueprint.png?v=972a60e45d41" aria-label="Open the full-size character-system blueprint">
            <img src="/art/gameplay-08-character-blueprint.png?v=972a60e45d41" width="6480" height="4080" loading="lazy" alt="Complete character blueprint linking attributes, the declared Path, skill branches, ten mastery tracks, rank milestones, virtuoso traits, inheritance, and Career progression.">
          </a><figcaption>08 / 09 · THE CITY RECORDS WHAT YOU BECOME · FIVE INTERLOCKING SYSTEMS</figcaption>
        </figure>
        <figure class="diagram-sheet diagram-sheet--wide">

          </a><figcaption>09 / 09 · FROM ASSOCIATE TO THE DON · 30 TASKS, FIVE BOOKS, ONE ACCOUNT RECORD</figcaption>
        </figure>
      </div>
      ${R(`POST /v1/path · GET /v1/skills · POST /v1/skills/:id · GET /v1/mastery · GET /v1/career · POST /v1/career/:taskId`)}` },

  { id: 'cars', group: 'The Basics', title: 'Cars, Guns & Gear', tag: 'the garage and the armory',
    html: `<p><b>Cars and the Garage</b> (limit 12). 60 models, each with trims. <b>Boost</b> steals a random car (5-minute
      cooldown). <b>Melt</b> scraps a car for ammo (25% goes to your family). <b>Fence</b> and <b>repair</b> sell or fix a
      car. A car that is listed or pledged refuses melt, fence, and repair.</p>
      <p><b>Guns and the Armory.</b> 15 guns (Rusty .25 fp3 to the 'Undertaker' fp60), bought with cash and crates.
      <b>Vests</b> (bought with $OMR) increase survival. <b>Ammo</b> costs $2000 for 50 rounds. Its price is <b>never
      reduced</b> — it controls the cost of a kill.</p>
      <p><b>Gear</b> (about 50 items, priced in $OMR) increases stats. The built chain rail can represent extracted gear as a tradeable NFT. A fire-kill has a <b>15% chance to take one in-game gear piece</b>. Extracted gear is safe but inert. <b>Production extraction is dormant</b>, so gear cannot move on-chain yet.</p>
      <p><b>Rarity, and the way off the board.</b> Every car and boat carries a rarity — Common, Rare, Legendary,
      Epic — rolled by the server the moment you <b>earn</b> it, and logged so the draw can be checked. Rarity has
      bounded utility: Rare / Legendary / Epic add <b>3% / 6% / 10%</b> to a car's chassis race power, or to a
      boat's base hold and speed. Driver stats, tuning, naval upgrades, resale value and melt yield are unchanged.
      You can buy your way up the ladder with $OMR, and
      the price buys <b>exactly the next tier</b> — a known item for a known price, never a roll. Any paid product
      that introduces a chance-based outcome must publish its own odds before purchase.</p>
      <p>Once the production rail opens, you can also take one <b>on-chain</b> through the same route gear uses. The tradeoff is:
      <b>in-game items are lootable; extracted NFTs are safe, and inert</b>. An extracted car is an ERC-1155 in your own
      wallet — nobody can steal it, win it in a pink-slip race, chop it off your corpse or take it in a war, and it
      <b>survives your death</b> and passes down the bloodline. In exchange it never races, hauls, melts, fences or
      earns again while it stays on-chain. The door swings both ways: whoever <b>holds</b> the NFT — you, or whoever
      bought it on a marketplace — can <b>burn it (redeem)</b> from their wallet, and the real thing comes back into
      play on <i>their</i> account, fresh and stock (tune, trim and damage do not make the trip). Gear makes the same
      round trip: burn a gear NFT and the class joins the burner's account — unless they already run the in-game copy,
      in which case the burn waits until that copy extracts or is lost. You must be MADE to take anything on-chain.</p>
      ${R(`POST /v1/garage/boost · /garage/:carId/melt|fence|repair · /armory/gun/:id/buy|equip · /armory/ammo · /workshop/craft/:id · GET /v1/nft · POST /v1/nft/:kind/:id/upgrade|withdraw`)}` },

  { id: 'city', group: 'The Basics', title: 'The City & the Living World', tag: 'events, weather, districts, NPC families',
    html: `<p>The city has a <b>daily background that is the same for all players</b> and can be known in advance. <b>City
      events</b> (16, one each day) change every loop (HEAT WAVE, DOCK STRIKE, THE CRACKDOWN, BUREAU SWEEP, OPEN CITY, and
      more). <code>GET /v1/city</code> shows the current day and a 7-day forecast. <b>Regional weather</b> changes
      trade-good prices. A <b>day and night clock</b> increases convictions during patrol hours (UTC 13–22) and makes night
      raids easier.</p>
      <table><tr><th>District</th><th>Benefit</th></tr>
      <tr><td>Docks</td><td>+50% contraband · the harbor · start here</td></tr>
      <tr><td>Neon Mile</td><td>+15% racket/front income · the vice district</td></tr>
      <tr><td>Old Foundry</td><td>workshop −25%</td></tr>
      <tr><td>Brick Yards</td><td>+2% crime success</td></tr>
      <tr><td>Canal Row</td><td>+10% crime pay</td></tr>
      <tr><td>Cathedral Hill</td><td>nerve increases two times faster</td></tr></table>
      <p><b>NPC rival families</b> — shared cash reserves that the whole server reduces together (Dock Rats L4, Zappa L8,
      Kryl L20, Moreau L40, Volkov L55 — the top three are crew-only raids). A raid costs energy, ammo, and heat, and pays a bonus if you reduce a family below its floor. If you
      defeat a family, your family holds its outpost (the outpost pays tribute to the treasury; a rival can take it by
      paying more than your garrison).</p>
      <p><b>The uprising</b> — the NPC families fight back. On some days (shown in advance on the forecast) a family rises up
      (harder to raid, no tribute). At the end, it leaves a held outpost if the garrison is too small — use <b>reinforce</b>
      from the treasury (this also protects against rival families) or lose the turf. If you keep a family weak, a small
      garrison is enough.</p>
      ${R(`GET /v1/city [public] · /v1/world · POST /v1/world/:npcId/raid · /v1/world/:npcId/reinforce · GET /v1/market/prices [public]`)}` },

  { id: 'economy', group: 'Money', title: 'The Economy — $OMR, the Window & the Vault', tag: 'the money cycle',
    html: `<p><b>Currencies:</b> cash (pocket and bank), <b>$OMR</b> (premium, account-level, earned through enumerated rules, and eligible for on-chain extraction by minted accounts once the production rail opens), crates, and ammo. <b>Cash can never buy $OMR.</b> The one live conversion runs the other way at the Window: spend $OMR for cash from a funded till. The game records every movement of value on a ledger.</p>
      <p><b>Read the books:</b> gold marks token or ETH movement, blue marks code-controlled supply or allocation, green marks arrived backing, and red marks blocked or dormant paths. Sheets 03 and 06 use the founder-signed go-live configuration; it is published but not armed while production chain rails are dormant. Sheets 01–05 open at 6480 × 4080; sheet 06 is the 1080 × 1350 portrait campaign map.</p>
      <div class="diagram-series" aria-label="Six-sheet code-anchored OMR system explainer">
        <figure class="diagram-sheet"><a href="/art/omr-01-severance.png?v=7b50aea177a2"><img src="/art/omr-01-severance.png?v=7b50aea177a2" width="6480" height="4080" loading="lazy" alt="Two-ledger OMR map showing street cash, the one-way Window, the 100 million OMR founding supply, bounded bond mint, and dormant full-reserve exit."></a><figcaption>01 / 06 · TWO LEDGERS. ONE CONTROLLED BRIDGE.</figcaption></figure>
        <figure class="diagram-sheet"><a href="/art/omr-02-return-velocity.png?v=cc8badf4b704"><img src="/art/omr-02-return-velocity.png?v=cc8badf4b704" width="6480" height="4080" loading="lazy" alt="OMR return-velocity loop from game utility to Desk inventory, a one-to-three-percent daily auction cap, and below-band buyback."></a><figcaption>02 / 06 · THE DESK: INVENTORY, NOT INFLATION.</figcaption></figure>
        <figure class="diagram-sheet"><a href="/art/omr-03-money-router.png?v=b2bde1b36f44"><img src="/art/omr-03-money-router.png?v=b2bde1b36f44" width="6480" height="4080" loading="lazy" alt="OMR money router with exact signed splits for gameplay fees, Store receipts, reserve bonds, DEX sell tax, Desk proceeds, POL fees, Bank harvest fees, and exit tolls."></a><figcaption>03 / 06 · FOLLOW EVERY DOLLAR.</figcaption></figure>
        <figure class="diagram-sheet"><a href="/art/omr-04-reserve-rwa.png?v=0b64dcd1f9f3"><img src="/art/omr-04-reserve-rwa.png?v=0b64dcd1f9f3" width="6480" height="4080" loading="lazy" alt="Parallel OMR extraction and tokenized-stock rails showing source percentages, the fifty-fifty Vig split, eligibility weights, and conservation invariants."></a><figcaption>04 / 06 · BACKING ARRIVES BEFORE THE PROMISE.</figcaption></figure>
        <figure class="diagram-sheet"><a href="/art/omr-05-ohm-contrast.png?v=c7d637922bd1"><img src="/art/omr-05-ohm-contrast.png?v=c7d637922bd1" width="6480" height="4080" loading="lazy" alt="Causal comparison of the legacy 2021 Olympus premium and issuance loop with OMR's separated issuance, game-demand, revenue, and backed-exit rails."></a><figcaption>05 / 06 · SAME CATEGORY. DIFFERENT FAILURE SURFACE.</figcaption></figure>
        <figure class="diagram-sheet diagram-sheet--portrait"><a href="/art/omr-06-the-omr-machine-1080x1350.png?v=f8d21f2a315f" aria-label="Open the full-size OMR machine portrait explainer"><img src="/art/omr-06-the-omr-machine-1080x1350.png?v=f8d21f2a315f" width="1080" height="1350" loading="lazy" alt="Portrait OMR machine explainer showing the signed fee, Store, bond, sell-tax, POL-fee and Desk splits; the fifty-fifty Vig reserve and prize allocation; the recycling Desk; the activity-weighted Stock Machine; commitment staking; and dormant production rails."></a><figcaption>06 / 06 · THE $OMR MACHINE · DEMAND IS THE GAME. DEFENSE IS CODE-BOUNDED RECYCLING.</figcaption></figure>
      </div>
      <p><b>The game has no time-based $OMR faucet.</b> No wage, inflationary yield, or drip. One-time mission awards and daily prize credits are enumerated and funded on the game ledger; they do not call the ERC-20 mint. The contract has one additional mint path — <b>OmertaBond</b> — behind a daily cap, a 20% discount ceiling, a fail-closed TWAP and an absolute rate wall. Contract staking, if funded, redistributes a pre-loaded reward pool rather than minting rewards.</p>
      <p>Five ways to get some: <b>take it</b>
      (a kill loots the victim's liquid $OMR — staked and committed $OMR is safer), <b>earn it</b> from a
      player who pays you in it, <b>work for it</b> (the mission ladder's one-time payouts and the daily
      all-three bonus), <b>buy it</b>, or <b>get paid out of the Bank</b>. A nightly job asserts nothing
      unenumerated appeared, so it is a fact you can check rather than a promise.</p>
      <p><b>The Bank's city leg</b> — the fifth way, and the only one that pays you for simply playing.
      People who borrow from the Bank pay to use it; that profit is spent <b>buying $OMR on the open
      market</b>, and the whole of it goes to the players who played that day. Nothing is printed — every
      token in the split was purchased first, so it moves no supply.</p>
      <p>Your share is your share of what the whole city did that day, <b>flat and with no cap</b> — a man
      running ten accounts takes exactly what he would have taken running one, so there is no reward for
      splitting yourself up. Only actions the game itself rations count (nerve, energy, a cooldown); nothing
      you can simply buy more of. To be in a day's split you need work across <b>three different trades</b>
      and a minimum day's score — the board shows where you stand and what you still need. It is not a rate
      and not a promise: the size of the split is whatever the Bank actually earned.</p>
      <p><b>The Desk</b> — where you buy it, and where it goes when you spend it. Every $OMR a sink takes
      off you (a vanity burn, an estate tier, a jury, the Window) is <b>not destroyed</b> — it lands on the
      desk's shelf and goes back up for sale. Once a day the desk runs a <b>descending auction</b>: it opens
      high, the price falls for six hours toward a <b>reserve</b>, and whatever does not sell rolls to
      tomorrow. The lot is what came home yesterday, capped at 1% of all the $OMR in player hands so a big
      spending day can't become a dump. <b>The desk can only sell what is on its shelf</b> — it never issues
      anything, so buying here moves no supply: those are somebody else's spent chips changing hands. There is a
      <b>buy side</b> too: if the price falls far enough below the 30-day average the desk restocks off the open
      market rather than waiting for the sinks — paid for out of the trading fees the game's own liquidity earns,
      never by printing. Between the two edges it does nothing, deliberately: a desk that buys and sells at once is
      paying fees to trade with itself. The
      board publishes the shelf, the clock, the price and the exact list of spends that feed it. <b>$OMR
      bought at the desk is FRESH</b> — full early-exit toll for its first 48 hours, like any other.</p>
      <p><b>The Exchange window</b> — the ONE conversion, one way: spend $OMR, receive cash at a published
      rate, from a till that real cash sinks fill. A short till refuses and takes nothing. 5% of every
      redemption goes to the top families (the family yield). <b>Cash can never become $OMR</b> — there is no swap
      and no laundering rail. <b>The early-exit tax:</b> $OMR younger than 48 hours pays
      an extra toll when withdrawn on-chain — 50% at age zero, straight-line to 0% at 48 hours, newest tokens
      priced first, no exemptions.</p>
      <p><b>THE MADE MAN</b> — the recurring subscription. Pay <b>120 $OMR every 30 days</b> and you are <i>made</i>:
      the badge, the upper compound (Country Estate and above), a club of your own, and <b>the pad pays itself</b> —
      your fronts settle their own cash upkeep the moment you touch them, so a stretch away does not leave them cold.
      <b>It buys capped economic capacity and convenience, never a higher combat ceiling:</b> raw combat stats and the
      maximum combat power do not move. Operating costs stay in cash — all of them — which is the line that keeps the game free. A
      man who never pays dues runs the whole city at full strength, and can hunt made men for their $OMR. Dues are a
      sink like any other, so they go to <b>the Desk</b> to be sold again rather than being destroyed.</p>
      <p><b>The access stake</b> — the Den's high-stakes room wants a seat (level 30, or the Madame's velvet rope)
      <i>and</i> <b>300 $OMR held in a stake</b>. Held, not spent: it earns nobody anything, and its whole job is to put a
      permanent, visible, lootable float on exactly the players worth hunting.</p>
      ${L(`<b>The Vault (staking)</b> is <b>cheaper cover, not a safe harbour</b>. Nothing makes $OMR
      untouchable. A killer takes <b>50%</b> of a loose or unbonding balance and <b>20%</b> of a
      staked one — committing halves what a bad night costs you without ever making you safe. Your full principal
      always returns, but it <b>unbonds for 6 hours</b> (at the higher idle rate) on the way out. Staking pays the
      staker no yield — $OMR yield goes to THE FAMILIES, through the family yield.`)}
      <p>The founder-directed replacement makes that stake actual on-chain OMR rather than a separate database balance.
      The same canonical position must drive the Made Ladder, commitment multiplier, Den access, Broker staking
      multiplier, gameplay loss, unbonding, inheritance, and public accounting. The database may mirror finalized chain
      state and journal pending settlement, but cannot independently create or move stake. The approved design uses a
      new <code>OMRGameplayVault</code>, not the current yield-oriented <code>OMRStaking</code> contract. Principal pays no
      personal APY; family yield and separately backed utility rewards remain. Game-earned OMR must first become real,
      reserve-backed on-chain OMR before staking, with no double credit even when claim-and-stake is atomic.</p>
      <p>The vault enforces pending deposit, active/committed stake, six-hour unbonding, withdrawable, and withdrawn
      states. A narrowly authorized, Safe-rotatable gameplay signer may apply one-use, rate-bounded game outcomes but may
      not sweep funds. Loot moves actual OMR inside the vault from the victim's exposed position to the killer's on-chain
      gameplay balance. Chain settlement finalizes before the game consumes one-use resources or publishes an
      irreversible result, and value-taking actions stop safely during chain or settlement outages. Legacy database
      stake imports only against actual deposited OMR; no migration mint covers a shortage, which remains a published
      liability. This design is approved, not live, pending implementation, audit, funded migration, and launch checks.</p>
      <p>Only the account's verified controller wallet or the reserve-backed claim-and-stake rail may fund its position;
      a bypass transfer cannot stake for somebody else or qualify them. The position follows the permanent game account,
      not a character name, so death or respawn preserves principal and history. Depositing or committing accepts a
      published on-chain risk-ruleset version. The vault—not the gameplay signer—enforces maximum losses of 20% for
      active/committed stake and 50% for idle/unbonding OMR. The Safe may reduce or pause exposure, but a higher rate or
      new loss type requires a new public version and fresh consent.</p>
      <p>Value-taking actions move through prepared, submitted, finalized, and game-committed states. The final vault
      event is the one source for crash recovery; concurrent settlements use only the balance actually available and
      cannot overdraw. Every position change creates on-chain history for the Made Ladder and Broker time-weighted
      average. Emergency controls are separate, so a gameplay or signer incident does not automatically trap withdrawals;
      stopping exits requires a specifically declared custody-integrity incident.</p>
      <p>The founder selected an upgradeable gameplay vault rather than a non-upgradeable migration-only contract. The
      proxy implementation and upgrade controller are therefore real trust assumptions: an upgrade can technically change
      rules, rates, settlement, pauses, or withdrawal behavior. The approved structure uses an OpenZeppelin Transparent
      Proxy and dedicated <code>ProxyAdmin</code>, owned by a small non-upgradeable upgrade governor. Only the Safe may
      propose, cancel, or execute; the main operator, gameplay signer, relayer, servers, and individual wallets have no
      upgrade power.</p>
      <p>An upgrade or upgrade-control change is published for at least 48 hours with its exact old/new code hashes,
      version, initialization call, storage-layout commitment, reason, review evidence, and execution window. Emergencies
      may pause affected functions immediately but cannot bypass that delay. Implementations cannot initialize themselves,
      and a versioned setup step runs once inside the exact upgrade transaction. That transaction validates OMR identity,
      balance and liabilities, ruleset, settlement nonces, pauses, controller bindings, and version; a failed continuity
      check reverts the upgrade. Independent review and rehearsal remain necessary because upgradeable code can be
      malicious.</p>
      <p>A rollback follows the same proposal and delay. An upgrade that increases economic risk requires a new ruleset
      and fresh consent, while a player who does not consent keeps an exit under the previously accepted terms. Public
      surfaces show the proxy, implementation and code hash, governor, Safe, delay, pending proposal, evidence, validation
      result, and full history. Any unexplained code or authority mismatch stays red and stops new deposits and
      commitments without silently stopping exits.</p>
      <p>Changing a healthy controller normally requires signatures from both the current and proposed wallets.
      Lost-wallet recovery is slower: authenticated control of the permanent game account plus proof of the new wallet
      opens a public seven-day request and notifies every available account channel. The current controller may contest
      it; only the Safe may resolve a contested request against public evidence, and nobody may shorten the seven-day
      minimum. While recovery is open, withdrawals, deposits, new commitments, and more controller changes stop, but
      existing commitments, unbonding clocks, gameplay exposure, and valid losses continue—recovery is not a temporary
      shield. A completed change advances the public controller generation, invalidates unfinished old-wallet
      authorizations, and never rewrites finalized history. EOA and ERC-1271 smart-contract wallets are supported and
      invalid contract-wallet responses fail closed.</p>
      <p>Unlocked principal is withdrawn directly by the current controller to that same wallet. There is no arbitrary
      recipient, server signature, support override, or required relayer. Stake, unbond, and withdrawal accept partial
      amounts. Every partial unstake has its own amount, start, six-hour unlock, ruleset version, and exposure history; a
      later request cannot restart or rewrite an earlier clock. Gameplay loss consumes eligible unbonding tranches by
      earliest unlock time, ties by lowest immutable tranche ID, and exhausts one before the next. There may be at most
      16 live unbonding tranches per account; matured tranches do not count, and an over-cap unstake fails before changing
      state. A partial unstake must be at least 0.01 OMR, except the exact full remaining eligible stake can always exit.
      Matured tranches aggregate into one withdrawable balance, while immutable events and checkpoints preserve each
      tranche's complete history.</p>
      <p>The vault accepts only the pinned OMR contract and records what its balance actually received, not what a caller
      claimed to send. Transfer fees, rebases, hooks, malformed results, and amount mismatches cannot fabricate a position.
      OMR sent around the deposit route is unattributed and qualifies nobody. The vault continuously requires its actual
      OMR balance to cover every accounted liability. A shortfall is a red custody-integrity incident that stops new risk;
      no database or operator entry may conceal it, and the withdrawal response remains separately visible.</p>
      <p>Unattributed OMR remains nonqualifying and nonspendable while the vault is solvent. Only the Safe may recover
      exact, verified surplus after a public 48-hour proposal, and only to the single fixed OMR recovery-treasury address.
      The proposal publishes the amount, destination, evidence/reason, earliest execution, and expiry; a changed proposal
      restarts the delay. It cannot credit a player, settle gameplay, choose an arbitrary recipient, or be executed by the
      main operator, gameplay signer, relayer, or server. Anyone may fund a deficit with exact OMR. Actual OMR received
      repairs the deficit first, credits no player and creates no qualification, yield, repayment claim, or gameplay
      credit; excess becomes unattributed.</p>
      <p>Any positive custody deficit automatically pauses withdrawals as well as deposits, new commitments, and gameplay
      debits. Every player's liability remains recorded in full—there is no haircut, pro-rata conversion, first-come
      payout, operator write-off, or database adjustment. When canonical zero deficit reaches configured finality and
      the continuous public mirror synchronizes, the deficit-specific pauses clear automatically without acknowledgment
      or cooldown; unrelated pauses remain. The vault checks solvency before and after every value-changing operation.
      Permissionless solvency and unattributed-balance synchronization are available, every zero-to-positive recurrence
      receives a new immutable incident ID, and public monitoring proves actual balance, full liabilities, incident
      generation, finality, mirror freshness, and sequence continuity. An acknowledgment cannot close or conceal an
      incident.</p>
      <p>Gameplay loss is calculated by the vault from each eligible bucket's balance immediately before settlement. The
      signer can supply ceilings but cannot choose or inflate that balance. Calculations round down to OMR atomic units,
      never up to one; a legitimate zero-loot result still finalizes. If one outcome touches several buckets, the vault
      calculates them independently and settles them atomically in one transaction, follows the approved
      unbonding-tranche order, credits the killer once with the combined actual loot, and reverts everything if any
      invariant fails.</p>
      <p>Finalized loot enters the killer's idle on-chain gameplay balance and remains exposed at the idle rate. It is not
      automatically committed or staked and does not enter the Broker stake time-weighted average until the killer takes
      the separately authorized eligible action. A settlement authorization cannot have a future issue time and must be
      canonically included within five minutes; once timely included, it may reach finality after that deadline. The
      prepared state is only an expiring off-chain journal entry. It cannot reserve OMR, consume a nonce, pause
      withdrawals, or lock the victim.</p>
      <p>Every outcome binds a globally unique immutable gameplay event ID and the victim's exact next monotonic settlement
      nonce. A successful settlement consumes the nonce even when actual loot is zero; preparation, rejection, expiry,
      and revert do not. The MVP settles exactly one outcome and emits one complete record per transaction; batching is
      not authorized.</p>
      <p>During an ordinary signer rotation, the new generation activates immediately while an old authorization remains
      usable only if issued before canonical rotation and still within both its original deadline and a maximum five-minute
      overlap. An emergency Safe revocation has no overlap and invalidates every old-generation authorization not already
      included; finalized settlement remains immutable.</p>
      <p>Settlement submission is permissionless. Any address may present the exact signed authorization, but gains no
      authority over the victim, killer, amount, rate, buckets, recipient, controller, ruleset, pauses, custody, or
      upgrades. There is no approved-relayer registry, relayer-count cap, or operator-managed relayer set. Invalid, stale,
      expired, replayed, malformed, and losing-race submissions change no canonical state; those callers pay their own gas,
      and spam alone cannot pause settlement or create a financial incident.</p>
      <p>Protocol users may voluntarily fund settlement gas shared by the whole community through a dedicated,
      non-upgradeable <code>SettlementGasPool</code> that accepts only the chain's native gas asset. It has no custody of
      or access to OMR principal, player liabilities, RWA acquisition ETH, Stock Tokens, or unrelated treasury funds. A
      contribution is final and creates no sponsor balance, refund, yield, priority, allocation weight, governance power,
      repayment claim, or other economic credit. The Safe cannot sweep it to treasury. After 48 public hours, an exact
      code-hash-bound migration may move only unreserved ETH to one successor; the old pool retains outstanding-credit
      backing and keeps withdrawals live.</p>
      <p>Only the submitter winning canonical settlement for an event ID and victim nonce receives a gas credit, including
      a legitimate zero-loot result. Invalid, expired, malformed, wrong-chain/vault, reverted, replayed, stale, and
      losing-race calls receive zero. Vault economic effects complete before the fixed pool credits <code>msg.sender</code>;
      settlement never pushes ETH or names an arbitrary reimbursement recipient. Executors later pull accumulated credit
      only to themselves under checks-effects-interactions and reentrancy protection. Credits are exact liabilities and
      cannot fund later reimbursement. Pool failure, pause, or depletion cannot revert canonical gameplay settlement.</p>
      <p>The caller cannot submit a gas bill. Reimbursement is the minimum of contract-measured audited settlement gas at
      <code>min(transaction gas price, base fee + public priority-fee cap)</code> plus any canonical reviewed chain-data
      fee, the public per-settlement wei cap, and unreserved pool ETH. Arbitrary caller work, excess calldata, unrelated
      external calls, deliberate gas burning, failed work, and fees above caps do not qualify. Empty or insufficient
      sponsorship produces partial or zero credit while settlement remains permissionless; without a willing self-funder,
      the game stays uncommitted and consumes no irreversible resource.</p>
      <p>The Safe may immediately pause new credits or reduce caps while existing credits remain withdrawable. Increases,
      a new native-fee source, and exact pool migration wait 48 public hours. The Safe cannot select submitters, manually
      reward a chosen call, redirect credits, or refill the pool from OMR/RWA custody. Hosted HTTP surfaces may enforce
      authentication, idempotency, rate limits, and abuse controls, but direct on-chain submission stays open. Exact typed
      authorization, five-minute expiry, signer generation, event/nonce uniqueness, vault-derived loss, cheap early
      rejection, bounded tranches, and no submitter-selected external calls leave invalid spam caller-funded and
      unreimbursed; spam cannot lock a victim, consume resources, auto-pause, or create a canonical incident.</p>
      <p>Each supported chain publishes one exact settlement-finality block count; no action receives a server-, signer-,
      submitter-, or operator-selected lower threshold. Every increase and decrease follows the same Safe-only 48-hour
      public proposal binding chain, current and proposed counts, reason/evidence, timing, expiry, and effective block. It
      applies only to transactions first included after that boundary; pending and finalized transactions retain their
      inclusion-time rule. Emergency response pauses new value-taking settlement and never hot-edits finality. A pre-finality reorg retries the same event ID and victim
      nonce: the original authorization may be resubmitted while valid, or the same event/nonce may be freshly authorized
      only after canonical absence is proven. Final events expose the ruleset, generations, nonce, submitter, times,
      per-bucket balances and ceilings, rounded debits, tranche consumption, killer credit, and post-settlement solvency
      totals.</p>
      <p><b>The cycle:</b> cash costs go to the street-tax pool, and every 12 hours the whole take funds the
      Exchange window's till — the cash players spend backs the cash $OMR redeems for. <b>Flat passive
      income:</b> Rackets and Assets (buy one time, earn continuously). <b>Trade goods</b> — buy at a low
      price, carry the goods, sell at a high price (the start of the market and convoys).</p>
      ${R(`GET /v1/window · POST /v1/window/redeem · /stake · /unstake · /rackets|assets/:id/buy · /goods/buy|sell`)}` },

  { id: 'kitchen', group: 'Money', title: 'The Kitchen', tag: 'the offline drug engine',
    html: `${L(`Buy <b>makings</b> → upgrade your <b>lab</b> → <b>cook</b> a batch → <b>collect</b> → <b>deal</b> (or let
      your <b>crew</b> sell while you are offline).`)}
      <p>Your <b>trade rank</b> controls it. There are 8 drugs (unlocked by rank). Cook produces <code>demand×12</code>,
      with a fire risk. <b>Deal</b> income = demand × quality × event × trade bonus, and <b>adds heat</b> (feeds the Law).
      A rank-0 dealer gets a +50% bonus on the corner. <b>Crew</b> (up to 5) sell while you are offline but cost
      <b>$1,200 each hour in wages ("the nut")</b> whether the stash moves or not — if you do not pay for 3 days, the
      crew becomes <b>cold</b> and stops. Offline sales cap at 8 hours' worth however long you are away, but the nut
      runs up to a week, so <b>keep them stocked and check in often</b>: three visits a day earns ~3.6× the wages even
      on the cheapest line, once a day barely clears it, three days away costs more than it makes. You can always
      <b>let one go</b> — square up and one walks, or a cold crew walks for nothing (their buy-in is gone either way).
      <b>Lay low</b> and <b>clean papers</b> reduce heat. Above heat 60, the Bureau can raid.</p>
      ${R(`POST /v1/kitchen/makings/:drugId · /lab/upgrade · /cook · /collect · /deal · /crew/hire · /crew/wages · DELETE /v1/kitchen/crew · /laylow · /cleanpapers`)}` },

  { id: 'business', group: 'Money', title: 'Businesses & Fronts', tag: 'premium upgradeable venues',
    html: `<p>Level-gated, upgradeable places (Laundromat L15 to Casino L58) that earn pocket cash — the
      endgame personal-income engine. <code>GET /v1/catalog</code> lists them. <i>(Fronts do not launder
      anything — cash can't become $OMR anywhere.)</i></p>
      ${L(`<b>buy</b> → <b>collect</b> (24-hour limit) → <b>upgrade</b> → <b>pay the upkeep</b>.`)}
      <p><b>A front wants an owner who shows up, and the terms say so.</b> The till holds only a <b>day</b> of
      takings, but <b>the pad</b> — protection and wages, 20% of hourly income, climbing 5% for every extra
      front you run — keeps running for a <b>week</b> whether you are there or not. So an absent owner can owe
      more than the place can hand back. That is the deal working as written, not a fault. Unpaid for 3 days it
      goes <b>cold</b>: no income, no upgrades, until you square it out of pocket.</p>
      <p><b>Closing up</b> (<code>DELETE /v1/business/:id</code>) is the way out. You can own one of each kind,
      so a cold front you cannot carry holds that slot for the rest of your street's life. Close it and the pad
      stops and the slot frees — permanently, tier and all.</p>
      <p>A front also heats up by <b>earning</b>: bank a day's income and the Bureau's file grows; past the
      threshold a raid seizes the pending take and fines you. Collect often and any raid catches less. A rival
      can <b>shakedown</b> 30% of the pending income in a stat contest, <b>rob</b> 15% of it in a stealth one,
      attempt a <b>hostile takeover</b>, crew an <b>inside job</b> — and a killer who puts your street down can
      <b>SACK</b> your best front and run it themselves. A passive empire is risk capital.</p>
      ${R(`GET /v1/catalog [public] · POST /v1/business/:kind/buy · /business/collect · /upkeep · /:id/upgrade|shakedown · DELETE /v1/business/:id`)}` },

  { id: 'territory', group: 'Money', title: 'Territory Rackets', tag: 'seizable family capital',
    html: `<p>There is one income operation in each district. The family that holds the turf owns it, so wars are about
      income, not only a treasury payment. Two axes: a 5-rung SCALE ladder (Corner $50k up to The Syndicate $15M) and a TYPE chosen at establish (numbers is safe; protection, smuggling and more run hotter and richer but draw Bureau raids).</p>
      <p>A boss or underboss <b>establishes</b> an operation on held turf. Income accrues (24-hour limit) and <b>collects
      to the treasury</b>. You can <b>upgrade</b> it and must pay <b>upkeep</b> (20%, cold after 3 days). <b>When another
      family seizes the turf, the whole operation moves to the victor</b> (plus a war premium of 50% of the build cost).</p>
      ${R(`GET /v1/territory · POST /v1/territory/:districtId/establish|upgrade · /territory/collect · /upkeep`)}` },

  { id: 'families', group: 'Crews & Family', title: 'Families', tag: 'groups, wars, turf, the treasury',
    html: `<p><b>Found</b> a family for $25k at L5 (maximum 20 members); you join a family immediately. Roles: boss /
      underboss / capo / crew. <b>Tribute</b> (cash adds to the weekly task; $OMR goes to the reserve). <b>Wars</b> —
      declare a war for $10k; it runs 30 minutes; the winner takes 20% of the treasury. A fire-kill on a war rival scores 3
      points (a jump scores 1). <b>Turf</b> — seize a district for its benefits and its territory racket.</p>
      <p><b>The watch.</b> A holder declares the hour their family stands ready (<code>/districts/:id/watch</code>, boss or underboss, free and changeable — the cost is having to BE there, though not once somebody is at the door: with a contest running you are held to the hour you committed to). Inside that four-hour window, taking the district is the plain price; outside it, catching them cold costs <b>1.5&times;</b>. A family that never declares a watch is dear at every hour, so declaring is what buys you the cheap window. Every declared hour is public on <code>/districts</code> — you are meant to plan around it, on both sides.</p>
      <p><b>The sealed bid.</b> A district <i>another family holds</i> cannot be bought at a published price — it goes to a contest (<code>/districts/:id/claim</code>). Every family puts up a SECRET stake from its treasury; when the window closes the highest takes the district, <b>the holder wins ties</b>, and the winning stake becomes the new garrison. The board tells you how many families are in and never what any of them put up. A loser gets half of their stake back and forfeits the rest, so committing everything against a family that was never coming is how you lose money without losing a fight. A stake only ever goes up, and it leaves the treasury the moment you make it — you cannot bluff with money you have already spent. The watch still applies: staking outside the holder's declared window costs more just to get in.</p>
      <p><b>The map.</b> The six core districts are not a flat set &mdash; they border each other, and <code>/districts</code> publishes which. Geography prices the door from both sides. A district a family holds is <b>dearer to come for once per bordering district that family also holds</b>, because they can reinforce across their own ground: contiguous turf genuinely defends itself. And a district <b>next to ground you already hold</b> is <b>cheaper for you</b> &mdash; your men are already on that side of the river. That is one foothold discount however many borders you share, not a bonus for encirclement. So "we cannot defend the canal, we do not hold the docks" is now a real sentence, and taking the district next to your own beats taking the rich one across town.</p>
      <p><b>The charter &mdash; what your family IS.</b> A family is not just the sum of what it holds — the boss picks a charter, and every one of them trades an edge for a real <b>handicap</b> &mdash; a charter with only an upside would be a free upgrade everybody takes, and then nothing is asymmetric again. <b>The Syndicate</b> runs its operations 15% leaner but pays 15% over the odds for turf. <b>The Outfit</b> takes ground 15% cheaper and pays 15% more to run what it holds. <b>The Fixers</b> have the Bureau building its file 25% slower, but forfeit 25% more of a losing contest stake. Running <b>no charter</b> is a real answer &mdash; you get neither side, which is exactly the family you have today. The first pick is free; re-founding costs the family reserve and locks for a week afterwards. The two mirrors are deliberate: a Syndicate family and an Outfit family are each good at what the other is bad at, so an alliance between them is complementary rather than just twice as big.</p>
      <p><b>The season has an ending.</b> A season runs 28 days in three phases you can read on <code>/seasons</code>: <b>The Opening</b> (days 1&ndash;7 &mdash; cheap ground, nothing settled), <b>The Long Game</b> (8&ndash;21 &mdash; build and hold), and <b>The Reckoning</b> (22&ndash;28). In the last week held turf is a quarter cheaper to challenge, contests settle in half the time and a holder's watch window is halved, so an incumbent who has been sitting on a district since week one has to defend it while the door is open. Nothing is reset or seized when the books close &mdash; instead the city REMEMBERS: the top City Standing takes the season and the family holding the most core turf goes on the permanent roll, and the champion's bloodline keeps the crown forever. That is the whole point of the arc &mdash; you are not just accumulating, you are racing a clock.</p>
      <p><b>The posts.</b> A family fills five chairs — the Enforcer, the Caporegime, the Streetboss, the Quartermaster and the Bagman (<code>/roster</code>, boss or underboss). <b>One post per made man, one man per post</b>, so your best man can do one job and not the others; each post reads one stat, and what it is worth scales with the man in it. What makes this worth fighting over: <b>a post is dead while its holder is dead, in lockup or in the hospital</b> — put a family's Enforcer in the hospital and their turf gets cheaper to take without your ever going near the district. They can fill the chair again straight away, but only with somebody who was on the STREET; you cannot slide a man across from another post for six hours — nor stand him down and walk him into the next chair, which is the same shuffle — so answering a hit costs the family a second made man. Every post is a bonus, never a requirement — the scarcity is which chairs you fill, not that the baseline moved.</p>
      <p>The reserve buys status: <b>seals</b> (Wax 150 to Obsidian 9000 $OMR) and the <b>Foundation</b> (360 to 18000 $OMR).
      The Foundation is real power: it reduces the RICO conviction chance of every member (only members present when a case
      was filed). The reserve also draws the <b>family yield</b>.</p>
      ${R(`POST /v1/gangs · /gangs/:id/join · /leave · /kick · /promote · /gangs/tribute[/omr] · /war/:id · /districts/:id/seize · /gangs/foundation · /gangs/vanity/*`)}` },

  { id: 'commission', group: 'Crews & Family', title: 'The Commission', tag: 'server politics',
    html: `<p>Weekly governance with no money. The <b>top 5 families by this season's standing</b> hold seats. Each seated
      boss or underboss casts one <b>public vote each week</b>. Last week's majority controls this week. The boss of the
      first seat can <b>veto</b> one time each week.</p>
      <p><b>Decrees</b> (8): Open Season (safehouse ×0.5), Pax (no new wars), Amnesty (lay-low ×0.5), Lockdown (convoy
      defense +20), The Levy (the family yield pays the chamber), Smuggler's Moon (port interdiction ×0.75), Open Roads
      (convoys ×0.8 time), Blood Oath (kill loot ×1.25).</p>
      ${R(`GET /v1/commission [public] · POST /v1/commission/vote · /veto`)}` },

  { id: 'contentgraph', group: 'The City & the World', title: 'The Content Graph — Mysteries, Crafting & Seasonal Hunts', tag: 'playable stories · bounded expansion',
    html: `<p><b>The merged <code>content/</code> foundation is an authoring and verification plane, not a hidden
      faucet or execution backdoor.</b> It models individual mysteries, Crew and Extended Family dependencies,
      asymmetric social roles, world-state gates, raw-material sources, recipes, crafting requirements, item
      sinks and durability, selected-item export policy, growth journeys, and achievement-triggered seasonal
      rewards as data. Packs cannot carry JavaScript, SQL, shell commands, credentials, or publishing authority.</p>
      <p><code>npm run content:check</code> validates schemas, dependencies, source/sink conservation, social
      satisfiability, finite reward budgets, and deterministic hashes. <code>npm run content:build</code> emits an
      immutable versioned bundle and refuses to overwrite it. Compilation never activates a pack.</p>
      <p><b>The Sixth Chair v2 is playable</b> through the authenticated content API after an operator activates its
      exact bundle hash. A Crew or Extended Family fills four asymmetric roles, receives only server-issued puzzles
      or choices, reveals shared evidence, and claims a value-neutral title and collectible exactly once. Every run
      is pinned to the version and hash it began with; compilation by itself never activates a pack.</p>
      <p>The first district sampler adds six independent personal, district-gated stories: Docks — <b>The Man Who
      Missed the Tide</b>; Canal — <b>Water in the Cellar</b>; Brick — <b>The Last Kiln</b>; Neon — <b>House
      Lights</b>; Foundry — <b>The Furnace Ledger</b>; and Cathedral — <b>A Saint's Account</b>. Each run reveals
      one sequential action at a time, rechecks location before every mutation, records the chosen answer, and pays
      one exactly-once gameplay-inert memento—never cash, $OMR, status, or combat power.</p>
      <p>Seven personal <b>Don Cases</b> form the late-game spine: level 35 — <b>The Iron Election</b>;
      50 — <b>A House Made of Glass</b>; 65 — <b>Port of No Return</b>; 80 — <b>The Empty Seat</b>;
      95 — <b>Two Funerals</b>; 110 — <b>The Federal Ledger</b>; and 125 — <b>Don of the City</b>.
      Each has five to eight sequential actions, reconnects at least three existing systems, and ends
      with an ungated method, a mastery-sensitive method, and an optional Crew method. Every method
      converges on the same value-neutral reward class: one distinct gameplay-inert memento.</p>
      <p>Six personal <b>Path Cases</b> form the identity drop: Gun — <b>The Last Clean Contract</b>;
      Ledger — <b>Hostile Books</b>; Kitchen — <b>The Bad Batch</b>; Wheel — <b>Black Ice</b>;
      Shadow — <b>Nobody Saw Him Leave</b>; and Ring — <b>Twelve Rounds</b>. Each has four
      investigations and a three-way resolution: an ungated baseline, a build-specialist method, and
      an Honor-or-Infamy relationship method with a named Underworld fixture. The server derives Path,
       owned skills, mastery, regimen, honor, and effective Underworld standing under the current street
       lock. Those gates change method and remembered outcome, never reward value; every case converges
       on one distinct gameplay-inert memento.</p>
      <p><b>The Two-Man Rule</b> is a two-seat Crew or Extended Family case. A Watcher and a Signatory
      investigate parallel, role-locked branches; the shared three-way resolution stays closed until both
      branches finish. Either role may be human or agent-controlled. Completion gives every participant
      exactly one self-claimed, gameplay-inert memento and moves no cash, $OMR, or transaction-ledger value.</p>
      <p><b>The Books Open at Midnight</b> (<code>omerta.case.season.books-open-at-midnight</code>) is the
      first production seasonal case: a personal Opening-phase story playable once per season. Two
      normalized-answer puzzles lead to a three-way resolution and one recurring, gameplay-inert seasonal
      page. It moves no cash, $OMR, power, or transaction-ledger value and appears only after an operator
      activates its exact compiled bundle hash.</p>
      <p><b>The Bellini Restoration</b> (<code>omerta.workshop.bellini-lockbox</code>) is the first
      production authored workshop. At the Old Foundry, two globally finite daily salvage sources issue
      exact-hash Ledger Plate and Charred Binding lots once per account per source and epoch. The v2
      apprenticeship consumes fixed inputs when a server-timed work order starts, produces only stackable,
      gameplay-inert workpieces when its server-issued <code>readyAt</code> clears, and trains one exact-hash
      Bellini Restoration skill through compiled XP thresholds. One active job is allowed per account and
      namespace. Skill level 2 unlocks the final FIFO recipe for a non-stackable, non-tradeable,
      gameplay-inert Restored Bellini Lockbox. Clients cannot nominate items, quantities, budgets, clocks,
      XP, caps, or outputs.</p>
      <p>The v3 <b>Press Room</b> adds the location-bound Old Foundry Restoration Bench and an
      account-owned Bellini Restoration Press. The non-tradeable press's only gameplay power is satisfying
      declared authored-crafting requirements. Exact-hash durability wears once when a requiring job or
      recipe starts. The board-issued repair consumes compiler-declared same-hash material at the facility
      and restores the compiled maximum; acquisition, use, and repair are append-only audited. An archived
      old-version press remains visible but cannot unlock or block the active version.</p>
      <p>The v4 <b>Material Exchange</b> admits only Ledger Plates and Charred Bindings to an authored-only,
      cashless barter board. A seller escrows one whole exact-hash lot and requests another allowlisted
      same-hash material; one buyer fills the complete offer, or the seller cancels and recovers it. The
      compiled bundle fixes a 24-hour lifetime and five-open-offer account cap. Escrow remains inside
      <code>maxOwned</code> accounting, fills conserve both item totals, and list/fill/cancel append audit
      events. Tools, workpieces, the Lockbox, drugs, ordinary inventory, and exportable items cannot enter
      this board. An old-version offer remains hash-pinned and recoverable after activation changes.</p>
      <p>Locked cases remain discoverable through safe <code>eligible</code>/<code>blockedBy</code> data;
      final options expose <code>available</code>/<code>blockedBy</code> and are rechecked under the street
      lock. The selected ending records one account-scoped, write-once narrative story flag, projected
      safely by <code>GET /v1/content</code>. Story flags cannot mint cash, $OMR, mastery, combat power,
      or transaction-ledger entries.</p>
      <p>Forming organization lobbies have a finite 24-hour expiry. Expiry abandons only the forming
      lobby, allowing that organization to recreate it; once started, the deadline is cleared and active
      runs never expire. Ordinary content uses run key <code>once</code>. A bundle declaring
      <code>once_per_season</code> receives a server-derived <code>season:&lt;number&gt;</code> run key, so
      the same organization scope can play once each season without a client choosing the key.
      <code>season_phase_is</code> is a root-only season phase entry gate: creation and start recheck it,
      but active story actions do not, so a phase change cannot strand an in-progress run. Seasonal
      collectible entitlements are scoped by namespace plus the server-derived season run key. The same
      logical inert memento may be self-claimed once each season, but additional scopes or content versions
      cannot mint it again during that season.</p>
      <p><code>GET /v1/content</code> returns active workshops under <code>crafting</code>, with current
      exact-hash inventory and escrow quantities, skill progress, facilities, tools and durability,
      archived lots/XP/tools, finite source state, active work order, job and recipe blockers, the optional
      barter board, and direct action descriptors.
      Source, job-start, recipe, and tool-repair
      actions send <code>expectedContentHash</code>; an activation change returns
      <code>409 stale_content</code> with a replacement workshop. Work-order start consumes exact-hash inputs
      immediately and snapshots its inputs, outputs, duration, XP, and skill. Early collection is refused.
      A later activation does not strand the job: collection resolves its pinned immutable bundle and keeps
      the output and XP archived under the old hash. Recipes consume only same-hash lots FIFO. Old-version
      lots cannot enter the new recipe pool, current skill cannot inherit old-hash XP, and non-stackable
      keepsake caps span versions. Authored-tool caps are exact-hash, so a new version may assemble its
      own isolated press. <code>POST /v1/content/:namespace/exchange/list</code> creates an allowlisted,
      same-hash offer; board-issued <code>fill</code> and <code>cancel</code> siblings settle or return the
      whole escrow lot. The adapter moves no cash, crates, ammo, $OMR, or transaction-ledger value. Only
      those exchange routes grant narrow authored-material barter authority; they grant no combat,
      cash-market, or rare-item export authority.</p>
      <p>Mickey the Cornerman's sixth Underworld campaign, <b>The Long Count</b>, uses the established campaign
      engine: train twice, choose whom to protect or expose, then take the sanctioned fight. Power outside
      authored crafting, drug-supply chains, selected rare-item NFT
      export, and bounded seasonal $OMR settlement remain staged. Content discovery does not grant
      <code>POST /v1/agent/act</code> authority; authored stories and workshops use their direct routes.</p>
      ${R(`GET /v1/content · POST /v1/content/:namespace/instances · POST /v1/content/:namespace/sources/:sourceId/collect · POST /v1/content/:namespace/jobs/:jobId/start · POST /v1/content/:namespace/jobs/:jobId/collect · POST /v1/content/:namespace/recipes/:recipeId/craft · POST /v1/content/:namespace/tools/:toolId/repair · POST /v1/content/:namespace/exchange/list · POST /v1/content/:namespace/exchange/:listingId/fill · POST /v1/content/:namespace/exchange/:listingId/cancel · content/README.md`)}` },

  { id: 'den', group: 'Money', title: 'The Den (Casino)', tag: 'gambling at the Neon Mile',
    html: `<p>Every game at the den today is <b>cash-denominated</b> — no current den game touches $OMR. Any future
      $OMR-denominated game would be a separately specified product with its own published terms. The server
      calculates and records every result. The house adds 1% to the
      street-tax pool from real profit only.</p>
      <ul><li><b>Craps</b> — the pass line in one action, 1:1, edge about 1.41%, 1 nerve, up to $250k ($2M in the high-stakes room —
      L30 or the Madame's rope, plus the 300 $OMR access stake).</li>
      <li><b>The Numbers</b> — pick a number 0–999, one ticket each day, pays 600:1.</li>
      <li><b>Back-room PvP dice</b> — agree by listing a fade limit; the winner takes the pot minus a 5% rake.</li>
      <li><b>The weekly Fight</b> — one $5k bet on a favorite; the Neon-holding boss can <b>fix</b> it for $50k.</li>
      <li><b>The Track</b> — the greyhounds and the horses. A daily card (6 runners with posted odds, about 15% house
      share); one $50–$10k win bet for each race each day; the winner comes from the daily seed; claim at the LOCKED odds.
      If you own an animal, <b>run it in the card</b> ($5k nomination, up to 2 owner entries a race) — the town bets on
      your animal.</li>
      <li><b>The Futurity</b> — the major race where the Stable meets the Track. Owners <b>nominate</b> their animals ($5k
      fee, up to 8 in the field). The whole town bets <b>parimutuel</b>. At window close, the worker races the field on
      form; the winners share the losing pool minus a 5% share, and the winning owner takes a promoter's purse. (This is
      different from The Stakes — that is owners competing for a pooled buy-in; the Futurity is the crowd betting on the
      field.)</li></ul>
      ${R(`GET /v1/casino [public] · POST /v1/casino/dice · /numbers[/claim] · /fade · /dice/:id · /fight[/claim|/fix] · /track[/claim] · /futurity/nominate/:id · /futurity/bet`)}` },

  { id: 'stable', group: 'Money', title: 'The Stable', tag: 'own the dogs and the ponies',
    html: `<p>Own racing animals. <b>Buy</b> a greyhound ($30k) or a racehorse ($120k) at L6 or higher, <b>train</b> its
      speed, stamina, and heart (cash and energy, with a limit), and <b>race</b> it. Run up to 3. CASH only. An animal dies
      when your character dies; your lifetime wins are an owner record that survives death.</p>
      <ul><li><b>The circuit</b> (PvE) — enter a meet; the fee is lost win or lose; the purse pays only for a win.</li>
      <li><b>Match race</b> (PvP) — race a rival owner's animal of the same kind for a cash wager; the winner takes the pot
      minus a 5% share.</li>
      <li><b>Breed</b> two animals of the same kind into a foal that inherits their form (a head start, not a way to pass
      the limit; both parents retire).</li>
      <li><b>The Stakes</b> — a scheduled major race; enter your animal (a cash buy-in goes into escrow); the worker races
      the field, and the top places share the purse minus a 5% rake. Mickey the Cornerman (the boxing fixer) also trains
      your animals.</li></ul>
      ${R(`GET /v1/stable [+ /v1/leaderboard/stable] · POST /v1/stable/buy · /train/:id · /list/:id · /circuit/:id · /match/:opponentId · /breed · /stakes/:id`)}` },

  { id: 'speakeasy', group: 'Money', title: 'The Speakeasy', tag: 'the social hub',
    html: `<p>One prestige nightclub in each district (a made man, L15, $750k) — a business, a casino, and a social place. It
      dies when the owner's character dies.</p>
      <p><b>Collect</b> the bar income, <b>upgrade</b> the decor, and <b>name</b> it. <b>Be seen:</b> buy a <b>round</b> (a
      taxed payment to the owner; it adds you to the guest list; 10 visits make a "regular") or buy <b>bottle service</b> (a
      $OMR status payment). The <b>back-room table</b> takes 3% and adds <b>notoriety</b> — above 60 a <b>Prohibition
      raid</b> can happen. Build <b>renown</b> (Nobody to King of the Night). <b>Buy out</b> a club by agreement, or
      <b>stand over</b> it — pay $250k (lost win or lose), win a contest, and force the sale.</p>
      ${R(`GET /v1/speakeasy [public] · POST /v1/speakeasy/:d/round|bottle|table|standover · /collect|upgrade|name|list|unlist · /:d/buy · /decor`)}` },

  { id: 'boxing', group: 'Money', title: 'The Fights (Boxing)', tag: 'manage a fighter',
    html: `<p>Sign up to 3 boxers — a stable (L8, $50k each), <b>train</b> the boxer ($20k + energy, +1 stat, limit 25), <b>list</b> a bout
      limit, and <b>fight</b> other managers. The winner takes 2× the stake minus a 5% rake (a taxed transfer, no new money
      is created); the loser's fighter is in the hospital for 4 hours. The fighter dies when your character dies. Ranks:
      Prospect to Hall of Famer.</p>
      ${R(`GET /v1/boxing · POST /v1/boxing/recruit|train|list · /fight/:opponentId · GET /v1/leaderboard/boxing`)}` },

  { id: 'pvp', group: 'The Underworld', title: 'PvP — Jumps, Hits & Contracts', tag: 'attacking players',
    html: `<p><b>Jump</b> — not lethal; costs energy and ammo; steals up to $25k pocket cash; hospitalizes for about 3
      minutes; scores 1 war point.</p>
      ${L(`<b>The hit:</b> place a <b>search</b> (about 3 hours to be ready) → <b>fire</b> (50 fp or more, 2-hour cooldown,
      +20 heat).`)}
      <p>A fire-<b>kill</b> runs the estate, <b>takes 40% of the cars</b>, <b>loots cash and $OMR</b>, has a 15% chance to
      take one gear piece, swears a <b>vendetta</b>, pays open kill contracts, scores war points, and earns <b>hitman
      reputation</b>. <b>NPC hit</b> — pay a fee (lost win or lose) for a hit the server calculates; no reputation; you
      cannot use it against family, yourself, new players, or safehoused players.</p>
      <p><b>The Contract Board</b> — escrow pots for each (target, kind). Post one (minimum $500; add 18 $OMR to be
      anonymous). A <b>directed</b> named hitman gets an exclusive window (minimum $10k, waived for a KILL contract on a
      vendetta target, a rat, or a welsher). The target can <b>peek</b> (30 $OMR) to name every funder. <b>Hitman reputation</b> is a
