      <code>activationMult × activityScore</code>; no current stake balance counts silently or retroactively.</p>
      <p>Agent accounts have full economic parity in this design. Their verified EOA or ERC-1271 controller wallets may
      deposit, stake, commit, partially unbond, withdraw, survive inheritance, receive idle loot, lose eligible principal
      through canonical gameplay settlement, build finalized Broker stake TWA, and receive Stock Token allocations and
      delivery under the same activity, activation, wallet-uniqueness, consent, exposure, finality, solvency, and launch
      gates as human wallets. The agent flag still excludes human-only faucets and status rewards; it never denies vault
      authorization, settlement, checkpoints, Broker weight, RWA allocation, or delivery.</p>
      <p>Portfolio views lead with actual Stock Token units, acquisition reference and cost, allocation epoch, delivery
      state, and custody destination. Estimated market value is secondary, timestamped, source-labeled, and stale-aware,
      never presented as guaranteed cash, yield, or redeemability. New RWA complexity requires demonstrated recurring
      material value, measured user demand, or an actual failure mode plus written Safe scope, authority, invariants,
      tests, and operating owner.</p>
      <p>Any positive reconciliation shortfall or operator debit of reconciliation backing emits an immediate
      critical alert and keeps the RWA operator UI in a persistent red incident state. It shows aggregate and
      per-record liabilities, backing, shortfall, age, affected intent and attempt IDs, last quarantine outflow, vault
      deficit, and purchase-pause state. Every zero-to-positive transition creates a new immutable
      <code>incidentId</code>; alerts, acknowledgments, outflows, repairs, and reconciliation actions append to that
      generation. It closes only after finalized canonical zero is synchronized into the mirror, and a later
      recurrence creates a new ID. The Safe or current <code>mainOperator</code> may submit a signed public
      acknowledgment bound to the exact <code>incidentId</code> and, for operator authority, current operator
      generation. Acknowledgment may silence duplicate notifications only; it cannot clear, downgrade, conceal,
      resolve, unpause, or mutate the incident's financial state.</p>
      <p>A reconciliation shortfall or acquisition accounting deficit pauses new purchase-intent creation and
      execution but does not pause delivery of Stock Tokens already acquired and allocated when exact
      <code>StockVault</code> custody and every delivery invariant remain healthy. Asset quarantine, custody mismatch,
      delivery hold, insufficient delivery gas, fee ceiling, stale token health, and every other independent delivery
      wall still apply. Continuing delivery creates no new allocation or purchase.</p>
      <p>If the canonical RWA accounting mirror is more than ten minutes stale or cannot prove finalized
      <code>accountingSequence</code> continuity, the operator UI remains red and shows
      <code>incident_state_unknown_stale</code>; it never renders green. It disables new risk-creating purchase controls
      while keeping recovery funding, reconciliation, cancellation, expiry, and otherwise-authorized operator outflow
      controls available. Stale display state neither invents an on-chain incident nor resolves a real one.</p>
      <p>A reconciliation incident closes only when finalized canonical state simultaneously proves aggregate
      <code>reconciliationShortfall == 0</code>, vault-wide <code>accountingDeficit == 0</code>, every affected record's
      liability/backing invariant, continuous <code>accountingSequence</code>, and synchronized public-mirror state.
      Acknowledgments do not affect closure.</p>
      <p>Purchase blocking uses independent composable reasons, including manual Safe/operator pause, reconciliation
      deficit, stale accounting mirror, token quarantine, oracle failure, and exposure cap. Clearing one reason removes
      only that blocker. Purchases resume only when no applicable blocker remains, so automatic deficit clearance never
      clears a manual or unrelated pause.</p>
      <p>If a contract-maintained debit or repair priority index disagrees with immutable records, new purchases pause
      and anyone may rebuild the index deterministically in bounded chunks. The completed root must equal the root
      derived from immutable records; the Safe and operator cannot choose order, and dependent mutations remain
      unavailable until the rebuild proves complete.</p>
      <p>Every operator outflow or generic repair supplies a public positive <code>maxComponents</code>. The complete
      requested transfer or repair must be accountably processable within that bound or the transaction reverts before
      any mutation or ETH transfer. A large action may be split across sequential transactions, each preserving the
      same deterministic order.</p>
      <p>Public incident history uses an immutable cursor ordered by <code>accountingSequence</code>,
      <code>componentIndex</code>, and stable event ID. Offset pagination and mutable latest-first authority are
      forbidden. The UI defaults to the active or most recent incident while allowing complete export of every
      generation, including cursor continuity and canonical reorg/finality status.</p>
      <p>The Safe or current <code>mainOperator</code> may immediately call
      <code>cancelIntent(intentId, reasonCode, detailsHash)</code> for an active intent without transferring ETH.
      Cancellation uses the existing closed reason taxonomy and a nonzero details hash, marks terminal
      <code>intent_cancelled</code>, releases the complete remaining reservation to available acquisition ETH except
      any unresolved <code>reconciliation_pending</code> portion, and consumes the next
      <code>accountingSequence</code>. Its immutable record publishes actor and authority,
      reason/details, released amount, intent/attempt state, and complete pre/post accounting. It cannot revive,
      substitute, extend, replay, split, re-reserve, allocate, or create catch-up, and does not rewrite the ballot,
      asset, prior attempts, or deposit history. Canonical inclusion order decides cancellation versus execution,
      expiry, refund, or operator outflow; the first valid transition wins and later incompatible calls fail without
      mutation. Either authority can abort a planned RWA purchase even when no ETH leaves the vault.</p>
      <p>The current <code>mainOperator</code> may cancel directly or authorize a relayer through EIP-712/ERC-1271.
      The typed authorization binds action, chain, vault, operator generation, exact intent ID, reason code, nonzero
      details hash, exact <code>nextIntentCancelNonce</code>, <code>issuedAt</code>, and deadline. Its lifetime is at most
      one hour, future issue time is invalid, and direct and relayed operator cancellations consume the same monotonic
      cancellation nonce independently of <code>nextOutflowNonce</code>. Safe cancellation consumes neither operator
      nonce. Replacement, renunciation, or zero-disable invalidates every older-generation cancellation signature.</p>
      <p>The Safe or current <code>mainOperator</code> may immediately pause new intent creation and execution with a
      closed public reason code and nonzero details hash; only the Safe may unpause. Canonical deposits, deficit repair,
      matched refunds, reconciliation, permissionless expiry, explicit cancellation, and otherwise-authorized operator
      outflows remain available. Existing deadlines continue without extension, tolling, revival, substitute, or
      catch-up, and reservations stay governed by normal expiry and cancellation rules. Every pause or unpause publicly records
      actor, authority, operator generation, reason/details, and inclusion time.</p>
      <p>A refund matches only through exact intent, approved attempt, adapter or sender, and canonical transaction
      provenance. Cumulative matched refund cannot exceed actual debited ETH. While an intent is active, verified
      refund restores its remaining reserved capacity only up to the original bound, allowing an otherwise-valid
      retry before the unchanged deadline. After cancellation, <code>intent_expired</code>, successful finalization,
      or any other terminal state, verified refund first repairs the exact attempt's reconciliation shortfall, if any;
      only the remainder becomes available acquisition ETH. It never reopens the intent, ballot, allocation, purchase
      window, substitute, or catch-up. Unknown-intent, unprovable-sender/provenance,
      and above-debit excess refunds are <code>unattributed</code>, not available. Every receipt publishes sender,
      amount, known intent/attempt, provenance, cumulative debit/refund, classification, and pre/post buckets.
      Safe reclassification and main-operator withdrawal follow the unattributed rules.</p>
      <p>Only a currently Safe-approved acquisition ingress contract may credit canonical acquisition ETH. Each
      positive deposit has
      <code>depositId = keccak256(abi.encode(chainId, sourceContract, externalPaymentReferenceHash))</code>;
      caller/source, nonzero external reference, and <code>msg.value</code> must match. A duplicate ID reverts rather
      than replaying or double-crediting. Success credits available ETH and publishes ID, chain, source, reference,
      amount, approval version, and pre/post buckets. Safe ingress approval/revocation is public and forward-only.
      Direct receipt, unapproved source, malformed/missing reference, source mismatch, and forced ETH stay
      <code>unattributed</code> and cannot gain canonical identity through later synchronization.</p>
      <p>Each Safe ingress approval binds exact chain, source address, source runtime code hash, and approval version.
      For a proxy it also binds the resolved implementation address and implementation runtime code hash. The canonical
      deposit path revalidates every field before consuming a deposit ID or crediting a bucket. Any source-code, proxy,
      or implementation change requires a fresh public Safe approval version; mismatch reverts the canonical call.
      Plain or forced ETH that still reaches the vault remains <code>unattributed</code>. Approval and revocation are
      forward-only: earlier accepted deposits remain canonical history and their deposit IDs stay consumed forever.</p>
      <p>Each acquisition vault has at most one active canonical ingress approval version: one exact version or the
      disabled/zero state. Safe rotation atomically deactivates the old version and activates the new one; there is no
      overlap, grace period, or dual-source window. A canonical deposit must name and match the version active when its
      transaction is included. Broadcast or mempool time grants no grandfathering: an old-version call included after
      rotation reverts before accepting ETH, consuming its deposit ID, or changing accounting. Plain or forced ETH
      that still arrives is <code>unattributed</code>. Canonical chain order resolves same-block rotation/deposit races,
      while prior accepted deposits, consumed IDs, and approval history remain unchanged.</p>
      <p>During a positive accounting deficit, a canonical deposit consumes its deposit ID once and records
      <code>deficitRepairAmount = min(msg.value, deficitBefore)</code> and
      <code>availableCreditAmount = msg.value - deficitRepairAmount</code>. Repair raises actual balance and reduces
      deficit without crediting a bucket; only the available-credit remainder increases available acquisition ETH. The
      repair portion uses the unified queue ordered by <code>firstObservedAt</code> or
      <code>shortfallCreatedAt</code>, numeric component type, then record ID, fully repairing components before at most
      one partial repair; the sender cannot choose a record or bucket. An exact late refund stays bound to its own
      attempt. If the assigned component is a finalized proven-unspent shortfall, the same entry retires the repaired
      principal and credits exactly that amount to available under its immutable disposition. The
      immutable deposit record publishes total, both portions, deficit before/after, approval version, and pre/post
      buckets. A repair-only deposit remains canonical provenance but creates zero spendable ETH, and no retry or
      display may treat its full <code>msg.value</code> as available.</p>
      <p>Safe may immediately call <code>reclassifyUnattributed(amount, reasonCode, detailsHash)</code> for a
      positive amount no greater than unattributed. The only move is <code>unattributed -> available</code>. It
      transfers no ETH, creates no reservation, targets no ballot/asset/intent, revives nothing, bypasses no cap,
      oracle, adapter, or deadline, and never books a purchase. The classification entry is immutable,
      non-deletable, and non-reversible; ETH later leaves only through a valid purchase or
      <code>operator_outflow</code>.</p>
      <p>If accounted buckets exceed actual vault balance, public state reports
      <code>accounting_deficit = accountedBuckets - vault.balance</code> with first-observed block/time, cause,
      last reconciliation, and pre/post figures. While positive it blocks automated buying, new reservations,
      Safe reclassification, and canonical migration. Existing expiry/cancellation/refund reconciliation and
      inflows remain. Every incoming wei first repairs deficit by raising actual balance without bucket credit;
      only post-repair canonical value becomes available and other remainder unattributed. The
      <code>mainOperator</code> may still withdraw up to actual remaining ETH through the fixed available,
      unattributed, ordinary reserved, then reconciliation-pending debit/cancellation order. Outflow publishes deficit before/after; balance and
      buckets fall together, leaving deficit explicit. Automation/migration resumes only after public zero-deficit
      reconciliation. No role may silently haircut or erase a bucket or deficit.</p>
      <p>Deficit mode clears only after canonical-chain reconciliation computes
      <code>accounting_deficit == 0</code>, its block reaches configured finality, and the finalized result synchronizes
      into the public mirror. Automation and canonical migration then resume immediately under every normal cap,
      oracle, adapter, health, deadline, and authority wall, with no Safe acknowledgment, operator acknowledgment, or
      additional cooldown. Clearance does not revive an expired or cancelled intent, extend a purchase window, replay
      a missed ballot, or create catch-up authority. Public reconciliation names block, transaction, finality,
      synchronization time, and pre/post
      deficit/buckets/balance. A later deficit immediately pauses again; no role may manually declare zero or bypass
      finality.</p>
      <p>Every successful atomic vault-accounting entrypoint receives exactly the next monotonic
      <code>accountingSequence</code>. This includes canonical deposits and deficit repair, unattributed synchronization,
      Safe reclassification, reservation or intent creation, purchase debit/finalization, refunds,
      expiry/cancellation, operator outflow, deficit reconciliation, and canonical migration. Component effects in
      one transaction share the sequence and use deterministic <code>componentIndex</code> order. Each record publishes
      action, actor, transaction/block position, complete pre/post vault balance, available, unattributed, reserved,
      accounted-bucket total, and deficit, plus affected intent/bucket deltas. Reverts and true no-ops consume no
      sequence. Canonical on-chain inclusion order is authoritative; worker timestamps, API arrival, and database time
      cannot reorder or invent mutations. Public mirrors roll back reorged entries and expose finalized canonical
      order. A duplicate sequence, unexplained gap, or pre/post discontinuity is a public synchronization failure,
      never silently healed.</p>
      <p>Each outflow requires a direct on-chain call from the current operator or a relayed EIP-712 signature
      from that same current address. The authorization binds action, chain ID, verifying vault, operator
      generation, recipient, amount, reason code, nonzero details hash, exact current global nonce,
      <code>issuedAt</code>, and deadline. Nonces are one-use and never reset
      on rotation. Expired, replayed, wrong-chain, wrong-vault, and former-operator signatures fail before any
      mutation. A backend API key, bearer token, server session, or relayer identity is never authority alone.</p>
      <p>Every outflow carries exactly one public reason code from <code>operations</code>, <code>security</code>,
      <code>purchase_recovery</code>, <code>migration_bypass</code>, <code>retirement</code>, <code>other</code>, or
      <code>reconciliation_outflow</code>, plus a nonzero <code>detailsHash</code> of the canonical explanation bytes.
      Any outflow that debits reconciliation backing must use <code>reconciliation_outflow</code>; a generic reason is
      rejected, and the dedicated code is rejected when no reconciliation backing is touched. The caller cannot
      choose the accounting bucket or reconciliation record. Code and hash remain immutable
      if off-chain text disappears; availability never gates execution. Direct and relayed outflows both require
      the exact <code>nextOutflowNonce</code> and increment that one global counter on success. The current operator
      may call <code>invalidateOutflowNonces(newNextNonce)</code> to advance past signed authorizations without
      moving ETH; it requires a strict increase, emits old/new nonce, and changes no bucket, reservation,
      allocation, or purchase cap.</p>
      <p>A relayed authorization is valid only when <code>issuedAt &lt;= block.timestamp &lt;= deadline</code>, the
      deadline is later than issue time, and the whole interval is at most one hour. Future-issued, expired,
      zero/reversed, or longer-lived signatures fail before signer, nonce, bucket, or reservation mutation.
      Direct calls are live authorization without a signature-lifetime window, but consume the same nonce and
      reason fields.</p>
      <p>Every operator outflow requires a nonzero recipient. OMERTÀ exposes no <code>operator_burn</code>,
      zero-address transfer, or other intentional ETH-burning action because no product scenario justifies ETH
      destruction. The vault cannot prove an arbitrary nonzero destination is recoverable; that remains part of
      the disclosed operator trust.</p>
      <p>The current <code>mainOperator</code> may directly renounce. Renunciation cannot be relayed and requires
      <code>msg.sender == mainOperator</code>. It sets the role to zero, cancels pending nomination, increments
      generation, and invalidates every signed authorization like Safe zero-disable. It moves no ETH and changes
      no nonce, bucket, reservation, allocation, or cap. The event publishes former operator/new generation;
      renunciation itself names no successor, so orderly handoff uses instant <code>replaceMainOperator</code>.</p>
      <p><code>mainOperator</code> may be an EOA or ERC-1271 smart-contract wallet. Direct execution always requires
      <code>msg.sender == mainOperator</code>. Relay uses exact ECDSA recovery for an operator without code and the
      exact ERC-1271 <code>isValidSignature</code> magic value for the same EIP-712 digest for one with code. Revert,
      out-of-gas, malformed data, non-magic response, or signer-type mismatch fails closed before nonce or
      accounting mutation. Failed ERC-1271 never falls back to ECDSA, nor failed ECDSA to arbitrary validation.</p>
      <p><code>operator_outflow</code> sends ETH to the arbitrary recipient with empty calldata only. The vault
      exposes no arbitrary-call payload, <code>delegatecall</code>, token approval, token transfer, or Stock
      Token/NFT movement. A contract recipient's payable <code>receive</code> or fallback may execute, protected
      by checks-effects-interactions and a reentrancy guard. Transfer failure rolls the whole outflow back. Any
      richer interaction happens after ETH leaves, from the operator or recipient without vault authority.</p>
      <p>Operator outflow consumes available ETH first, unattributed ETH second, ordinary reserved ETH third, and
      <code>reconciliation_pending</code> ETH last; the caller cannot select a bucket. If ordinary reservations are
      necessary, it cancels the minimum number of whole reservations, ordered by amount
      descending, then later execution deadline first, then intent ID ascending. No intent remains partially funded;
      excess released from cancelled reservations becomes available. If reconciliation backing is still required, it
      debits greatest backed amount first, then oldest <code>reconciliationStartedAt</code>, then lowest intent ID, fully
      exhausting records before at most one partial debit. The transaction immediately publishes each
      cancellation and an <code>operator_outflow</code> with operator, authorization path, recipient, amount,
      reason code, details hash, nonce, affected intents, and pre/post balances and buckets. A failed ETH transfer rolls back
      every accounting and cancellation change. Public boards show operator rotation, outflows, and cancellations.</p>
      <p>Normal buys obey ballot input, per-purchase cap, citywide daily cap, exact-version rolling-30-day cap,
      and available unreserved balance. Actual input plus input fees consumes capacity; gas and failed attempts
      do not. Success atomically consumes capacity. Safe may lower immediately without selling or rewriting;
      increases need public finalized/synchronized Safe execution. <code>exposure_cap_reached</code> buys no
      substitute and leaves remaining ETH pooled. Splitting cannot evade one-success. Public state shows caps,
      use, capacity, window, and wall. Main-operator ETH outflows bypass purchase caps as withdrawals and can
      never be reported as buys.</p>
      <p>Canonical state-preserving vault migration remains a public Safe proposal delayed at least 48 hours,
      binding old/successor vault, chain, successor code hash, full amount, old/new state hashes, evidence,
      earliest execution, and expiry. It requires no pending intent or deterministic recreation, identical
      buyer walls, full reconciliation, atomic state/balance movement, preserved surplus class, closed predecessor
      reservations, finality, sync, and public proof. Emergency response is immediate pause. Separately,
      <code>mainOperator</code> may bypass the process and move any/all ETH immediately and arbitrarily; that is
      only <code>operator_outflow</code>, moves no state/certification, and cancels impacted intents. On permanent
      retirement the operator may dispose of pool ETH arbitrarily. Public history never mislabels outflow as
      locked capital, purchase, refund, or canonical migration.</p>
      <p>For each seven-day activity epoch, a human or agent account must record successful server-authoritative work
      in at least <b>3 distinct tracks</b> and reach score <b>25</b>. Failed attempts, page views, time online,
      client telemetry, and NPC residents do not count. Above the gate, the full uncapped
      score is multiplied by the activated Broker tier, and the purchased units are allocated pro rata.
      Agent accounts use the same authenticated Broker-activation and Street-Deed claim routes and may
      control, collect, trade, extract, re-import, and receive Stock Tokens through the deed's ERC-6551 account;
      <code>agent_flag</code> never blocks those ownership or value-delivery steps.
      A future verified OMR-staking multiplier will read the same actual on-chain gameplay stake as the Made Ladder and
      preserve that activity gate and the recurring activation requirement.
      Its chosen composition is <code>activation multiplier × activity score × stake multiplier</code>, with fixed public
      stake tiers based on the finalized full-epoch time-weighted average. It is not live until the eligible source and
      tier ceiling/thresholds are resolved and anti-flash snapshot history is implemented.
      Delivery waits for an extracted Street Deed and then goes automatically to that deed's ERC-6551
      account. <b>A pending allocation never expires</b> and is never reclaimed for inactivity or moved to a
      later epoch.</p>
      <p><b>Corporate actions fail closed.</b> Robinhood Assets (Jersey) Limited (RHJ) is the Stock Token issuer;
      the public company is the underlier. Ordinary splits and dividends use RHJ's multiplier, so raw units
      do not change. If RHJ later retires or converts a token, OMERTÀ pauses new buys and pending deliveries,
      snapshots the owed book, and waits for completed issuer data plus verified on-chain receipt. The
      successor assets or proceeds backing pending allocations remain pro rata owed to the <b>same accounts</b>—
      never the general treasury or a later epoch. If settlement is unclear, the allocation keeps waiting.
      Already delivered tokens remain under the deed owner's control.</p>
      <p>OMERTÀ applies no in-game KYC or recipient-compliance gate to this calculation or delivery. This is
      the product posture, not a claim of legal clearance; issuer redemption requirements and the launch
      review remain separate.</p>
      ${R(`GET /v1/commission/ticker [public] · POST /v1/commission/ticker · GET /v1/brokers · POST /v1/brokers/activate`)}` },

  { id: 'window', group: 'Endgame & Going Legit', title: 'The Window & the Family Yield', tag: 'the one conversion',
    html: `<p><b>Cash cannot buy $OMR — at any price, by any route.</b> There is no wash house, no laundering at
      your own front, no swap. The two economies are severed on purpose, and the one crossing between them runs
      one way:</p>
      <p><b>The Window</b> — burn $OMR, take in-game cash at a published rate, out of a till the street take fills. It runs
      <b>one way only</b>: cash never becomes $OMR again. The till can run dry, and a short window refuses and
      <b>burns nothing</b> — it is a claim on what was funded, never a promise; there is a daily limit per account. It is
      <b>open</b> precisely because cash cannot buy $OMR: a fixed-rate window alongside a purchase rail would be a money
      pump, so the game runs one or the other, never both.</p>
      <p><b>The Family Yield</b> — the top families by this season's standing split a pot of $OMR into their reserve. The
      pot is fed by <b>the family's cut of every redemption at the Window</b> — a small share of what a player spends goes
      to the families rather than to the house. It is what staking rewards and personal dividends become: standing stops
      being only a badge and starts paying, so tribute, wars and the Commission are worth real money to a family.</p>
      <p><b>The Vault</b> — four streams of real ETH (the DEX sell tax, treasury bonds, the store, game fees) fund the
      protocol: liquidity, the withdrawal reserve, the founder, and a treasury. Burn earned $OMR and you claim a share of
      what that treasury actually holds. It is <b>backed by ETH</b>, on both sides of the book — what the treasury holds and what it can owe you are
      the same asset, so the rule is unbreakable rather than merely watched: <b>the house never owes more than it
      holds</b>, and no price move can change that. The board publishes what came in and from where. Allocation only — nothing is delivered, no sell, no
      cash-out.</p>
      <h3>Why it is built this way</h3>
      <p>Almost every game with a token has the same pipe: farm the game's currency, convert it to the token, sell.
      It is one pipe and everything bad runs through it — farming is unbounded so the token is unbounded, the people
      converting are the people leaving, and the grind gets optimised until it stops resembling a game. The genre's
      most-studied collapse is that pipe running to completion.</p>
      <p><b>OMERTÀ does not have the pipe.</b> Cash cannot become $OMR at any price, by any route. Not a rate tuned
      down or a cap lowered — the conversion does not exist. Four things follow, each a mechanism rather than a
      policy:</p>
      <ul>
        <li><b>Grinding cannot inflate the token.</b> Grinding makes cash, and cash has nowhere to go but back into the
        city. A player who never logs off is a rich player, not a source of new supply.</li>
        <li><b>Supply is enumerated, and a nightly job proves it.</b> The ledger checks
        <code>buckets == genesis + mints − burns</code>, and a reason nobody enumerated is itself an alarm. The
        city has no scheduled printer, and a nightly check asserts none appears. What can mint is a short list: the
        mission ladder (a few hundred $OMR over a whole career, once per account) is the one tap that pays you for
        playing, and the rest — the prize pool and the two buybacks — issue a token only when a real one has arrived to
        back it, one for one. And a sink does not destroy anything: it is the house's cut, and it goes to the desk to be
        sold again rather than to the fire.</li>
        <li><b>What you can take out is bounded by code, not by arithmetic.</b> The withdrawal rail signs nothing the
        reserve cannot back, and the reserve is filled by real revenue — so "you can only take out what somebody put
        in" is a rule the rail enforces on every withdrawal, whatever the supply does. That is the guarantee worth
        having, and the one that holds even with the mission tap open.</li>
        <li><b>The one conversion runs the other way, on money that already exists.</b> The Window burns $OMR and pays
        cash from a till real sinks filled. A short till refuses and burns nothing.</li>
      </ul>
      <p><b>Why this game.</b> OMERTÀ is about things being lost — death is permanent, your pocket is lootable, your
      empire is seizable. A token you can farm and dump is structurally a way to opt out of that: convert your position
      into something the game cannot take, and leave. With the pipe cut, effort becomes $OMR only by being paid for
      playing well, and $OMR becomes power only by being burned. The currency cannot be an exit from the risk the game
      is about.</p>
      <p><b>And there is no hiding place, by design.</b> The obvious way to soften a risk economy is a vault nobody can
      reach into, and this game deliberately does not have one. What it has instead is a CHOICE with a real trade-off:
      money doing nothing is the most exposed thing you own (a killer takes half), money committed to a stake is cheaper
      to be caught with (a fifth) — and neither is free. Both answers help the city: committing keeps the currency
      moving, staying liquid keeps hunters in business. On top of that, unstaking exposes the principal for six hours,
      staking pays no personal yield (that goes to families), and every route out passes an early-exit toll starting at
      50% and decaying over 48 hours.</p>
      ${R(`GET /v1/window · POST /v1/window/redeem · GET /v1/yield [public] · GET /v1/vault · POST /v1/vault/claim`)}` },

  { id: 'estate', group: 'Endgame & Going Legit', title: 'The Estate & Auction House', tag: 'status sinks',
    html: `<p><b>The Estate</b> — a deep, account-level (death-proof) $OMR cost and a home: buy levels (Safe House 240 to The
      Compound 15,000 $OMR), unlock features, name it, and show <b>trophies</b> from your real holdings.</p>
      <p><b>The Auction House</b> — a competitive weekly $OMR cost: 3 unique items each week; the highest <b>$OMR bid
      wins</b>, and <b>the winning bid is sunk</b> — it leaves you for good and goes to the house, which sells it back at the daily auction. Outbid bidders get a refund immediately; won items survive death.</p>
      ${R(`GET /v1/estate · POST /v1/estate/upgrade|feature/:id|name · GET /v1/auction [public] · POST /v1/auction/:lotId/bid`)}` },

  { id: 'chain', group: 'The Chain', title: 'The Chain — Withdrawal & Bonds', tag: 'settling on the blockchain (not active)',
    html: `<p>OMERTÀ settles on Robinhood Chain (an EVM L2). The blockchain layer is built but <b>not active until
      mainnet</b> (behind the launch checklist and audit). The off-chain game is authoritative; the blockchain settles
      withdrawals and ownership. The ONE place new $OMR is created on-chain is bonds — minted at bond
      time inside hard walls (a daily cap, a discount ceiling, a rate ceiling).</p>
      <p><b>Withdraw $OMR</b> — burns your $OMR and signs a voucher <b>only if the reserve can back it</b> (if not, it
      waits in a queue). <b>Only a minted account can extract.</b> <b>Gear withdrawal</b> mints your gear as an NFT (it
      leaves the game). <b>Wallet link</b> is SIWE. <b>The Forge</b>: a linked wallet's on-chain history — its age and
      mileage, never a balance — can cast your build as one of <b>twelve named archetypes</b> (four history
      families; the exact face is a stable function of the wallet itself, so the same wallet forges the same
      face forever), plus a small capped bonus on its
      strong suit, and a genuinely deep history forges a slightly bigger budget (a few extra points spread
      across the whole build, hard-capped) and schools the archetype's own regimen discipline with a banded
      head start; once per wallet, ever; free early, a re-roll credit
      past level 5 (and a later paid re-roll replaces the whole build, bonus and budget perk included); <b>character mint</b> makes a trial character permanent — a one-off
      ETH fee on a published schedule (five waves, 0.01 at the founding wave, never above 0.05; the Store shows
      the current one), or a mint credit earned outright off the mission ladder.
      <b>Bonds</b> — deposit ETH for discounted $OMR that vests over time; the ETH deepens the pool and feeds the
      <b>Vig</b> (the real-revenue engine that backs withdrawals). Bonds are the one mint — new $OMR is issued at
      bond time inside hard on-chain walls (daily cap, discount ceiling, rate ceiling). Every withdrawal pays a
      small exit toll, steeper on tokens younger than 48 hours.</p>
      ${R(`POST /v1/withdraw · /gear/:id/withdraw · /wallet/challenge|verify · /character/mint · GET /v1/bonds [public] · /bonds/:id/claim`)}` },

  { id: 'growth', group: 'Reference', title: 'Growth — Paths, Missions, the First Week', tag: 'progression support',
    html: `<p><b>Paths</b> (L5, $10k; switch for 150 $OMR + a 7-day cooldown) — SIX careers (The Gun, The Ledger,
      The Kitchen, The Wheel, The Shadow, The Ring), each with a signature edge, a real handicap, and trades that
      come easy (×1.5 mastery XP) or fight you (×0.6). <b>Missions</b> — 36 pay-once jobs
      (cash + respect + sometimes $OMR + titles). <b>Daily contracts</b> — 3 each day plus an all-three $OMR bonus. <b>The
      Daily Score</b> is the best repeatable at a low level (8-hour cooldown).</p>
      <p><b>Referrals</b> (your code is your character NAME) — a recruit qualifies after 4 conditions; milestones pay cash
      and titles. <b>THE CREW BONUS</b> is the real reward: every qualified recruit makes you earn <b>respect faster</b>,
      scaled by how far THEY have got (level 5 → +5%, level 10 → +10%, level 15 → +15%, in steps), applied to every
      respect you earn anywhere. It is live — it rises as they rise and stops when they stop — capped, and not a
      currency, so it cannot be sold or given away. <b>Referrals pay in cash and in respect, never in $OMR.</b> A recruit names who sent them in the <b>"who sent you?"</b> field at character creation
      (a shared link pre-fills it) or from the <b>"Did someone send you?"</b> card on Start Here in their first
      3 days — wrong capitalization is forgiven, and it's set once. <b>The spark</b> pays a small early bonus at L3 and 10 jobs; <b>tier-2 "the family tree"</b> pays a
      one-time $5k finder's fee when your recruit brings in their own qualified recruit (cash only, depth 2); a
      <b>recruitment drive</b> can multiply referral CASH for a time. The <b>Recruiters</b> boards rank the top recruiters
      and families. <b>My Profile</b> (the "My Profile" screen, <code>GET /v1/profile</code>) is your personal page —
      mood, member-since, generation, family, honor, kills, your <b>Top 8</b> recruits with their status, and
      <b>The Take</b>: exactly what recruiting has paid you in cash and $OMR, read straight from the ledger, with
      copy-the-link and share buttons. <b>Spread the Word</b> — three daily social tasks pay a small amount of cash ($300; $500 for all three; a post must STAND 4 hours before it pays — post-and-delete pays nothing)
      and share your referral code. <b>The First Week</b> — an 8-task checklist that pays cash to teach the game, with a
      final bonus. <b>The Coach</b> (the ▸ line on your sheet) always names your best next action.</p>
      ${R(`POST /v1/path · /missions/:id · GET /v1/daily · /daily/:id/claim · POST /v1/heist · GET /v1/onboard · /onboard/:taskId/claim · GET /v1/social · /v1/social/:taskId/claim · GET /v1/leaderboard/recruiters`)}` },

  { id: 'megaproject', group: 'The City & the World', title: 'The Megaproject', tag: 'the city builds a monument',
    html: `<p>The whole server pools value toward ONE announced monument (the City tab). Contribute <b>cash</b>,
    <b>trade goods</b> from your trunk (at catalog base value), or <b>$OMR</b> (at a fixed $83 rate). Every
    contribution is a <b>burn</b> — this buys glory, not power. The city sees milestones at 25/50/75%; when the
    monument completes it joins <b>the skyline</b> forever, and the plaque records every contributor — tiered
    <b>The Architect</b> (top brick) → Foreman → Patron → Builder. The plaque is account-level: your dynasty keeps
    its glory through death. Monuments rise in order: the Cathedral Restoration → the Grand Casino → the
    Founder's Bridge → the Colossus of the Docks.</p>` },
  { id: 'deferred4', group: 'Money & Legit', title: 'The Household, Motions, the House Window & Ring Poker', tag: 'staff wages, the levy, the last-resort lender, real hold\u2019em',
    html: `<p><b>The Household &amp; the Gala</b> (Estate) \u2014 hire staff who draw daily $OMR wages on one
    household clock; stiff them a week and they WALK. With a Butler and a square book, a tier-2+ house throws a
    <b>gala</b> \u2014 a big burn that opens the doors for four hours; every guest lands on your list. The great
    houses rank on their $OMR sunk.</p>
    <p><b>Motions before the Commission</b> (Family) \u2014 a seated boss stakes a $100k treasury deposit to put a
    decree on the ballot; when motions exist, ONLY they are votable. The enacted motion refunds, the rest forfeit.
    The fifth decree, <b>THE LEVY</b>, redirects the family yield to the seated chamber, by seat, instead of the standing board.</p>
    <p><b>The House Window</b> (Shylock) \u2014 the lender of last resort: 35% for 24h, level-scaled cap, and it
    lends ONLY what its vig-fed pool holds. Default and the house always collects \u2014 seizure, the welsher
    mark, the WANTED books.</p>
    <p><b>Ring Poker</b> (the Den) \u2014 real multi-way hold'em with betting streets. The table holds the money:
    cash moves only when you sit or stand; raises cap at the shortest stack; a 90s clock folds stallers; the rake
    comes off the pot. Die at the table and your stack burns. The tournament also runs in <b>BRACKET</b> format
    \u2014 rounds of heats down to a final.</p>` },
  { id: 'slate456', group: 'Risk & Death', title: 'The Dueling Circuit, Clue Scrolls & the Season', tag: 'the ladder, the trail, the twist',
    html: `<p><b>The Dueling Circuit</b> (Wet Work) — the ranked ladder. List yourself with a stake cap,
    challenge anyone listed: your BUILD fights (stats + gear), the stake changes hands minus the 5% rake, and
    your <b>ELO</b> moves. Seasonal (resets every 28 days), dies with your street; lifetime wins are a dynasty
    legend. Rematch-farming the same rival pays less each day.</p>
    <p><b>Clue Scrolls</b> (Streets) — a rare drop on any successful job starts a treasure trail: 3–7 riddles by tier,
    each naming a district (sometimes an hour of day). Travel there and DIG. The last dig opens a <b>casket</b>
    and counts on your lifetime diggers' legend. One hunt at a time; after a casket the streets go quiet 8h.</p>
    <p><b>The Season</b> (the City board) — each 28-day season may carry ONE rule twist from a public pool
    (The Crackdown, Blood in the Streets, The Gold Rush — or a vanilla Dead Quiet). The City banner tells you
    the season's law; it snaps back at rollover.</p>` },
  { id: 'phone', group: 'Reference', title: 'The Cellphone & the Troll Box', tag: 'talking',
    html: `<p><b>The Cellphone</b> (the 📱 button up top) is your personal inbox + direct messages. The
    <b>inbox</b> shows what happened TO you — a convoy jacked, a contract posted on your head, a fee credited.
    <b>The line</b> is player-to-player DMs: pick anyone off the streets and talk. Threads live on your
    ACCOUNT, so they survive death — the heir picks up the phone. 240 characters a line, one message every
    2 seconds, 30-day retention. No money ever rides a message — a "deal" in DMs still has to happen through
    the game's real systems. <b>Blocked lines</b>: block a pest from their thread and they get a dead tone
    (they'll know); the block follows their bloodline until you lift it, and it only mutes their mouth —
    game events still reach you. A 📱 button rides every street in Wet Work, and the mobile thumb bar
    has a cell stop with the unread badge.</p>
    <p><b>The Troll Box</b> (the Live Feed side panel) is public city chat, plus a family-only room. The family
    room shows only messages from AFTER you joined — you can't infiltrate a family and read its back-chat.</p>` },
  { id: 'streetlife', group: 'Reference', title: 'Street Life', tag: 'the corner · the black book · the call',
    html: `<p><b>Word on the Street</b> — every district posts 3 daily tasks (the same board for everyone
    standing there; one CONFLICT job — a jump or a bust — guaranteed). Take a job WHERE it's posted, do the
    work anywhere it happens, collect the envelope back at the district: $400 + 15 respect each, at most 5
    envelopes a day across the whole city. Only work done AFTER you take a job counts.</p>
    <p><b>The block's standing job</b> — work the same district's corner on <b>3 separate days</b> and it pays a
    <b>$1,500 + 40 respect</b> bonus on the last one. A second envelope there today still pays but does not move
    the chain: it is days of showing up, not a busy afternoon.</p>
    <p><b>The Black Book</b> — phone numbers are EARNED, never free. Three ways to a line: <b>meet them</b>
    (any completed face-to-face — a jump, a hire, a fade, a duel — hands BOTH sides the other's number),
    <b>tap them</b> (a wiretap or dossier earns it one-way — they never get yours), or <b>answer</b>
    (whoever rings you reveals their own number). The phone's compose list IS your book; a stranger's 📱
    reads 📵 until you earn the line. How many lines you hold is a <b>rank</b>, and there is a board for the
    busiest books in the city.</p>
    <p><b>Standing</b> — every job you finish for one contact deepens that relationship (a stranger → a regular →
    a friend → family), and a contact who knows you asks for <b>bigger loads and tips better</b>. The money still
    comes from their own pocket, so one who cannot cover the bigger ask simply does not call.</p>
    <p><b>The Call</b> — contacts you've met ring you with paid requests: bring freight to their district
    (base × 1.15) or come see them (a tip). The pay comes from THE CONTACT'S OWN pocket — a real transfer,
    never minted — and an unanswered request lapses in a day.</p>
    <p><b>The Favor</b> — the player-posted call. Put up to 3 requests on the wire: N units of a trade good
    delivered to a district, with the pay <b>escrowed the moment you post it</b>. Everyone holding your number
    sees it; whoever hauls the freight there takes the money on the spot, minus a 2% house cut. That escrow is
    the point — a runner can never cross town and find your pocket empty. Pull it back any time and the money
    returns; nobody runs it in a day and it returns by itself. But escrow is cash outside your pocket, so it is
    NOT a hiding place: no posting from a safehouse, and a killer takes a quarter of every open favor.</p>` },
  { id: 'risks', group: 'Reference', title: 'Risk Factors', tag: 'the honest register',
    html: `<p>Every promise in this game is a formula you can check; this is the other half — what can go wrong,
      stated before you plan around it. Figures are the live levers; if a lever moves, this page moves with it.</p>
      <ul>
      <li><b>Thin launch liquidity.</b> When the token market opens, it starts small by design; ordinary trades can move the price, and
      a round trip pays the sell tax plus slippage. Do not treat the pool as an exit for size.</li>
      <li><b>Selling is taxed.</b> Once the chain market is live, <b>9% comes off the top</b> of every DEX sell. On top of that, $OMR younger than 48 hours
      pays an early-exit surcharge — up to an extra 50% that fades to zero over the window.</li>

const GROUP_ORDER = ['Start','The Basics','Money','Money & Legit','Crews & Family','The City & the World',
  'The Underworld','Risk & Death','The Law','Endgame & Going Legit','The Chain','Reference'];

function render() {
  const doc = document.getElementById('doc');
  const nav = document.getElementById('navlist');
  doc.innerHTML = `<header class="codex-intro">
    <span class="artifact-kicker">Human rulebook · machine truth</span>
    <h1>THE CODEX</h1>
    <p>Search the complete city: what every system does, what it costs, what can go wrong, and which route proves it.</p>
    <div class="artifact-notice artifact-notice--status"><strong>Production status:</strong> the off-chain game and ledger are live. The on-chain extraction rail is built and devnet-proven, but dormant until the audit and launch gates clear.</div>
  </header>`;
  nav.innerHTML = '';
  const groups = {};
  for (const s of SECTIONS) (groups[s.group] = groups[s.group] || []).push(s);
  const order = [...GROUP_ORDER.filter((g) => groups[g]), ...Object.keys(groups).filter((g) => !GROUP_ORDER.includes(g))];
  let n = 0;
  for (const g of order) {
    const gl = document.createElement('div'); gl.className = 'grp'; gl.textContent = g; nav.appendChild(gl);
    for (const s of groups[g]) {
      const a = document.createElement('a'); a.className = 'item'; a.href = '#' + s.id; a.dataset.id = s.id;
      a.textContent = s.title; nav.appendChild(a);
      const sec = document.createElement('section'); sec.id = s.id; sec.setAttribute('aria-labelledby', s.id + '-title');
      n += 1;
      const num = String(n).padStart(2, '0');
      sec.innerHTML = `<span class="num">${num} — ${g}</span><h2 id="${s.id}-title">${s.title}</h2>`
        + `${s.tag ? `<div class="tag">${s.tag}</div>` : ''}${s.html}`;
      doc.appendChild(sec);
    }
  }
  for (const table of doc.querySelectorAll('table')) {
    const scroller = document.createElement('div'); scroller.className = 'table-scroll';
    table.parentNode.insertBefore(scroller, table); scroller.appendChild(table);
  }
  nav.querySelectorAll('a.item').forEach((a) => a.addEventListener('click', () => {
    if (matchMedia('(max-width: 900px)').matches) {
      document.getElementById('nav').classList.add('collapsed');
      document.getElementById('nav-toggle').setAttribute('aria-expanded', 'false');
    }
  }));
  wireScroll();
}
function wireScroll() {
  const links = [...document.querySelectorAll('#nav a.item')];
  const secs = [...document.querySelectorAll('#doc section')];
  const io = new IntersectionObserver((ents) => {
    for (const e of ents) if (e.isIntersecting) {
      links.forEach((l) => {
        const on = l.dataset.id === e.target.id;
        l.classList.toggle('on', on);
        if (on) l.setAttribute('aria-current', 'location'); else l.removeAttribute('aria-current');
      });
      // …and keep the active item in view: the nav is far taller than one screen, so without this
      // the reader's place in the contents silently scrolls out of sight.
      const on = links.find((l) => l.classList.contains('on'));
      if (on) {
        const nav = document.getElementById('nav');
        const r = on.getBoundingClientRect(), nr = nav.getBoundingClientRect();
        if (r.top < nr.top + 8 || r.bottom > nr.bottom - 8) {
          nav.scrollTop += r.top - nr.top - nav.clientHeight / 3;
        }
      }
    }
  }, { rootMargin: '-40% 0px -55% 0px' });
  secs.forEach((s) => io.observe(s));
}
document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  let hits = 0; const matches = [];
  for (const sec of document.querySelectorAll('#doc section')) {
    const hit = !q || sec.textContent.toLowerCase().includes(q);
    if (hit) {
      hits += 1;
      if (q) matches.push({ id: sec.id, title: document.getElementById(sec.id + '-title')?.textContent || sec.id,
        text: sec.textContent });
    }
    sec.style.display = hit ? '' : 'none';
    const link = document.querySelector(`#nav a.item[data-id="${sec.id}"]`);
    if (link) link.classList.toggle('hide', !hit);
  }
  const nav = document.getElementById('nav'), results = document.getElementById('search-results');
  nav.classList.toggle('searching', !!q);
  results.innerHTML = q ? matches.map((hit) => `<a href="#${escText(hit.id)}" data-search-hit="${escText(hit.id)}"><strong>${escText(hit.title)}</strong><span class="search-hit__snippet">${searchExcerpt(hit.text, q)}</span></a>`).join('') : '';
  results.querySelectorAll('[data-search-hit]').forEach((link) => link.addEventListener('click', () => {
    e.target.value = '';
    e.target.dispatchEvent(new Event('input', { bubbles: true }));
  }));
  // A search that hides everything and says nothing reads like a broken page.
  let none = document.getElementById('nohit');
  if (!none) {
    none = document.createElement('div'); none.id = 'nohit'; none.className = 'empty';
    document.getElementById('doc').appendChild(none);
  }
  none.innerHTML = hits ? '' : `<h2 style="color:#8d8578">Nothing matches</h2>`
    + `<p class="lead">The Codex has no section mentioning “${escText(q)}”. Try a task such as heal, borrow, travel, or recruit.</p>`;
  none.style.display = hits ? 'none' : '';
  document.getElementById('search-status').textContent = q ? `${hits} section${hits === 1 ? '' : 's'} found` : '';
});

document.getElementById('nav-toggle').addEventListener('click', () => {
  const nav = document.getElementById('nav');
  const open = nav.classList.toggle('collapsed') === false;
  document.getElementById('nav-toggle').setAttribute('aria-expanded', String(open));
  document.getElementById('nav-toggle').textContent = open ? 'Hide sections' : 'Browse sections';
  if (open) requestAnimationFrame(() => document.getElementById('q').focus());
});

// the way back up, once the reader is deep enough to want one
const totop = document.getElementById('totop');
addEventListener('scroll', () => totop.classList.toggle('show', scrollY > 700), { passive: true });

render();
</script>
