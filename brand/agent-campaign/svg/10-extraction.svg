<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>@font-face{font-family:'Omerta Display';src:url('../../public/art/display.woff2') format('woff2');font-weight:600}</style>
  <defs>
    <linearGradient id="shade-10-extraction" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0909" stop-opacity=".96"/><stop offset=".25" stop-color="#0a0909" stop-opacity=".45"/><stop offset=".55" stop-color="#0a0909" stop-opacity=".35"/><stop offset=".78" stop-color="#0a0909" stop-opacity=".90"/><stop offset="1" stop-color="#0a0909" stop-opacity="1"/></linearGradient>
    <radialGradient id="glow-10-extraction" cx="50%" cy="25%" r="75%"><stop offset="0" stop-color="#cda653" stop-opacity=".09"/><stop offset="1" stop-color="#0a0909" stop-opacity="0"/></radialGradient>
    <filter id="grain-10-extraction"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="17"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
