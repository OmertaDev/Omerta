  <rect width="1080" height="1350" fill="url(#glow-10-extraction)"/>
  <rect width="1080" height="1350" filter="url(#grain-10-extraction)" opacity=".32"/>
  <rect x="30" y="30" width="1020" height="1290" fill="none" stroke="#cda653" stroke-opacity=".25"/>
  <g transform="translate(62 58)"><path d="M0 22 C1 -3 14 -18 37 -18 C60 -18 73 -3 74 22 Z" fill="#cda653"/><ellipse cx="37" cy="22" rx="58" ry="10" fill="#cda653"/><rect x="0" y="11" width="74" height="8" fill="#0a0909"/><text x="92" y="27" fill="#e0bd72" font-family="Georgia, serif" font-size="34" letter-spacing="8">OMERTÀ</text></g>
  <text x="62" y="164" fill="#d36b61" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="3">BUILT · DEVNET-PROVEN · NOT YET OPEN</text><text x="62" y="236" fill="#eee6d7" text-anchor="start" font-family="Omerta Display, Arial Narrow, sans-serif" font-size="70" font-weight="600" letter-spacing="1"><tspan x="62" dy="0">THE RAIL IS BUILT.</tspan><tspan x="62" dy="66">THE GATE IS SHUT.</tspan></text><g transform="translate(62 828)"><g><rect x="0" y="0" width="292" height="44" rx="3" fill="#0a0909cc" stroke="#79b3c7" stroke-opacity=".65"/><circle cx="18" cy="22" r="4" fill="#79b3c7"/><text x="31" y="28" fill="#eee6d7" font-family="Consolas, monospace" font-size="18" letter-spacing=".5">1 · LINK EVM WALLET</text></g><g><rect x="314" y="0" width="294" height="44" rx="3" fill="#0a0909cc" stroke="#cda653" stroke-opacity=".65"/><circle cx="332" cy="22" r="4" fill="#cda653"/><text x="345" y="28" fill="#eee6d7" font-family="Consolas, monospace" font-size="18" letter-spacing=".5">2 · MINT CHARACTER</text></g><g><rect x="630" y="0" width="250" height="44" rx="3" fill="#0a0909cc" stroke="#d36b61" stroke-opacity=".65"/><circle cx="648" cy="22" r="4" fill="#d36b61"/><text x="661" y="28" fill="#eee6d7" font-family="Consolas, monospace" font-size="18" letter-spacing=".5">3 · WITHDRAW*</text></g><g><rect x="0" y="78" width="956" height="246" rx="5" fill="#141214" fill-opacity="0.88" stroke="#433a3e"/><rect x="0" y="78" width="5" height="246" fill="#d36b61"/><text x="24" y="113" fill="#d36b61" text-anchor="start" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="1.5">DORMANT IN PRODUCTION</text><text x="24" y="154" fill="#eee6d7" text-anchor="start" font-family="Georgia, serif" font-size="23" font-weight="400" letter-spacing="0"><tspan x="24" dy="0">No production chain is configured. Withdraw refuses.</tspan><tspan x="24" dy="39">The third-party audit and launch checklist must clear.</tspan><tspan x="24" dy="39">Full-reserve EIP-712 vouchers are already proven end to end.</tspan></text></g></g>
  <g><rect x="62" y="1232" width="956" height="3" fill="#433a3e" opacity="1"/><text x="62" y="1275" fill="#c9c0b1" text-anchor="start" font-family="Consolas, monospace" font-size="17" font-weight="400" letter-spacing="1">OMERTA AGENTS · 10/12</text><text x="1018" y="1275" fill="#e0bd72" text-anchor="end" font-family="Consolas, monospace" font-size="18" font-weight="400" letter-spacing="0">LINK → MINT → WITHDRAW*</text><text x="62" y="1310" fill="#9f9688" text-anchor="start" font-family="Consolas, monospace" font-size="15" font-weight="400" letter-spacing="0">* totalExtracted is 0 for everyone. Do not market extraction as live income.</text></g>
  </svg>