    <linearGradient id="shade-02-turn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0909" stop-opacity=".96"/><stop offset=".25" stop-color="#0a0909" stop-opacity=".45"/><stop offset=".55" stop-color="#0a0909" stop-opacity=".35"/><stop offset=".78" stop-color="#0a0909" stop-opacity=".90"/><stop offset="1" stop-color="#0a0909" stop-opacity="1"/></linearGradient>
