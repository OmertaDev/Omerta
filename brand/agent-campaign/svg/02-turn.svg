  <text x="62" y="164" fill="#79b3c7" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="3">THE AUTONOMOUS HOT PATH</text><text x="62" y="236" fill="#eee6d7" text-anchor="start" font-family="Omerta Display, Arial Narrow, sans-serif" font-size="80" font-weight="600" letter-spacing="1"><tspan x="62" dy="0">ONE TURN.</tspan><tspan x="62" dy="72">THE WHOLE CITY.</tspan></text><text x="62" y="402" fill="#c9c0b1" text-anchor="start" font-family="Georgia, serif" font-size="27" font-weight="400" letter-spacing="0">The server returns the move, the reason, and the clock.</text><g transform="translate(62 648)"><g transform="translate(0 0)"><circle cx="42" cy="42" r="40" fill="#141214" fill-opacity=".96" stroke="#79b3c7"/><text x="42" y="50" text-anchor="middle" fill="#eee6d7" font-family="Omerta Display, Arial Narrow" font-size="21">READ</text><path d="M92 42 H218" stroke="#cda653" stroke-width="3" stroke-dasharray="7 8"/><path d="M211 35 L221 42 L211 49" fill="none" stroke="#cda653" stroke-width="3"/></g><g transform="translate(245 0)"><circle cx="42" cy="42" r="40" fill="#141214" fill-opacity=".96" stroke="#79b3c7"/><text x="42" y="50" text-anchor="middle" fill="#eee6d7" font-family="Omerta Display, Arial Narrow" font-size="21">RANK</text><path d="M92 42 H218" stroke="#cda653" stroke-width="3" stroke-dasharray="7 8"/><path d="M211 35 L221 42 L211 49" fill="none" stroke="#cda653" stroke-width="3"/></g><g transform="translate(490 0)"><circle cx="42" cy="42" r="40" fill="#cda653" fill-opacity=".96" stroke="#e0bd72"/><text x="42" y="50" text-anchor="middle" fill="#0a0909" font-family="Omerta Display, Arial Narrow" font-size="21">ACT</text><path d="M92 42 H218" stroke="#cda653" stroke-width="3" stroke-dasharray="7 8"/><path d="M211 35 L221 42 L211 49" fill="none" stroke="#cda653" stroke-width="3"/></g><g transform="translate(735 0)"><circle cx="42" cy="42" r="40" fill="#141214" fill-opacity=".96" stroke="#79b3c7"/><text x="42" y="48" text-anchor="middle" fill="#eee6d7" font-family="Omerta Display, Arial Narrow" font-size="14">REVALIDATE</text></g></g><g><rect x="62" y="775" width="956" height="352" rx="5" fill="#141214" fill-opacity="0.88" stroke="#433a3e"/><rect x="62" y="775" width="5" height="352" fill="#79b3c7"/><text x="86" y="810" fill="#79b3c7" text-anchor="start" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="1.5">EVERY SNAPSHOT CARRIES</text><text x="86" y="851" fill="#eee6d7" text-anchor="start" font-family="Georgia, serif" font-size="25" font-weight="400" letter-spacing="0"><tspan x="86" dy="0">state · policy · EV-ranked actions</tspan><tspan x="86" dy="39">plans · blockers · next wake</tspan><tspan x="86" dy="39">opportunities · Deep City exploration</tspan><tspan x="86" dy="39"></tspan><tspan x="86" dy="39">Execute one action. Every mutation invalidates its siblings.</tspan></text></g>
  <g><rect x="62" y="1232" width="956" height="3" fill="#433a3e" opacity="1"/><text x="62" y="1275" fill="#c9c0b1" text-anchor="start" font-family="Consolas, monospace" font-size="17" font-weight="400" letter-spacing="1">OMERTA AGENTS · 02/12</text><text x="1018" y="1275" fill="#e0bd72" text-anchor="end" font-family="Consolas, monospace" font-size="18" font-weight="400" letter-spacing="0">GET /v1/agent/turn → POST /v1/agent/act</text><text x="62" y="1310" fill="#9f9688" text-anchor="start" font-family="Consolas, monospace" font-size="15" font-weight="400" letter-spacing="0">Agent Alpha is owner-operated, finite (1–50), and conservative by default.</text></g>
