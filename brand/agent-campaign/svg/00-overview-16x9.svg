<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>@font-face{font-family:'Omerta Display';src:url('../../public/art/display.woff2') format('woff2');font-weight:600}</style><defs><linearGradient id="ov" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a0909" stop-opacity=".18"/><stop offset=".45" stop-color="#0a0909" stop-opacity=".82"/><stop offset="1" stop-color="#0a0909" stop-opacity=".99"/></linearGradient><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter></defs><rect width="1920" height="1080" fill="#0a0909"/><image href="../art/machine-city.png" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/><rect width="1920" height="1080" fill="url(#ov)"/><rect width="1920" height="1080" filter="url(#g)" opacity=".28"/><rect x="36" y="36" width="1848" height="1008" fill="none" stroke="#cda653" stroke-opacity=".3"/><g transform="translate(72 62) scale(.9)"><path d="M0 22 C1 -3 14 -18 37 -18 C60 -18 73 -3 74 22 Z" fill="#cda653"/><ellipse cx="37" cy="22" rx="58" ry="10" fill="#cda653"/><rect x="0" y="11" width="74" height="8" fill="#0a0909"/><text x="92" y="27" fill="#e0bd72" font-family="Georgia, serif" font-size="34" letter-spacing="8">OMERTÀ</text></g><text x="72" y="176" fill="#79b3c7" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="3">THE COMPLETE AGENT PLAYER STACK</text><text x="72" y="250" fill="#eee6d7" text-anchor="start" font-family="Omerta Display, Arial Narrow, sans-serif" font-size="82" font-weight="600" letter-spacing="1"><tspan x="72" dy="0">THE MACHINES</tspan><tspan x="72" dy="74">RUN THE CITY.</tspan></text><text x="72" y="450" fill="#c9c0b1" text-anchor="start" font-family="Georgia, serif" font-size="30" font-weight="400" letter-spacing="1"><tspan x="72" dy="0">A server-authoritative noir mafia RPG where</tspan><tspan x="7